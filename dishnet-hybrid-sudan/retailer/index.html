// CASHBOOK SCREEN — Sales role (Diko)
// Read-only balance cards + today's entries + Add Expense shortcut
// ══════════════════════════════════════════════════════════════════════════
const CashbookScreen = ({ retailer, navigate }) => {
  const [balances, setBal]     = useState(null);
  const [entries,  setEntries] = useState([]);
  const [loading,  setLoading] = useState(true);
  const [showAdd,  setShowAdd] = useState(false);
  const [submitting, setSub]   = useState(false);

  // Add-expense form state
  const [expAmt,  setExpAmt]  = useState('');
  const [expDesc, setExpDesc] = useState('');
  const [expSub,  setExpSub]  = useState('Transport');
  const [expCur,  setExpCur]  = useState('USD');

  // Currency exchange form state
  const [showExch,   setShowExch]  = useState(false);
  const [exchDir,    setExchDir]   = useState('usd_to_ssp');
  const [exchAmt,    setExchAmt]   = useState('');
  const [exchRate,   setExchRate]  = useState('');
  const [exchNote,   setExchNote]  = useState('');
  const [exchSubmit, setExchSubmit]= useState(false);

  const EXPENSE_SUBS = ['Transport','Fuel','Food','Office Supplies','Airtime','Maintenance','Other'];

  const load = async () => {
    setLoading(true);
    try {
      const [b, e] = await Promise.allSettled([
        api.cashbookBalances(),
        api.cashbookEntries({ date_from: _today(), date_to: _today(), actor_id: retailer.id }),
      ]);
      if (b.status === 'fulfilled') setBal(b.value);
      if (e.status === 'fulfilled') setEntries(e.value.entries || e.value || []);
    } catch(_) {}
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const submitExpense = async () => {
    if (!expAmt || parseFloat(expAmt) <= 0) { toast.error('Enter amount'); return; }
    if (!expDesc.trim()) { toast.error('Enter description'); return; }
    setSub(true);
    try {
      await api.cashbookAddEntry({
        currency: expCur, direction: 'out', category: 'expense',
        subcategory: expSub, amount: expAmt, description: expDesc,
      });
      toast.success('Expense logged — pending approval');
      setShowAdd(false); setExpAmt(''); setExpDesc('');
      load();
    } catch(err) {
      toast.error('Failed to save');
    }
    setSub(false);
  };

  const submitExchange = async () => {
    const amt  = parseFloat(exchAmt);
    const rate2 = parseFloat(exchRate);
    if (!amt || amt <= 0)    { toast.error('Enter amount'); return; }
    if (!rate2 || rate2 <= 0){ toast.error('Enter exchange rate'); return; }
    if (exchDir === 'usd_to_ssp' && amt > usdBal + 0.01) {
      toast.error('Amount exceeds USD bag ($' + usdBal.toFixed(2) + ')'); return;
    }
    if (exchDir === 'ssp_to_usd' && amt > sspBal + 1) {
      toast.error('Amount exceeds SSP bag (' + Math.round(sspBal).toLocaleString() + ' SSP)'); return;
    }
    setExchSubmit(true);
    try {
      await api.call('record_exchange', {
        method: 'POST',
        body: { exc_direction: exchDir, exc_amount: amt, exc_rate: rate2, exc_note: exchNote, exc_staff_id: retailer.id },
      });
      const ssp   = exchDir === 'usd_to_ssp' ? Math.round(amt * rate2) : amt;
      const usd   = exchDir === 'usd_to_ssp' ? amt : (amt / rate2).toFixed(2);
      const msg   = exchDir === 'usd_to_ssp'
        ? `✅ $${usd} → ${ssp.toLocaleString()} SSP recorded`
        : `✅ ${Math.round(ssp).toLocaleString()} SSP → $${usd} recorded`;
      toast.success(msg);
      setShowExch(false); setExchAmt(''); setExchNote('');
      load();
    } catch(err) {
      toast.error(err.message || 'Exchange failed');
    }
    setExchSubmit(false);
  };

  const usdBal = balances?.USD?.balance ?? 0;
  const sspBal = balances?.SSP?.balance ?? 0;
  const rate   = balances?.exchange_rate ?? 1300;
  const combined = usdBal + (sspBal / rate);
  const fmt = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtSSP = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' SSP';

  // today's my entries — in/out
  const myIn  = entries.filter(e => e.direction === 'in'  && e.status === 'approved').reduce((s,e)=>s+(+e.amount),0);
  const myOut = entries.filter(e => e.direction === 'out' && e.status === 'approved').reduce((s,e)=>s+(+e.amount),0);

  const CAT_COLOR = { collection:'#065f46', expense:'#7f1d1d', handover:'#4c1d95', topup:'#1e3a5f', forex:'#78350f', adjustment:'#374151' };
  const CAT_ICON  = { collection:'💰', expense:'🧾', handover:'🤝', topup:'➕', forex:'🔄', adjustment:'⚙️' };

  return (
    <div style={{ padding: '16px 16px 100px' }}>

      {loading ? (
        <div style={{ textAlign:'center', padding:60, color:'#94a3b8', fontSize:14 }}>Loading cashbook…</div>
      ) : (
        <>
          {/* ── Balance Cards ── */}
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
            {/* USD */}
            <div style={{ background:'linear-gradient(145deg,#064e3b,#065f46)', borderRadius:18, padding:'18px 14px', color:'#fff' }}>
              <div style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,.55)', letterSpacing:.8, textTransform:'uppercase', marginBottom:4 }}>💵 USD Balance</div>
              <div style={{ fontSize:22, fontWeight:900, letterSpacing:-1 }}>{fmt(usdBal)}</div>
              <div style={{ marginTop:10, display:'flex', justifyContent:'space-between', fontSize:11, color:'rgba(255,255,255,.5)' }}>
                <span>Opening: {fmt(balances?.USD?.opening_balance??0)}</span>
              </div>
            </div>
            {/* SSP */}
            <div style={{ background:'linear-gradient(145deg,#1a237e,#283593)', borderRadius:18, padding:'18px 14px', color:'#fff' }}>
              <div style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,.55)', letterSpacing:.8, textTransform:'uppercase', marginBottom:4 }}>🇸🇸 SSP Balance</div>
              <div style={{ fontSize:22, fontWeight:900, letterSpacing:-1 }}>{fmtSSP(sspBal)}</div>
              <div style={{ marginTop:10, fontSize:11, color:'rgba(255,255,255,.5)' }}>≈ {fmt(sspBal/rate)} @ {Number(rate).toLocaleString()}</div>
            </div>
          </div>

          {/* Combined strip */}
          <div style={{ background:'#141414', borderRadius:14, padding:'12px 16px', marginBottom:16, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div style={{ fontSize:11, fontWeight:700, color:'rgba(255,255,255,.4)', textTransform:'uppercase', letterSpacing:.8 }}>Combined (USD equiv)</div>
            <div style={{ fontSize:20, fontWeight:900, color:'#4ade80' }}>{fmt(combined)}</div>
          </div>

          {/* Today's activity strip */}
          <div style={{ background:'#fff', borderRadius:14, padding:'12px 16px', marginBottom:16, display:'flex', justifyContent:'space-around', border:'1px solid #f1f5f9' }}>
            <div style={{ textAlign:'center' }}>
              <div style={{ fontSize:10, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', marginBottom:3 }}>Today IN</div>
              <div style={{ fontSize:16, fontWeight:900, color:'#065f46' }}>+{fmt(myIn)}</div>
            </div>
            <div style={{ width:1, background:'#f1f5f9' }}></div>
            <div style={{ textAlign:'center' }}>
              <div style={{ fontSize:10, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', marginBottom:3 }}>Today OUT</div>
              <div style={{ fontSize:16, fontWeight:900, color:'#7f1d1d' }}>−{fmt(myOut)}</div>
            </div>
            <div style={{ width:1, background:'#f1f5f9' }}></div>
            <div style={{ textAlign:'center' }}>
              <div style={{ fontSize:10, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', marginBottom:3 }}>Entries</div>
              <div style={{ fontSize:16, fontWeight:900, color:'#1e293b' }}>{entries.length}</div>
            </div>
          </div>

          {/* Add Expense button */}
          <button onClick={() => setShowAdd(true)}
            style={{ width:'100%', padding:'14px', background:'linear-gradient(135deg,#7f1d1d,#991b1b)', border:'none', borderRadius:16, color:'#fff', fontSize:15, fontWeight:800, cursor:'pointer', marginBottom:10, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
            🧾 Log an Expense
          </button>

          {/* Convert Currency button */}
          <button onClick={() => { setExchRate(String(Math.round(rate))); setShowExch(true); }}
            style={{ width:'100%', padding:'14px', background:'linear-gradient(135deg,#4c1d95,#7c3aed)', border:'none', borderRadius:16, color:'#fff', fontSize:15, fontWeight:800, cursor:'pointer', marginBottom:18, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
            💱 Convert Currency
          </button>

          {/* Today's entries list */}
          {entries.length > 0 && (
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:'#94a3b8', textTransform:'uppercase', letterSpacing:.8, marginBottom:10 }}>Today's entries</div>
              {entries.map(e => {
                const isIn = e.direction === 'in';
                const cat  = e.category || 'other';
                const bg   = CAT_COLOR[cat] || '#374151';
                const icon = CAT_ICON[cat]  || '📝';
                const sym  = e.currency === 'SSP' ? 'SSP ' : '$';
                const pending = e.status === 'pending';
                return (
                  <div key={e.id} style={{ background:'#fff', borderRadius:14, padding:'12px 14px', marginBottom:8, display:'flex', alignItems:'center', gap:12, border:'1px solid #f1f5f9', opacity: pending ? 0.7 : 1 }}>
                    <div style={{ width:40, height:40, borderRadius:12, background:bg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0 }}>{icon}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:'#1e293b', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{e.description || cat}</div>
                      <div style={{ fontSize:11, color:'#94a3b8', marginTop:2 }}>
                        {e.currency} · {e.subcategory || cat}
                        {pending && <span style={{ marginLeft:6, background:'#fef3c7', color:'#92400e', padding:'1px 6px', borderRadius:6, fontSize:10, fontWeight:700 }}>pending</span>}
                      </div>
                    </div>
                    <div style={{ textAlign:'right', flexShrink:0 }}>
                      <div style={{ fontSize:15, fontWeight:900, color: isIn ? '#065f46' : '#991b1b' }}>
                        {isIn ? '+' : '−'}{sym}{Number(e.amount).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {entries.length === 0 && (
            <div style={{ textAlign:'center', padding:'32px 0', color:'#cbd5e1' }}>
              <div style={{ fontSize:36, marginBottom:8 }}>📒</div>
              <div style={{ fontSize:14, fontWeight:600 }}>No entries today yet</div>
              <div style={{ fontSize:12, marginTop:4 }}>Collections are logged automatically</div>
            </div>
          )}
        </>
      )}

      {/* ── Add Expense Bottom Sheet ── */}
      {showAdd && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.55)', zIndex:500, display:'flex', alignItems:'flex-end', overflowY:'auto' }}
          onClick={e => { if(e.target===e.currentTarget) setShowAdd(false); }}>
          <div style={{ background:'#fff', borderRadius:'24px 24px 0 0', padding:`8px 20px max(32px,calc(env(safe-area-inset-bottom) + 24px))`, width:'100%', maxWidth:480, margin:'0 auto', boxSizing:'border-box', maxHeight:'92vh', overflowY:'auto' }}>
            {/* Handle */}
            <div style={{ width:40, height:4, background:'#e2e8f0', borderRadius:2, margin:'10px auto 20px' }}></div>
            <div style={{ fontSize:17, fontWeight:800, color:'#1e293b', marginBottom:18 }}>🧾 Log Expense</div>

            {/* Currency toggle */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:14 }}>
              {['USD','SSP'].map(c => (
                <button key={c} type="button" onClick={() => setExpCur(c)}
                  style={{ padding:'10px', borderRadius:12, border:`2px solid ${expCur===c?'#141414':'#e2e8f0'}`, background: expCur===c?'#141414':'#f8fafc', color: expCur===c?'#fff':'#64748b', fontWeight:800, fontSize:13, cursor:'pointer' }}>
                  {c === 'USD' ? '💵 USD' : '🇸🇸 SSP'}
                </button>
              ))}
            </div>

            {/* Expense type */}
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>Expense Type</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                {EXPENSE_SUBS.map(s => (
                  <button key={s} type="button" onClick={() => setExpSub(s)}
                    style={{ padding:'7px 12px', borderRadius:10, border:`1.5px solid ${expSub===s?'#141414':'#e2e8f0'}`, background: expSub===s?'#141414':'#f8fafc', color: expSub===s?'#fff':'#475569', fontSize:12, fontWeight:700, cursor:'pointer' }}>
                    {s}
                  </button>
                ))}
              </div>
            </div>

            {/* Amount */}
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>Amount ({expCur})</div>
              <div style={{ position:'relative' }}>
                <span style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', fontSize:20, fontWeight:900, color:'#94a3b8' }}>{expCur==='SSP'?'S£':'$'}</span>
                <input type="number" inputMode="decimal" value={expAmt} onChange={e=>setExpAmt(e.target.value)}
                  placeholder="0.00" style={{ width:'100%', padding:'14px 14px 14px 42px', border:'1.5px solid #e2e8f0', borderRadius:14, fontSize:26, fontWeight:900, textAlign:'right', boxSizing:'border-box', outline:'none' }} />
              </div>
            </div>

            {/* Description */}
            <div style={{ marginBottom:20 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>What was it for?</div>
              <input type="text" value={expDesc} onChange={e=>setExpDesc(e.target.value)}
                placeholder="e.g. Fuel for site visit — Gudele"
                style={{ width:'100%', padding:'12px', border:'1.5px solid #e2e8f0', borderRadius:12, fontSize:14, boxSizing:'border-box', outline:'none' }} />
            </div>

            <button onClick={submitExpense} disabled={submitting}
              style={{ width:'100%', padding:16, background: submitting?'#94a3b8':'#7f1d1d', border:'none', borderRadius:14, color:'#fff', fontSize:16, fontWeight:900, cursor: submitting?'not-allowed':'pointer' }}>
              {submitting ? 'Saving…' : 'Submit Expense'}
            </button>
          </div>
        </div>
      )}

      {/* ── Currency Exchange Modal ── */}
      {showExch && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.6)', zIndex:500, display:'flex', alignItems:'flex-end' }}
          onClick={e => { if(e.target===e.currentTarget) setShowExch(false); }}>
          <div style={{ background:'#fff', borderRadius:'24px 24px 0 0', padding:`8px 20px max(32px,calc(env(safe-area-inset-bottom) + 24px))`, width:'100%', maxWidth:480, margin:'0 auto', boxSizing:'border-box', maxHeight:'92vh', overflowY:'auto' }}>
            <div style={{ width:40, height:4, background:'#e2e8f0', borderRadius:2, margin:'10px auto 20px' }}></div>
            <div style={{ fontSize:17, fontWeight:800, color:'#1e293b', marginBottom:6 }}>💱 Convert Currency</div>
            <div style={{ fontSize:12, color:'#64748b', marginBottom:16 }}>
              Bag: <strong>${usdBal.toFixed(2)} USD</strong> · <strong>{Math.round(sspBal).toLocaleString()} SSP</strong>
            </div>

            {/* Direction */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:16 }}>
              {[['usd_to_ssp','💵 → 🇸🇸','USD to SSP'],['ssp_to_usd','🇸🇸 → 💵','SSP to USD']].map(([v,icon,lbl]) => (
                <button key={v} type="button" onClick={() => setExchDir(v)}
                  style={{ padding:'12px 8px', borderRadius:14, border:`2px solid ${exchDir===v?'#7c3aed':'#e2e8f0'}`, background: exchDir===v?'#faf5ff':'#f8fafc', color: exchDir===v?'#7c3aed':'#475569', fontWeight:800, fontSize:13, cursor:'pointer', textAlign:'center' }}>
                  <div style={{ fontSize:18, marginBottom:4 }}>{icon}</div>
                  {lbl}
                </button>
              ))}
            </div>

            {/* Amount */}
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>
                {exchDir === 'usd_to_ssp' ? `USD to give (max $${usdBal.toFixed(2)})` : `SSP to give (max ${Math.round(sspBal).toLocaleString()})`}
              </div>
              <div style={{ position:'relative' }}>
                <span style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', fontSize:20, fontWeight:900, color:'#7c3aed' }}>
                  {exchDir === 'usd_to_ssp' ? '$' : 'S£'}
                </span>
                <input type="number" inputMode="decimal" value={exchAmt} onChange={e => setExchAmt(e.target.value)}
                  placeholder="0" style={{ width:'100%', padding:'14px 14px 14px 42px', border:'2px solid #ddd6fe', borderRadius:14, fontSize:26, fontWeight:900, textAlign:'right', boxSizing:'border-box', outline:'none' }} />
              </div>
            </div>

            {/* Rate */}
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>
                Rate (SSP per USD) — system: {Math.round(rate).toLocaleString()}
              </div>
              <input type="number" inputMode="numeric" value={exchRate} onChange={e => setExchRate(e.target.value)}
                style={{ width:'100%', padding:'12px', border:'2px solid #e2e8f0', borderRadius:12, fontSize:18, fontWeight:800, boxSizing:'border-box', outline:'none' }} />
            </div>

            {/* Live result */}
            {parseFloat(exchAmt) > 0 && parseFloat(exchRate) > 0 && (() => {
              const a = parseFloat(exchAmt), r = parseFloat(exchRate);
              const result = exchDir === 'usd_to_ssp'
                ? `${Math.round(a * r).toLocaleString()} SSP`
                : `$${(a / r).toFixed(2)}`;
              const formula = exchDir === 'usd_to_ssp'
                ? `$${a.toFixed(2)} × ${Math.round(r).toLocaleString()} = ${Math.round(a*r).toLocaleString()} SSP`
                : `${Math.round(a).toLocaleString()} SSP ÷ ${Math.round(r).toLocaleString()} = $${(a/r).toFixed(2)}`;
              const over = (exchDir==='usd_to_ssp' && a > usdBal+0.01) || (exchDir==='ssp_to_usd' && a > sspBal+1);
              return (
                <div style={{ background: over ? '#fef2f2' : 'linear-gradient(135deg,#7c3aed,#4f46e5)', borderRadius:14, padding:'14px 16px', marginBottom:14, color: over ? '#dc2626' : '#fff', textAlign:'center' }}>
                  {over
                    ? <div style={{ fontWeight:700, fontSize:14 }}>⚠️ Exceeds bag balance</div>
                    : <>
                        <div style={{ fontSize:11, opacity:.8, marginBottom:4 }}>You will receive</div>
                        <div style={{ fontSize:26, fontWeight:900 }}>{result}</div>
                        <div style={{ fontSize:11, opacity:.7, marginTop:4 }}>{formula}</div>
                      </>
                  }
                </div>
              );
            })()}

            {/* Note */}
            <div style={{ marginBottom:20 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>Note (optional)</div>
              <input type="text" value={exchNote} onChange={e => setExchNote(e.target.value)}
                placeholder="e.g. Exchanged at Juba market"
                style={{ width:'100%', padding:'12px', border:'1.5px solid #e2e8f0', borderRadius:12, fontSize:14, boxSizing:'border-box', outline:'none' }} />
            </div>

            <div style={{ display:'flex', gap:10 }}>
              <button onClick={() => setShowExch(false)}
                style={{ flex:1, padding:14, background:'#f8fafc', border:'1.5px solid #e2e8f0', borderRadius:14, fontSize:14, fontWeight:700, cursor:'pointer' }}>
                Cancel
              </button>
              <button onClick={submitExchange} disabled={exchSubmit}
                style={{ flex:2, padding:14, background: exchSubmit?'#94a3b8':'#7c3aed', border:'none', borderRadius:14, color:'#fff', fontSize:15, fontWeight:800, cursor: exchSubmit?'not-allowed':'pointer' }}>
                {exchSubmit ? 'Recording…' : '💱 Record Exchange'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ══════════════════════════════════════════════════════════════════════════
// ADMIN/ACCOUNTANT ROLE HELPERS
// ══════════════════════════════════════════════════════════════════════════
const isAdminRole = (role) => ['admin','accountant','field_accountant','super_admin'].includes(role)
  || role === 'admin'; // is_admin flag handled in component

// ══════════════════════════════════════════════════════════════════════════
// RUPESH: ADMIN CASHBOOK SCREEN
// Combined ledger: cashbook entries + UCRM direct payments + retailer cash
// ══════════════════════════════════════════════════════════════════════════
const AdminCashbookScreen = ({ retailer, navigate }) => {
  const [tab, setTab]           = useState('ledger');    // ledger | pending | retailers | summary
  const [currency, setCurrency] = useState('USD');
  const [entries, setEntries]   = useState([]);
  const [pending, setPending]   = useState([]);
  const [balances, setBalances] = useState({});
  const [retailerSummary, setRetailerSummary] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [dateFrom, setDateFrom] = useState(_today());
  const [dateTo, setDateTo]     = useState(_today());
  const [actionId, setActionId] = useState(null);  // entry being approved/rejected
  const [rejectReason, setRejectReason] = useState('');
  const [showReject, setShowReject] = useState(false);

  // Add Entry modal state
  const [showEntry,   setShowEntry]  = useState(false);  // tile picker
  const [entryFlow,   setEntryFlow]  = useState(null);   // 'in' | 'exchange' | 'out'
  const [entryCur,    setEntryCur]   = useState('USD');
  const [entryAmt,    setEntryAmt]   = useState('');
  const [entryDesc,   setEntryDesc]  = useState('');
  const [entrySub,    setEntrySub]   = useState('');
  const [entryRate,   setEntryRate]  = useState('');
  const [entryDir,    setEntryDir]   = useState('usd_to_ssp');
  const [entrySaving, setEntrySaving]= useState(false);

  const fmtAmt = (n) => Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const press   = e => { e.currentTarget.style.transform='scale(0.97)'; };
  const release = e => { e.currentTarget.style.transform='scale(1)'; };

  const load = async () => {
    setLoading(true);
    try {
      const [b, e, p] = await Promise.allSettled([
        api.call('cashbook_balances'),
        api.call('cashbook_entries', { params: { date_from: dateFrom, date_to: dateTo, limit: 200 } }),
        api.call('cashbook_pending'),
      ]);
      if (b.status==='fulfilled') setBalances(b.value || {});
      if (e.status==='fulfilled') setEntries(e.value.entries || []);
      if (p.status==='fulfilled') setPending(p.value.pending || []);

      // Load retailer collection summary
      const cols = await api.call('cashbook_retailer_summary', { params: { date_from: dateFrom, date_to: dateTo } }).catch(()=>null);
      if (cols) setRetailerSummary(cols.retailers || []);
    } catch(_){}
    setLoading(false);
  };

  useEffect(() => { load(); }, [dateFrom, dateTo]);

  const approve = async (id) => {
    setActionId(id);
    try {
      await api.call('cashbook_approve', { method:'POST', body:{ entry_id: id } });
      toast.success('Entry approved ✅');
      load();
    } catch(e) { toast.error(e.message); }
    setActionId(null);
  };

  const startReject = (id) => { setActionId(id); setRejectReason(''); setShowReject(true); };
  const confirmReject = async () => {
    if (!rejectReason.trim()) { toast.error('Enter a reason'); return; }
    try {
      await api.call('cashbook_reject', { method:'POST', body:{ entry_id: actionId, reason: rejectReason } });
      toast.success('Entry rejected');
      setShowReject(false); load();
    } catch(e) { toast.error(e.message); }
    setActionId(null);
  };

  const submitEntry = async () => {
    const amt = parseFloat(entryAmt);
    if (!amt || amt <= 0) { toast.error('Enter amount'); return; }
    setEntrySaving(true);
    try {
      if (entryFlow === 'exchange') {
        const rate2 = parseFloat(entryRate);
        if (!rate2 || rate2 <= 0) { toast.error('Enter exchange rate'); setEntrySaving(false); return; }
        await api.call('record_exchange', { method:'POST', body:{
          exc_direction: entryDir, exc_amount: amt, exc_rate: rate2,
          exc_note: entryDesc, exc_staff_id: retailer.id,
        }});
        const result = entryDir === 'usd_to_ssp'
          ? `$${amt.toFixed(2)} → ${Math.round(amt*rate2).toLocaleString()} SSP`
          : `${Math.round(amt).toLocaleString()} SSP → $${(amt/rate2).toFixed(2)}`;
        toast.success('✅ Exchange: ' + result);
      } else {
        await api.call('cashbook_add_entry', { method:'POST', body:{
          direction: entryFlow === 'in' ? 'in' : 'out',
          currency: entryCur,
          amount: amt,
          category: entryFlow === 'in' ? (entryCur === 'SSP' ? 'SSP Received' : 'collection') : 'expense',
          subcategory: entrySub || (entryFlow === 'in' ? 'Receipt' : 'Expense'),
          description: entryDesc || (entryFlow === 'in' ? 'Cash received' : 'Cash payment'),
        }});
        toast.success(entryFlow === 'in' ? '✅ Cash IN recorded' : '✅ Cash OUT recorded');
      }
      setShowEntry(false); setEntryFlow(null);
      setEntryAmt(''); setEntryDesc(''); setEntrySub(''); setEntryRate('');
      load();
    } catch(err) { toast.error(err.message || 'Failed'); }
    setEntrySaving(false);
  };

  const usdBal = balances.USD?.balance || 0;
  const sspBal = balances.SSP?.balance || 0;
  const rate   = balances.rate || 1;
  const combined = usdBal + (sspBal / rate);

  const filtered = entries.filter(e => !currency || e.currency === currency);
  const todayIn  = filtered.filter(e => e.direction==='in'  && e.created_at?.startsWith(_today())).reduce((s,e)=>s+(+e.amount||0),0);
  const todayOut = filtered.filter(e => e.direction==='out' && e.created_at?.startsWith(_today())).reduce((s,e)=>s+(+e.amount||0),0);

  const CAT_ICON = { collection:'💰', expense:'💸', handover:'🤝', topup:'⬆️', opening:'🏦', adjustment:'🔧' };
  const SOURCE_COLOR = { ucrm:'#3b82f6', retailer:'#059669', direct:'#7c3aed', system:'#94a3b8' };

  return (
    <div style={{ paddingBottom:'calc(100px + env(safe-area-inset-bottom))', background:'#F0F2F5' }}>

      {/* ── Balances hero ── */}
      <div style={{ background:'linear-gradient(160deg,#0f172a,#1e293b)', padding:'20px 16px 24px', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'absolute', top:-40, right:-40, width:160, height:160, borderRadius:'50%', border:'1px solid rgba(212,28,28,.15)', pointerEvents:'none' }} />

        {/* USD + SSP side by side */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
          <div style={{ background: currency==='USD'?'rgba(5,150,105,.18)':'rgba(255,255,255,.05)', border:`1.5px solid ${currency==='USD'?'#059669':'rgba(255,255,255,.08)'}`, borderRadius:14, padding:'12px 14px', cursor:'pointer' }}
            onClick={()=>setCurrency('USD')}>
            <div style={{ fontSize:10, color:'rgba(255,255,255,.45)', fontWeight:700, textTransform:'uppercase', letterSpacing:.8 }}>💵 USD Cash</div>
            <div style={{ fontSize:26, fontWeight:900, color:'#4ade80', letterSpacing:-1, marginTop:4 }}>${fmtAmt(usdBal)}</div>
          </div>
          <div style={{ background: currency==='SSP'?'rgba(37,99,235,.2)':'rgba(255,255,255,.05)', border:`1.5px solid ${currency==='SSP'?'#2563eb':'rgba(255,255,255,.08)'}`, borderRadius:14, padding:'12px 14px', cursor:'pointer' }}
            onClick={()=>setCurrency('SSP')}>
            <div style={{ fontSize:10, color:'rgba(255,255,255,.45)', fontWeight:700, textTransform:'uppercase', letterSpacing:.8 }}>🇸🇸 SSP Cash</div>
            <div style={{ fontSize:26, fontWeight:900, color:'#60a5fa', letterSpacing:-1, marginTop:4 }}>{Number(sspBal).toLocaleString('en-US',{maximumFractionDigits:0})}</div>
          </div>
        </div>

        {/* Combined */}
        <div style={{ background:'rgba(255,255,255,.06)', borderRadius:12, padding:'10px 14px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <div style={{ fontSize:10, color:'rgba(255,255,255,.4)', fontWeight:700, textTransform:'uppercase', letterSpacing:.8 }}>Combined USD Equiv</div>
            <div style={{ fontSize:22, fontWeight:900, color:'#fff', marginTop:2 }}>${fmtAmt(combined)}</div>
          </div>
          <div style={{ fontSize:11, color:'rgba(255,255,255,.35)', textAlign:'right' }}>
            1 USD = {Number(rate).toLocaleString('en-US',{maximumFractionDigits:0})} SSP
          </div>
        </div>

        {/* Today strip */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginTop:12 }}>
          {[
            { label:'Today IN',  val:'$'+fmtAmt(todayIn),  col:'#4ade80' },
            { label:'Today OUT', val:'$'+fmtAmt(todayOut), col:'#f87171' },
            { label:'Pending',   val:pending.length,        col:'#fbbf24' },
          ].map((s,i)=>(
            <div key={i} style={{ background:'rgba(255,255,255,.06)', borderRadius:10, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:14, fontWeight:900, color:s.col }}>{s.val}</div>
              <div style={{ fontSize:9, color:'rgba(255,255,255,.35)', fontWeight:700, textTransform:'uppercase', letterSpacing:.5, marginTop:2 }}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Date filter ── */}
      <div style={{ display:'flex', gap:8, padding:'12px 16px', alignItems:'center' }}>
        <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}
          style={{ flex:1, padding:'8px 10px', border:'1.5px solid #e2e8f0', borderRadius:10, fontSize:16, fontWeight:600, background:'#fff', outline:'none' }} />
        <span style={{ color:'#94a3b8', fontSize:12 }}>to</span>
        <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)}
          style={{ flex:1, padding:'8px 10px', border:'1.5px solid #e2e8f0', borderRadius:10, fontSize:16, fontWeight:600, background:'#fff', outline:'none' }} />
        <button onClick={load} style={{ padding:'8px 14px', background:'#1e293b', border:'none', borderRadius:10, color:'#fff', fontSize:13, fontWeight:800, cursor:'pointer' }}>Go</button>
        <button onClick={()=>{ setEntryFlow(null); setEntryAmt(''); setEntryDesc(''); setEntrySub(''); setEntryRate(''); setEntryCur('USD'); setEntryDir('usd_to_ssp'); setShowEntry(true); }}
          style={{ padding:'8px 14px', background:'#D41C1C', border:'none', borderRadius:10, color:'#fff', fontSize:13, fontWeight:800, cursor:'pointer', whiteSpace:'nowrap' }}>
          + Add Entry
        </button>
      </div>

      {/* ── Sub-tabs ── */}
      <div style={{ display:'flex', gap:0, padding:'0 16px 12px', overflowX:'auto' }}>
        {[
          { key:'ledger',    label:'📋 Ledger' },
          { key:'pending',   label:`⏳ Pending${pending.length>0?' ('+pending.length+')':''}` },
          { key:'retailers', label:'🏪 Retailers' },
          { key:'summary',   label:'📊 Summary' },
        ].map(t => (
          <button key={t.key} onClick={()=>setTab(t.key)}
            style={{ padding:'8px 14px', border:'none', borderRadius:20, fontSize:12, fontWeight:800, cursor:'pointer', whiteSpace:'nowrap', marginRight:6,
              background: tab===t.key?'#1e293b':'#fff',
              color: tab===t.key?'#fff':'#64748b',
              boxShadow: tab===t.key?'0 2px 8px rgba(0,0,0,.15)':'none'
            }}>
            {t.label}
          </button>
        ))}
      </div>

      {loading && <div style={{ textAlign:'center', padding:32, color:'#94a3b8' }}>Loading…</div>}

      {/* ══ LEDGER TAB ══ */}
      {!loading && tab==='ledger' && (
        <div style={{ padding:'0 16px' }}>
          {filtered.length === 0 && (
            <div style={{ textAlign:'center', padding:40, color:'#94a3b8' }}>
              <div style={{ fontSize:32 }}>📭</div>
              <div style={{ fontSize:13, fontWeight:600, marginTop:8 }}>No entries for this period</div>
            </div>
          )}
          {filtered.map(e => {
            const isIn   = e.direction === 'in';
            const cat    = e.category || 'adjustment';
            const sym    = e.currency === 'SSP' ? 'S£' : '$';
            const source = e.source || 'direct';
            const isPending = e.status === 'pending';
            return (
              <div key={e.id} style={{ background:'#fff', borderRadius:14, padding:'12px 14px', marginBottom:8,
                borderLeft:`3px solid ${isPending?'#fbbf24':isIn?'#4ade80':'#f87171'}`,
                boxShadow:'0 1px 4px rgba(0,0,0,.05)', opacity: isPending?0.8:1 }}>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <div style={{ fontSize:22, width:36, textAlign:'center', flexShrink:0 }}>{CAT_ICON[cat]||'📝'}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:13, fontWeight:700, color:'#1e293b', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                      {e.description || cat}
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:3, flexWrap:'wrap' }}>
                      <span style={{ fontSize:10, color:'#94a3b8' }}>{e.created_at?.slice(0,16)}</span>
                      <span style={{ fontSize:10, fontWeight:700, color:'#94a3b8' }}>·</span>
                      <span style={{ fontSize:10, fontWeight:700, color:'#64748b' }}>{e.actor_name || 'System'}</span>
                      {/* Source badge — key for Rupesh to know where it came from */}
                      <span style={{ fontSize:9, fontWeight:800, padding:'1px 6px', borderRadius:6,
                        background: source==='ucrm'?'#dbeafe': source==='retailer'?'#dcfce7':'#f1f5f9',
                        color: source==='ucrm'?'#1d4ed8': source==='retailer'?'#15803d':'#64748b' }}>
                        {source==='ucrm'?'UCRM':source==='retailer'?'Retailer':'Direct'}
                      </span>
                      {isPending && <span style={{ fontSize:9, fontWeight:800, padding:'1px 6px', borderRadius:6, background:'#fef3c7', color:'#92400e' }}>PENDING</span>}
                    </div>
                  </div>
                  <div style={{ textAlign:'right', flexShrink:0 }}>
                    <div style={{ fontSize:15, fontWeight:900, color: isIn?'#059669':'#dc2626' }}>
                      {isIn?'+':'-'}{sym}{fmtAmt(e.amount)}
                    </div>
                    <div style={{ fontSize:10, color:'#94a3b8', marginTop:1 }}>{e.currency}</div>
                  </div>
                </div>
                {isPending && (
                  <div style={{ display:'flex', gap:8, marginTop:10, paddingTop:10, borderTop:'1px solid #f1f5f9' }}>
                    <button onClick={()=>approve(e.id)} disabled={actionId===e.id}
                      style={{ flex:1, padding:'8px', background:'#f0fdf4', border:'1.5px solid #86efac', borderRadius:10, color:'#15803d', fontSize:12, fontWeight:800, cursor:'pointer' }}>
                      ✅ Approve
                    </button>
                    <button onClick={()=>startReject(e.id)}
                      style={{ flex:1, padding:'8px', background:'#fef2f2', border:'1.5px solid #fecaca', borderRadius:10, color:'#dc2626', fontSize:12, fontWeight:800, cursor:'pointer' }}>
                      ❌ Reject
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* ══ PENDING TAB ══ */}
      {!loading && tab==='pending' && (
        <div style={{ padding:'0 16px' }}>
          {pending.length === 0 && (
            <div style={{ textAlign:'center', padding:40 }}>
              <div style={{ fontSize:40 }}>✅</div>
              <div style={{ fontSize:14, fontWeight:700, color:'#15803d', marginTop:8 }}>All clear — nothing pending</div>
            </div>
          )}
          {pending.map(e => {
            const sym = e.currency === 'SSP' ? 'S£' : '$';
            return (
              <div key={e.id} style={{ background:'#fff', borderRadius:16, padding:'14px 16px', marginBottom:10, border:'1.5px solid #fde68a', boxShadow:'0 2px 8px rgba(251,191,36,.15)' }}>
                <div style={{ display:'flex', alignItems:'flex-start', gap:12 }}>
                  <div style={{ fontSize:24, flexShrink:0 }}>{CAT_ICON[e.category||'adjustment']||'📝'}</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:14, fontWeight:700, color:'#1e293b' }}>{e.description || e.category}</div>
                    <div style={{ fontSize:11, color:'#64748b', marginTop:2 }}>
                      By <strong>{e.actor_name}</strong> · {e.created_at?.slice(0,16)}
                    </div>
                    {e.reference && <div style={{ fontSize:11, color:'#94a3b8', marginTop:1 }}>Ref: {e.reference}</div>}
                  </div>
                  <div style={{ fontSize:18, fontWeight:900, color: e.direction==='in'?'#059669':'#dc2626', flexShrink:0 }}>
                    {e.direction==='in'?'+':'-'}{sym}{fmtAmt(e.amount)}
                  </div>
                </div>
                <div style={{ display:'flex', gap:8, marginTop:12 }}>
                  <button onClick={()=>approve(e.id)} disabled={actionId===e.id}
                    style={{ flex:1, padding:'10px', background:'#1e293b', border:'none', borderRadius:12, color:'#fff', fontSize:13, fontWeight:800, cursor:'pointer' }}>
                    ✅ Approve
                  </button>
                  <button onClick={()=>startReject(e.id)}
                    style={{ flex:1, padding:'10px', background:'#fff', border:'1.5px solid #e2e8f0', borderRadius:12, color:'#dc2626', fontSize:13, fontWeight:800, cursor:'pointer' }}>
                    ❌ Reject
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ══ RETAILERS TAB — who collected what ══ */}
      {!loading && tab==='retailers' && (
        <div style={{ padding:'0 16px' }}>
          <div style={{ fontSize:11, color:'#94a3b8', fontWeight:700, textTransform:'uppercase', letterSpacing:.8, marginBottom:12 }}>
            Cash collections by staff — {dateFrom} to {dateTo}
          </div>

          {/* Retailer/staff breakdown from cashbook entries */}
          {(() => {
            const byActor = {};
            entries.filter(e => e.category === 'collection' && e.direction === 'in' && e.currency === currency).forEach(e => {
              const k = e.actor_name || 'Unknown';
              if (!byActor[k]) byActor[k] = { name:k, count:0, total:0, pending:0, crm_synced:0 };
              byActor[k].count++;
              byActor[k].total += +e.amount||0;
              if (e.status==='pending') byActor[k].pending++;
              if (e.crm_synced) byActor[k].crm_synced++;
            });
            const actors = Object.values(byActor).sort((a,b)=>b.total-a.total);
            if (actors.length === 0) return (
              <div style={{ textAlign:'center', padding:40, color:'#94a3b8' }}>
                <div style={{ fontSize:32 }}>👥</div>
                <div style={{ fontSize:13, fontWeight:600, marginTop:8 }}>No collections for this period</div>
              </div>
            );
            const sym = currency === 'SSP' ? 'S£' : '$';
            return actors.map((a,i) => (
              <div key={i} style={{ background:'#fff', borderRadius:14, padding:'14px 16px', marginBottom:10, boxShadow:'0 1px 4px rgba(0,0,0,.05)' }}>
                <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                  <div style={{ width:44, height:44, borderRadius:14, background:'#f1f5f9', display:'flex', alignItems:'center', justifyContent:'center', fontSize:20 }}>👤</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:14, fontWeight:800, color:'#1e293b' }}>{a.name}</div>
                    <div style={{ fontSize:11, color:'#94a3b8', marginTop:2 }}>{a.count} collections</div>
                  </div>
                  <div style={{ textAlign:'right' }}>
                    <div style={{ fontSize:18, fontWeight:900, color:'#059669' }}>{sym}{fmtAmt(a.total)}</div>
                    <div style={{ display:'flex', gap:4, marginTop:3, justifyContent:'flex-end' }}>
                      {a.crm_synced > 0 && <span style={{ fontSize:9, fontWeight:800, padding:'1px 5px', borderRadius:5, background:'#dcfce7', color:'#15803d' }}>✅ {a.crm_synced} CRM</span>}
                      {a.pending > 0    && <span style={{ fontSize:9, fontWeight:800, padding:'1px 5px', borderRadius:5, background:'#fef3c7', color:'#92400e' }}>⏳ {a.pending} pending</span>}
                    </div>
                  </div>
                </div>
              </div>
            ));
          })()}

          {/* Total row */}
          {entries.filter(e=>e.category==='collection'&&e.direction==='in'&&e.currency===currency).length > 0 && (
            <div style={{ background:'#1e293b', borderRadius:14, padding:'14px 16px', marginTop:8 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ fontSize:13, fontWeight:800, color:'rgba(255,255,255,.6)', textTransform:'uppercase', letterSpacing:.5 }}>Total Collected</div>
                <div style={{ fontSize:20, fontWeight:900, color:'#4ade80' }}>
                  {currency==='SSP'?'S£':'$'}{fmtAmt(entries.filter(e=>e.category==='collection'&&e.direction==='in'&&e.currency===currency).reduce((s,e)=>s+(+e.amount||0),0))}
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ══ SUMMARY TAB ══ */}
      {!loading && tab==='summary' && (
        <div style={{ padding:'0 16px' }}>
          {['USD','SSP'].map(cur => {
            const curEntries = entries.filter(e => e.currency===cur && e.status!=='rejected');
            const totalIn  = curEntries.filter(e=>e.direction==='in').reduce((s,e)=>s+(+e.amount||0),0);
            const totalOut = curEntries.filter(e=>e.direction==='out').reduce((s,e)=>s+(+e.amount||0),0);
            const sym = cur==='SSP'?'S£':'$';
            const byCategory = {};
            curEntries.forEach(e => {
              const k = e.category || 'other';
              if (!byCategory[k]) byCategory[k] = { in:0, out:0 };
              if (e.direction==='in') byCategory[k].in += +e.amount||0;
              else byCategory[k].out += +e.amount||0;
            });
            return (
              <div key={cur} style={{ background:'#fff', borderRadius:16, padding:'16px', marginBottom:14, boxShadow:'0 2px 8px rgba(0,0,0,.06)' }}>
                <div style={{ fontSize:13, fontWeight:800, color:'#1e293b', marginBottom:12 }}>
                  {cur==='USD'?'💵':'🇸🇸'} {cur} Summary
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14 }}>
                  <div style={{ background:'#f0fdf4', borderRadius:12, padding:'12px' }}>
                    <div style={{ fontSize:10, color:'#15803d', fontWeight:700, textTransform:'uppercase', letterSpacing:.5 }}>Total IN</div>
                    <div style={{ fontSize:22, fontWeight:900, color:'#059669', marginTop:4 }}>{sym}{fmtAmt(totalIn)}</div>
                  </div>
                  <div style={{ background:'#fef2f2', borderRadius:12, padding:'12px' }}>
                    <div style={{ fontSize:10, color:'#dc2626', fontWeight:700, textTransform:'uppercase', letterSpacing:.5 }}>Total OUT</div>
                    <div style={{ fontSize:22, fontWeight:900, color:'#dc2626', marginTop:4 }}>{sym}{fmtAmt(totalOut)}</div>
                  </div>
                </div>
                {Object.entries(byCategory).map(([cat, vals]) => (
                  <div key={cat} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderTop:'1px solid #f1f5f9' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <span style={{ fontSize:16 }}>{CAT_ICON[cat]||'📝'}</span>
                      <span style={{ fontSize:12, fontWeight:700, color:'#475569', textTransform:'capitalize' }}>{cat}</span>
                    </div>
                    <div style={{ textAlign:'right' }}>
                      {vals.in>0  && <span style={{ fontSize:12, fontWeight:700, color:'#059669', marginRight:8 }}>+{sym}{fmtAmt(vals.in)}</span>}
                      {vals.out>0 && <span style={{ fontSize:12, fontWeight:700, color:'#dc2626' }}>−{sym}{fmtAmt(vals.out)}</span>}
                    </div>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}


      {/* ── Add Entry Modal ── */}
      {showEntry && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.65)', zIndex:9400, display:'flex', alignItems:'flex-end' }}
          onClick={e => { if(e.target===e.currentTarget){ setShowEntry(false); setEntryFlow(null); } }}>
          <div style={{ background:'#fff', borderRadius:'24px 24px 0 0', width:'100%', maxWidth:480, margin:'0 auto',
            padding:`8px 20px max(32px,calc(env(safe-area-inset-bottom) + 24px))`, boxSizing:'border-box', maxHeight:'92vh', overflowY:'auto' }}>
            <div style={{ width:40, height:4, background:'#e2e8f0', borderRadius:2, margin:'10px auto 18px' }} />

            {/* ── TILE PICKER ── */}
            {!entryFlow && (<>
              <div style={{ fontSize:17, fontWeight:800, color:'#1e293b', marginBottom:4 }}>Add Entry</div>
              <div style={{ fontSize:13, color:'#64748b', marginBottom:20 }}>Select direction to begin</div>

              {/* Balance strip */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:20 }}>
                <div style={{ background:'#0f172a', borderRadius:14, padding:'14px', textAlign:'center' }}>
                  <div style={{ fontSize:10, color:'rgba(255,255,255,.5)', fontWeight:700, textTransform:'uppercase', letterSpacing:.8, marginBottom:4 }}>💵 USD</div>
                  <div style={{ fontSize:22, fontWeight:900, color:'#4ade80' }}>${fmtAmt(usdBal)}</div>
                </div>
                <div style={{ background:'#1e3a8a', borderRadius:14, padding:'14px', textAlign:'center' }}>
                  <div style={{ fontSize:10, color:'rgba(255,255,255,.5)', fontWeight:700, textTransform:'uppercase', letterSpacing:.8, marginBottom:4 }}>🇸🇸 SSP</div>
                  <div style={{ fontSize:22, fontWeight:900, color:'#93c5fd' }}>{Number(sspBal).toLocaleString('en-US',{maximumFractionDigits:0})}</div>
                </div>
              </div>

              {/* 3 tiles */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, marginBottom:8 }}>
                {[
                  { flow:'in',       icon:'⬆️', label:'Cash IN',  sub:'Receipt',         color:'#ecfdf5', border:'#86efac', icon2:'💰' },
                  { flow:'exchange', icon:'🔄', label:'Exchange', sub:'USD ↔ SSP',       color:'#f5f3ff', border:'#c4b5fd', icon2:'💱' },
                  { flow:'out',      icon:'⬇️', label:'Cash OUT', sub:'Expense · Salary',color:'#fff1f2', border:'#fca5a5', icon2:'💸' },
                ].map(tile => (
                  <button key={tile.flow}
                    onClick={() => { setEntryFlow(tile.flow); if(tile.flow==='exchange') setEntryRate(String(Math.round(rate))); }}
                    style={{ background:tile.color, border:`2px solid ${tile.border}`, borderRadius:18, padding:'18px 8px',
                      cursor:'pointer', textAlign:'center', transition:'transform .12s' }}
                    onMouseDown={press} onMouseUp={release} onTouchStart={press} onTouchEnd={release}>
                    <div style={{ fontSize:28, marginBottom:8 }}>{tile.icon2}</div>
                    <div style={{ fontSize:13, fontWeight:800, color:'#1e293b', marginBottom:3 }}>{tile.label}</div>
                    <div style={{ fontSize:10, color:'#64748b', fontWeight:600 }}>{tile.sub}</div>
                  </button>
                ))}
              </div>
            </>)}

            {/* ── CASH IN FORM ── */}
            {entryFlow === 'in' && (<>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:18 }}>
                <button onClick={() => setEntryFlow(null)} style={{ background:'none', border:'none', fontSize:20, cursor:'pointer', color:'#64748b' }}>←</button>
                <div style={{ fontSize:17, fontWeight:800, color:'#1e293b' }}>💰 Cash IN — Receipt</div>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:14 }}>
                {['USD','SSP'].map(c => (
                  <button key={c} onClick={() => setEntryCur(c)}
                    style={{ padding:'10px', borderRadius:12, border:`2px solid ${entryCur===c?'#059669':'#e2e8f0'}`,
                      background:entryCur===c?'#ecfdf5':'#f8fafc', color:entryCur===c?'#065f46':'#64748b', fontWeight:800, fontSize:13, cursor:'pointer' }}>
                    {c === 'USD' ? '💵 USD' : '🇸🇸 SSP'}
                  </button>
                ))}
              </div>
              <div style={{ marginBottom:14 }}>
                <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>Amount ({entryCur})</div>
                <div style={{ position:'relative' }}>
                  <span style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', fontSize:20, fontWeight:900, color:'#94a3b8' }}>{entryCur==='SSP'?'S£':'$'}</span>
                  <input type="number" inputMode="decimal" value={entryAmt} onChange={e=>setEntryAmt(e.target.value)}
                    placeholder="0.00" style={{ width:'100%', padding:'14px 14px 14px 42px', border:'1.5px solid #e2e8f0', borderRadius:14, fontSize:26, fontWeight:900, textAlign:'right', boxSizing:'border-box', outline:'none' }} />
                </div>
              </div>
              <div style={{ marginBottom:20 }}>
                <div style={{ fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:.5, marginBottom:8 }}>Description</div>
                <input type="text" value={entryDesc} onChange={e=>setEntryDesc(e.target.value)} placeholder="e.g. Cash from customer payment"
                  style={{ width:'100%', padding:'12px', border:'1.5px solid #e2e8f0', borderRadius:12, fontSize:14, boxSizing:'border-box', outline:'none' }} />
              </div>

// Diko never sees "transfer" or "advance" — just picks a colleague,
