const API_BASE = (() => {
  if (typeof window !== "undefined" && window.DISHNET_API_BASE) return window.DISHNET_API_BASE;
  var p = window.location.pathname;
  return p + "?page=api&";
})();

const api = {
  _token: null,
  setToken(t) { this._token = t; },
  clearToken() { this._token = null; },
  async call(action, opts = {}) {
    const { method = "GET", body, params = {} } = opts;
    const qs = new URLSearchParams({ action, ...params }).toString();
    const h = { "Content-Type": "application/json", "Accept": "application/json" };
    if (this._token) h["Authorization"] = "Bearer " + this._token;
    const r = await fetch(API_BASE + qs, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json();
    if (!r.ok || j.status === "error") throw new Error(j.message || "Error");
    return j.data || j;
  },
  login(e, p) { return this.call("login", { method: "POST", body: { email: e, password: p } }); },
  me() { return this.call("me"); },
  devices() { return this.call("devices"); },
  packages() { return this.call("packages"); },
  walletBalance() { return this.call("wallet_balance"); },
  passbook(pg) { return this.call("wallet_passbook", { params: { page: pg||1, per_page: 50 } }); },
  kycSubmit(d) { return this.call("kyc_submit", { method: "POST", body: d }); },
  kycList() { return this.call("kyc_list"); },
  rechargeSubmit(d) { return this.call("recharge_submit", { method: "POST", body: d }); },
  rechargeList() { return this.call("recharge_list"); },
};

// ─── Toast system ──────────────────────────────────────────────────────────
const toastStore = { listeners: [], emit(t) { this.listeners.forEach(f => f(t)); } };
const useToastList = () => {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const h = (t) => setToasts(p => [...p, { ...t, id: Date.now() + Math.random() }]);
    toastStore.listeners.push(h);
    return () => { toastStore.listeners = toastStore.listeners.filter(f => f !== h); };
  }, []);
  useEffect(() => {
    if (!toasts.length) return;
    const t = setTimeout(() => setToasts(p => p.slice(1)), 3500);
    return () => clearTimeout(t);
  }, [toasts]);
  return toasts;
};
const showToast = (msg, type = "success") => toastStore.emit({ msg, type });
const ToastContainer = () => {
  const toasts = useToastList();
  return (
    <div style={{ position:"fixed", top:60, left:"50%", transform:"translateX(-50%)", zIndex:9999, display:"flex", flexDirection:"column", gap:8, width:"100%", maxWidth:440, padding:"0 16px", pointerEvents:"none" }}>

};

// ─── GPS Hook ──────────────────────────────────────────────────────────────
const useGPS = (enabled) => {
  const [active, setActive] = useState(false);
  const timerRef = useRef(null);
  useEffect(() => {
    if (!enabled || !navigator.geolocation) return;
    const send = () => {
      navigator.geolocation.getCurrentPosition(
        (p) => { setActive(true); api.gpsHeartbeat(p.coords.latitude, p.coords.longitude, p.coords.accuracy).catch(() => {}); },
        () => setActive(false),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    };
    send();
    timerRef.current = setInterval(send, 90000);
    return () => { clearInterval(timerRef.current); setActive(false); };
  }, [enabled]);
  return active;
};

const SupportStatusBadge = ({ status }) => {
  const m = { pending:{bg:"#FFFBEB",fg:"#D97706",l:"Pending"}, assigned:{bg:"#EDE9FE",fg:"#7C3AED",l:"Assigned"}, in_progress:{bg:"#FFF7ED",fg:"#EA580C",l:"In Progress"}, ready:{bg:"#ECFDF5",fg:"#059669",l:"Ready ✓"}, approved:{bg:"#F0FDF4",fg:"#16A34A",l:"Approved"}, completed:{bg:"#F0FDF4",fg:"#16A34A",l:"Done ✓"}, rejected:{bg:"#FEF2F2",fg:"#DC2626",l:"Rejected"} };
  const s = m[status]||m.pending;
  return <span style={{ background:s.bg, color:s.fg, padding:"3px 10px", borderRadius:20, fontSize:11, fontWeight:700, whiteSpace:"nowrap" }}>{s.l}</span>;
};

const JobDetailScreen = ({ job: initJob, retailer, navigate }) => {
  const [job, setJob] = useState(initJob);
  const [loading, setLoading] = useState(false);
  const [tab, setTab] = useState("info");
  const [form, setForm] = useState({ onu_serial:job?.onu_serial||"", olt_port:job?.olt_port||"", signal_db:job?.signal_db||"", install_notes:job?.install_notes||"" });
  const [note, setNote] = useState("");
  const isCheckedIn = job?.checkin_at && !job?.checkout_at;

  const checkin = () => {
    setLoading(true);
    const doCheckin = async (lat, lon) => {
      try {
        await api.jobCheckin({ ticket_id: job.id, lat, lon, engineer_name: retailer.name });
        showToast("✅ Checked in!");
        setJob(j=>({...j, checkin_at: new Date().toISOString().replace("T"," ").slice(0,19)}));
      } catch(e) { showToast(e.message,"error"); }
      setLoading(false);
    };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(p=>doCheckin(p.coords.latitude,p.coords.longitude), ()=>doCheckin(null,null), {enableHighAccuracy:true,timeout:8000});
    } else { doCheckin(null,null); }
  };

  const checkout = async () => {
    setLoading(true);
    try {
      await api.jobCheckout({ ticket_id: job.id });
      showToast("Checked out");
      setJob(j=>({...j, checkout_at: new Date().toISOString().replace("T"," ").slice(0,19)}));
    } catch(e) { showToast(e.message,"error"); }
    setLoading(false);
  };

  const saveInstall = async () => {
    if (!form.onu_serial) { showToast("ONU serial required","error"); return; }
    setLoading(true);
    try {
      await api.submitInstall({ ticket_id:job.id, ...form, signal_db: form.signal_db?parseFloat(form.signal_db):null });
      showToast("📡 Install data saved!");
      setJob(j=>({...j,...form}));
    } catch(e) { showToast(e.message,"error"); }
    setLoading(false);
  };

  const markReady = async () => {
    if (!job.onu_serial&&!form.onu_serial) { showToast("Enter ONU serial first","error"); return; }
    setLoading(true);
    try {
      await api.submitReady({ ticket_id:job.id, engineer_name:retailer.name });
      showToast("🔬 Marked ready!");
      setJob(j=>({...j,testing_status:"ready"}));
    } catch(e) { showToast(e.message,"error"); }
    setLoading(false);
  };

  const addNote = async () => {
    if (!note.trim()) return;
    setLoading(true);
    try {
      await api.addNote(job.id, note.trim());
      showToast("📝 Note saved");
      setJob(j=>({...j,ops_notes:[...(j.ops_notes||[]),{note:note.trim(),author:retailer.name,at:new Date().toISOString().replace("T"," ").slice(0,16)}]}));
      setNote("");
    } catch(e) { showToast(e.message,"error"); }
    setLoading(false);
  };

  const fmtT = (d) => d ? new Date(d.replace(" ","T")).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}) : "";

  return (
    <div style={{ padding:`0 16px calc(100px + env(safe-area-inset-bottom))` }}>
      <div style={{ background:"linear-gradient(120deg,#1E293B,#374151)", borderRadius:18, padding:"16px 18px", marginBottom:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ color:"rgba(255,255,255,.5)", fontSize:11, fontWeight:700, letterSpacing:1 }}>TICKET #{job.id}</div>
            <div style={{ color:"#fff", fontSize:18, fontWeight:900, marginTop:3 }}>{job.customer_name||"Customer"}</div>
          </div>
          <SupportStatusBadge status={job.testing_status||"pending"} />
        </div>
        <div style={{ color:"rgba(255,255,255,.6)", fontSize:12, marginTop:8 }}>📍 {job.address||"No address"}</div>
        {job.phone && <a href={"tel:"+job.phone} style={{ display:"inline-flex", alignItems:"center", gap:6, background:"#D41C1C", color:"#fff", borderRadius:10, padding:"7px 14px", fontSize:12, fontWeight:700, textDecoration:"none", marginTop:10 }}>📞 Call: {job.phone}</a>}
      </div>

      <Card>
        <div style={{ fontSize:11, fontWeight:700, color:"#64748B", textTransform:"uppercase", letterSpacing:1, marginBottom:10 }}>Check In/Out</div>
        {!job.checkin_at ? (
          <Btn onClick={checkin} disabled={loading} variant="success" icon="mapPin" full>Check In to This Job</Btn>
        ) : !job.checkout_at ? (
          <div>
            <div style={{ background:"#F0FDF4", borderRadius:10, padding:"10px 14px", fontSize:12, fontWeight:700, color:"#16A34A", marginBottom:10 }}>✅ Checked in at {fmtT(job.checkin_at)}</div>
            <Btn onClick={checkout} disabled={loading} variant="ghost" full>Check Out</Btn>
          </div>
        ) : (
          <div style={{ background:"#F8FAFC", borderRadius:10, padding:"10px 14px", fontSize:12, color:"#64748B" }}>✅ In: {fmtT(job.checkin_at)} → Out: {fmtT(job.checkout_at)}</div>
        )}
      </Card>

      <div style={{ display:"flex", gap:6, background:"#F1F5F9", borderRadius:12, padding:4, marginBottom:14 }}>
        {[["info","Info"],["submit","Install"],["notes","Notes"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{ flex:1, padding:"8px", borderRadius:9, border:"none", fontSize:12, fontWeight:700, cursor:"pointer", background:tab===k?"#fff":"transparent", color:tab===k?"#D41C1C":"#64748B", fontFamily:"inherit" }}>{l}</button>
        ))}
      </div>

      {tab==="info" && (
        <Card>
          {[["ONU Serial",job.onu_serial],["OLT Port",job.olt_port],["Signal",job.signal_db!=null?job.signal_db+" dBm":null],["Engineer",job.assigned_engineer_name||job.engineer],["Scheduled",job.scheduled_date]].filter(([,v])=>v).map(([k,v])=>(
            <div key={k} style={{ display:"flex", justifyContent:"space-between", padding:"8px 0", borderBottom:"1px solid #F1F5F9" }}>
              <span style={{ fontSize:12, color:"#94A3B8", fontWeight:700 }}>{k}</span>
              <span style={{ fontSize:13, color:"#1E293B", fontWeight:700 }}>{v}</span>
            </div>
          ))}
          {job.install_notes && <div style={{ background:"#F8FAFC", borderRadius:10, padding:"10px 12px", marginTop:10, fontSize:12, color:"#374151" }}><b>Notes: </b>{job.install_notes}</div>}
        </Card>
      )}

      {tab==="submit" && (
        <Card>
          {!isCheckedIn&&!job.install_complete && <div style={{ background:"#FFFBEB", borderRadius:10, padding:"10px 14px", fontSize:12, fontWeight:700, color:"#D97706", marginBottom:14 }}>⚠️ Check in first to submit data</div>}
          {job.install_complete && <div style={{ background:"#F0FDF4", borderRadius:10, padding:"10px 14px", fontSize:12, fontWeight:700, color:"#16A34A", marginBottom:14 }}>✅ Installation complete</div>}
          <FieldInput label="ONU Serial *" value={form.onu_serial} onChange={v=>setForm(p=>({...p,onu_serial:v}))} placeholder="e.g. ZTEG1234ABCD" />
          <FieldInput label="OLT Port" value={form.olt_port} onChange={v=>setForm(p=>({...p,olt_port:v}))} placeholder="e.g. PON 1/0/1" />
          <FieldInput label="Signal (dBm)" value={form.signal_db} onChange={v=>setForm(p=>({...p,signal_db:v}))} placeholder="e.g. -20" type="number" />
          <FieldInput label="Notes" value={form.install_notes} onChange={v=>setForm(p=>({...p,install_notes:v}))} placeholder="Observations…" />
          <div style={{ display:"flex", gap:8 }}>
            <Btn onClick={saveInstall} disabled={loading||(!isCheckedIn&&!job.install_complete)} variant="secondary" icon="upload" full>Save</Btn>
            <Btn onClick={markReady} disabled={loading||!isCheckedIn||job.testing_status==="ready"} variant="primary" icon="checkCircle" full>Mark Ready</Btn>
          </div>
        </Card>
      )}

      {tab==="notes" && (
        <div>
          {(job.ops_notes||[]).length===0 && <Card style={{ textAlign:"center", color:"#94A3B8", fontSize:13, padding:"20px" }}>No notes yet</Card>}
          {(job.ops_notes||[]).map((n,i)=>(
            <Card key={i} style={{ padding:"12px 14px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                <span style={{ fontSize:12, fontWeight:800, color:"#374151" }}>{n.author}</span>
                <span style={{ fontSize:11, color:"#94A3B8" }}>{n.at}</span>
              </div>
              <div style={{ fontSize:13, color:"#374151" }}>{n.note}</div>
            </Card>
          ))}
          <Card>
            <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Add a note…" rows={3} style={{ width:"100%", padding:"10px 12px", borderRadius:10, border:"1.5px solid #E2E8F0", fontSize:16, resize:"none", outline:"none", fontFamily:"inherit", marginBottom:10 }} />
            <Btn onClick={addNote} disabled={loading||!note.trim()} variant="secondary" icon="note" full>Add Note</Btn>
          </Card>
        </div>
      )}
    </div>
  );
};

const MyRouteScreen = ({ retailer, navigate }) => {

      const r = await api.myRoute(d);

      setRoute(rd);
      if (rd&&rd.job_ids&&rd.job_ids.length>0) {
        const all = await api.myJobs("all");
        const ids = rd.job_ids.map(Number);
        setJobs((all.tickets||[]).filter(t=>ids.includes(Number(t.id))));
      } else { setJobs([]); }

    setLoading(false);

// ─── Utility ───────────────────────────────────────────────────────────────
const fmt = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
const fmtDate = (d) => d ? new Date(d.replace(' ','T')).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const fmtTime = (d) => d ? new Date(d.replace(' ','T')).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';

// ─── Status Badge ──────────────────────────────────────────────────────────
const StatusBadge = ({ status }) => {
  const map = {
    new: { bg: "#EBF5FF", fg: "#1D4ED8", label: "New" },
    pending_sync: { bg: "#FFFBEB", fg: "#D97706", label: "Pending" },
    synced: { bg: "#ECFDF5", fg: "#059669", label: "Synced" },
    crm_failed: { bg: "#FEF2F2", fg: "#DC2626", label: "Failed" },
    updated: { bg: "#ECFDF5", fg: "#059669", label: "Synced" },
    failed: { bg: "#FEF2F2", fg: "#DC2626", label: "Failed" },
    pending: { bg: "#FFFBEB", fg: "#D97706", label: "Pending" },
    approved: { bg: "#ECFDF5", fg: "#059669", label: "Approved" },
    rejected: { bg: "#FEF2F2", fg: "#DC2626", label: "Rejected" },
  };
  const s = map[status] || map.new;
  return (
    <span style={{ background: s.bg, color: s.fg, padding: "3px 10px", borderRadius: 20, fontSize: 11, fontWeight: 700, letterSpacing: 0.3 }}>

};

// COLLECT SCREEN — full payment collection inside PWA (no browser)
// Shows live CRM sync status so Diko knows exactly what happened
// ══════════════════════════════════════════════════════════════════════════
const CollectScreen = ({ retailer, walletSummary, navigate, onRefresh }) => {
  const [step, setStep]         = useState("search");  // search | invoice | confirm | result
  const [query, setQuery]       = useState("");
  const [results, setResults]   = useState([]);
  const [searching, setSearching] = useState(false);
  const [customer, setCustomer] = useState(null);
  const [invoices, setInvoices] = useState([]);
  const [loadingInv, setLoadingInv] = useState(false);
  const [selInv, setSelInv]     = useState(null);   // selected invoice or null = no invoice
  const [amount, setAmount]     = useState("");
  const [method, setMethod]     = useState("Cash");
  const [svcType, setSvcType]   = useState("starlink");
  const [currency, setCurrency] = useState("USD");
  const [submitting, setSub]    = useState(false);
  const [result, setResult]     = useState(null);   // { success, crmSynced, crmId, error, amount, custName }

  const bal = walletSummary?.balance || 0;
  const fmtAmt = (n) => Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const press   = e => { e.currentTarget.style.transform="scale(0.96)"; };
  const release = e => { e.currentTarget.style.transform="scale(1)"; };

  // ── CRM search ──────────────────────────────────────────────────────────
  const searchTimer = useRef(null);
  const doSearch = async (q) => {
    if (q.length < 2) { setResults([]); return; }
    setSearching(true);
    try {
      const r = await api.call("crm_search", { params: { q, limit: 8 } });
      setResults(r.clients || r || []);
    } catch(_) { setResults([]); }
    setSearching(false);
  };
  const onQueryChange = (v) => {
    setQuery(v);
    clearTimeout(searchTimer.current);
    searchTimer.current = setTimeout(() => doSearch(v), 350);
  };

  // ── Select customer → load invoices ────────────────────────────────────
  const selectCustomer = async (c) => {
    setCustomer(c);
    setSelInv(null);
    setAmount("");
    setStep("invoice");
    setLoadingInv(true);
    try {
      const r = await api.call("crm_client_invoices", { params: { client_id: c.id, status: "unpaid" } });
      setInvoices(r.invoices || r || []);
    } catch(_) { setInvoices([]); }
    setLoadingInv(false);
  };

  // ── Select invoice → pre-fill amount ───────────────────────────────────
  const pickInvoice = (inv) => {
    setSelInv(inv);
    setAmount(String(inv.amount_due || inv.total || ""));
  };

  // ── Submit ──────────────────────────────────────────────────────────────
  const submit = async () => {
    if (!customer || !amount || parseFloat(amount) <= 0) return;
    if (parseFloat(amount) > bal && currency === "USD") {
      toast.error("Amount exceeds wallet balance ($" + fmtAmt(bal) + ")");
      return;
    }
    setSub(true);
    try {
      const r = await api.call("collect_payment", {
        method: "POST",
        body: {
          crm_customer_id: customer.id,
          customer_name:   customer.name || (customer.firstName + " " + customer.lastName),
          invoice_id:      selInv?.id || "",
          amount,
          currency,
          payment_method:  method,
          service_type:    svcType,
        }
      });
      setResult({
        success:    true,
        crmSynced:  r.crm_synced  ?? r.crmSynced  ?? false,
        crmId:      r.crm_payment_id ?? r.crmId   ?? null,
        crmError:   r.crm_error   ?? null,
        amount:     parseFloat(amount),
        custName:   customer.name || (customer.firstName + " " + customer.lastName),
        commission: r.commission  ?? 0,
        newBalance: r.new_balance ?? (bal - parseFloat(amount)),
      });
      setStep("result");
      onRefresh && onRefresh();
    } catch(err) {
      setResult({ success: false, error: err.message, amount: parseFloat(amount), custName: customer?.name || "" });
      setStep("result");
    }
    setSub(false);
  };

  const reset = () => {
    setStep("search"); setQuery(""); setResults([]); setCustomer(null);
    setInvoices([]); setSelInv(null); setAmount(""); setResult(null);
  };

  const QUICK_AMTS = [25,40,50,65,75,100,120,150,200,250,300,500];

  return (
    <div style={{ paddingBottom:'calc(100px + env(safe-area-inset-bottom))' }}>

      {/* ── STEP: Search ── */}
      {step === "search" && (
        <div style={{ padding:"16px" }}>
          <div style={{ background:"#fff", borderRadius:16, padding:"14px 16px", marginBottom:16, boxShadow:"0 2px 12px rgba(0,0,0,.06)" }}>
            <div style={{ fontSize:11, color:"#94a3b8", fontWeight:700, textTransform:"uppercase", letterSpacing:.8, marginBottom:8 }}>💼 Your Wallet</div>
            <div style={{ fontSize:32, fontWeight:900, color:"#1e293b", letterSpacing:-1 }}>{fmt(bal)}</div>
            <div style={{ fontSize:11, color: bal < 50 ? "#dc2626" : "#94a3b8", marginTop:4 }}>
              {bal < 50 ? "⚠️ Low balance — top up before collecting" : "Available to collect"}
            </div>
          </div>

          <div style={{ position:"relative", marginBottom:16 }}>
            <div style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)", fontSize:18, pointerEvents:"none" }}>🔍</div>
            <input
              type="text" value={query} onChange={e => onQueryChange(e.target.value)}
              placeholder="Search customer by name, phone or CRM ID…"
              autoFocus
              style={{ width:"100%", padding:"14px 14px 14px 44px", border:"1.5px solid #e2e8f0", borderRadius:14, fontSize:15, boxSizing:"border-box", outline:"none", background:"#fff" }}
            />
          </div>

          {searching && <div style={{ textAlign:"center", padding:20, color:"#94a3b8" }}>Searching…</div>}

          {results.map(c => {
            const name = c.name || ((c.firstName||"") + " " + (c.lastName||"")).trim();
            return (
              <button key={c.id} onClick={() => selectCustomer(c)}
                style={{ width:"100%", background:"#fff", border:"1px solid #f1f5f9", borderRadius:14, padding:"14px 16px", marginBottom:8, display:"flex", alignItems:"center", gap:12, cursor:"pointer", textAlign:"left", boxShadow:"0 1px 4px rgba(0,0,0,.04)" }}
                onTouchStart={press} onTouchEnd={release}>
                <div style={{ width:42, height:42, borderRadius:12, background:"#f1f5f9", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>
                  {c.type === "fiber" ? "🔌" : "📡"}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:700, color:"#1e293b" }}>{name}</div>
                  <div style={{ fontSize:11, color:"#94a3b8", marginTop:1 }}>CRM #{c.id} · {c.username || c.email || c.phone || ""}</div>
                </div>
                <div style={{ fontSize:18, color:"#cbd5e1" }}>›</div>
              </button>
            );
          })}

          {query.length >= 2 && !searching && results.length === 0 && (
            <div style={{ textAlign:"center", padding:32, color:"#94a3b8" }}>
              <div style={{ fontSize:32, marginBottom:8 }}>😕</div>
              <div style={{ fontSize:14, fontWeight:600 }}>No customers found</div>
              <div style={{ fontSize:12, marginTop:4 }}>Try a different name or CRM ID</div>
            </div>
          )}
        </div>
      )}

      {/* ── STEP: Invoices + amount ── */}
      {step === "invoice" && customer && (
        <div style={{ padding:"16px" }}>
          {/* Customer card */}
          <div style={{ background:"linear-gradient(135deg,#1e293b,#0f172a)", borderRadius:16, padding:"16px 18px", marginBottom:16, color:"#fff", display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ width:48, height:48, borderRadius:14, background:"rgba(255,255,255,.1)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22 }}>👤</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:16, fontWeight:800 }}>{customer.name || (customer.firstName+" "+customer.lastName)}</div>
              <div style={{ fontSize:11, color:"rgba(255,255,255,.5)", marginTop:2 }}>CRM #{customer.id}</div>
            </div>
            <button onClick={()=>{setStep("search"); setCustomer(null);}}
              style={{ background:"rgba(255,255,255,.1)", border:"none", borderRadius:10, padding:"6px 12px", color:"#fff", fontSize:12, fontWeight:700, cursor:"pointer" }}>
              Change
            </button>
          </div>

          {/* Invoices */}
          {loadingInv ? (
            <div style={{ textAlign:"center", padding:24, color:"#94a3b8" }}>Loading invoices…</div>
          ) : invoices.length > 0 ? (
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:11, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:.8, marginBottom:10 }}>
                Outstanding Invoices ({invoices.length})
              </div>
              {invoices.map(inv => (
                <button key={inv.id} onClick={() => pickInvoice(inv)}
                  style={{ width:"100%", background: selInv?.id===inv.id ? "#1e293b" : "#fff", border:`2px solid ${selInv?.id===inv.id?"#1e293b":"#f1f5f9"}`, borderRadius:14, padding:"13px 16px", marginBottom:8, display:"flex", alignItems:"center", gap:12, cursor:"pointer", textAlign:"left" }}
                  onTouchStart={press} onTouchEnd={release}>
                  <div style={{ width:38, height:38, borderRadius:10, background: selInv?.id===inv.id?"rgba(255,255,255,.1)":"#fef3c7", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>📄</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:700, color: selInv?.id===inv.id?"#fff":"#1e293b" }}>Invoice #{inv.id}</div>
                    <div style={{ fontSize:11, color: selInv?.id===inv.id?"rgba(255,255,255,.5)":"#94a3b8", marginTop:1 }}>Due: {inv.due_date || "—"}</div>
                  </div>
                  <div style={{ fontSize:16, fontWeight:900, color: selInv?.id===inv.id?"#4ade80":"#dc2626" }}>
                    ${fmtAmt(inv.amount_due || inv.total)}
                  </div>
                </button>
              ))}
              <button onClick={() => { setSelInv(null); setAmount(""); }}
                style={{ width:"100%", background:"none", border:"1.5px dashed #e2e8f0", borderRadius:12, padding:"11px", color:"#64748b", fontSize:13, fontWeight:700, cursor:"pointer", marginBottom:8 }}>
                Skip — collect without linking to invoice
              </button>
            </div>
          ) : (
            <div style={{ background:"#f8fafc", borderRadius:14, padding:"16px", marginBottom:16, textAlign:"center", color:"#94a3b8" }}>
              <div style={{ fontSize:13, fontWeight:600 }}>No unpaid invoices found</div>
              <div style={{ fontSize:11, marginTop:4 }}>You can still collect a custom amount</div>
            </div>
          )}

          {/* Currency */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:14 }}>
            {["USD","SSP"].map(c => (
              <button key={c} onClick={() => setCurrency(c)}
                style={{ padding:"11px", borderRadius:12, border:`2px solid ${currency===c?"#1e293b":"#e2e8f0"}`, background:currency===c?"#1e293b":"#fff", color:currency===c?"#fff":"#64748b", fontWeight:800, fontSize:13, cursor:"pointer" }}
                onTouchStart={press} onTouchEnd={release}>
                {c==="USD" ? "💵 USD" : "🇸🇸 SSP"}
              </button>
            ))}
          </div>

          {/* Amount */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:11, fontWeight:700, color:"#64748b", textTransform:"uppercase", letterSpacing:.5, marginBottom:8 }}>Amount ({currency})</div>
            <div style={{ position:"relative" }}>
              <span style={{ position:"absolute", left:14, top:"50%", transform:"translateY(-50%)", fontSize:22, fontWeight:900, color:"#94a3b8" }}>{currency==="SSP"?"S£":"$"}</span>
              <input type="number" inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)}
                placeholder="0.00"
                style={{ width:"100%", padding:"15px 15px 15px 44px", border:"1.5px solid #e2e8f0", borderRadius:14, fontSize:28, fontWeight:900, textAlign:"right", boxSizing:"border-box", outline:"none", background:"#fff" }} />
            </div>
            {/* Quick amounts */}
            <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:10 }}>
              {QUICK_AMTS.map(q => (
                <button key={q} onClick={()=>setAmount(String(q))}
                  style={{ padding:"6px 12px", borderRadius:8, border:"1px solid #e2e8f0", background: amount===String(q)?"#1e293b":"#f8fafc", color:amount===String(q)?"#fff":"#475569", fontSize:12, fontWeight:700, cursor:"pointer" }}
                  onTouchStart={press} onTouchEnd={release}>
                  ${q}
                </button>
              ))}
            </div>
          </div>

          {/* Service + Method */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:20 }}>
            <div>
              <div style={{ fontSize:10, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:.5, marginBottom:6 }}>Service</div>
              <select value={svcType} onChange={e=>setSvcType(e.target.value)}
                style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e2e8f0", borderRadius:10, fontSize:16, fontWeight:700, background:"#fff", outline:"none" }}>
                <option value="starlink">📡 Starlink</option>
                <option value="fiber">🔌 Fiber</option>
                <option value="lte">📶 LTE</option>
              </select>
            </div>
            <div>
              <div style={{ fontSize:10, fontWeight:700, color:"#94a3b8", textTransform:"uppercase", letterSpacing:.5, marginBottom:6 }}>Method</div>
              <select value={method} onChange={e=>setMethod(e.target.value)}
                style={{ width:"100%", padding:"10px 12px", border:"1.5px solid #e2e8f0", borderRadius:10, fontSize:16, fontWeight:700, background:"#fff", outline:"none" }}>
                <option value="Cash">💵 Cash</option>
                <option value="Mobile Money">📱 Mobile Money</option>
                <option value="Bank Transfer">🏦 Bank</option>
              </select>
            </div>
          </div>

          {/* Wallet warning */}
          {parseFloat(amount||0) > bal && currency==="USD" && (
            <div style={{ background:"#fef2f2", border:"1px solid #fecaca", borderRadius:12, padding:"10px 14px", marginBottom:14, fontSize:12, color:"#dc2626", fontWeight:600 }}>
              ⚠️ Amount exceeds wallet balance ({fmt(bal)}). Top up first.
            </div>
          )}

          <button onClick={submit} disabled={submitting || !amount || parseFloat(amount||0)<=0}
            style={{ width:"100%", padding:16, background: submitting||!amount?"#94a3b8":"linear-gradient(135deg,#D41C1C,#b91c1c)", border:"none", borderRadius:16, color:"#fff", fontSize:16, fontWeight:900, cursor:submitting||!amount?"not-allowed":"pointer", boxShadow:"0 6px 20px rgba(212,28,28,.3)" }}>
            {submitting ? "Processing…" : `Collect ${amount ? (currency==="SSP"?"S£":"$")+fmtAmt(amount) : "Payment"}`}
          </button>
        </div>
      )}

      {/* ── STEP: Result ── */}
      {step === "result" && result && (
        <div style={{ padding:"32px 20px", textAlign:"center" }}>
          {result.success ? (
            <>
              <div style={{ fontSize:64, marginBottom:16 }}>✅</div>
              <div style={{ fontSize:22, fontWeight:900, color:"#1e293b", marginBottom:6 }}>
                ${fmtAmt(result.amount)} Collected
              </div>
              <div style={{ fontSize:14, color:"#64748b", marginBottom:24 }}>from {result.custName}</div>

              {/* CRM sync status — THE key visibility Diko needs */}
              <div style={{ background: result.crmSynced ? "#f0fdf4" : "#fff7ed", border:`1.5px solid ${result.crmSynced?"#86efac":"#fed7aa"}`, borderRadius:16, padding:"16px 20px", marginBottom:20, textAlign:"left" }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:4 }}>
                  <span style={{ fontSize:22 }}>{result.crmSynced ? "✅" : "⏳"}</span>
                  <div style={{ fontSize:15, fontWeight:800, color: result.crmSynced?"#15803d":"#c2410c" }}>
                    {result.crmSynced ? "Payment posted to CRM" : "CRM sync pending"}
                  </div>
                </div>
                {result.crmSynced
                  ? <div style={{ fontSize:12, color:"#16a34a", marginLeft:32 }}>CRM Payment ID #{result.crmId} — invoice will be marked paid automatically</div>
                  : <div style={{ fontSize:12, color:"#92400e", marginLeft:32 }}>Will retry in background. Rupesh will see it once synced.</div>
                }
              </div>

              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                <button onClick={reset}
                  style={{ padding:14, background:"#1e293b", border:"none", borderRadius:14, color:"#fff", fontSize:14, fontWeight:800, cursor:"pointer" }}
                  onTouchStart={press} onTouchEnd={release}>
                  Collect Again
                </button>
                <button onClick={() => navigate("home")}
                  style={{ padding:14, background:"#f1f5f9", border:"none", borderRadius:14, color:"#1e293b", fontSize:14, fontWeight:800, cursor:"pointer" }}
                  onTouchStart={press} onTouchEnd={release}>
                  Go Home
                </button>
              </div>
            </>
          ) : (
            <>
              <div style={{ fontSize:64, marginBottom:16 }}>❌</div>
              <div style={{ fontSize:20, fontWeight:900, color:"#dc2626", marginBottom:8 }}>Collection Failed</div>
              <div style={{ fontSize:13, color:"#64748b", marginBottom:24 }}>{result.error || "Something went wrong"}</div>
              <button onClick={reset}
                style={{ padding:"14px 32px", background:"#1e293b", border:"none", borderRadius:14, color:"#fff", fontSize:14, fontWeight:800, cursor:"pointer" }}>
                Try Again
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
};

// ─── SCREEN: KYC Form (Multi-step Wizard) ──────────────────────────────────
const KycScreen = ({ navigate, walletBalance, onSubmitted }) => {
  const [step, setStep] = useState(0);
  const [form, setForm] = useState({
    connectivity_type: "New Connection", customer_type: "StarLink", customer_id: "",
    date: new Date().toISOString().slice(0, 10), firstname: "", lastname: "", mobile: "", email: "",
    crm_username: "", kitName: "", kitQty: "1", kitUnit: "Piece", kitNumber: "",
    address_1: "", address_2: "", device_id: "1", package_choice: "1",
    priority: "Low", sales_person: "BBC", sales_type: "Credit", ref: "BBC",
    latitude: "", longitude: "",
  });
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  const set = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const [_devs, _setDevs] = useState([]);
  const [_pkgs, _setPkgs] = useState([]);
  useEffect(() => { api.devices().then(d=>_setDevs(d.devices||d||[])).catch(()=>{}); api.packages().then(d=>_setPkgs(d.packages||d||[])).catch(()=>{}); }, []);
  const devices = (_devs.length?_devs:MOCK_DEVICES).filter(d => form.customer_type === "Fiber" ? d.type === "fiber" : d.type === "starlink");
  const packages = (_pkgs.length?_pkgs:MOCK_PACKAGES).filter(p => form.customer_type === "Fiber" ? p.type === "fiber" : p.type === "starlink");

  const steps = [
    { title: "Customer Info", icon: "user" },
    { title: "Delivery", icon: "mapPin" },
    { title: "Package", icon: "signal" },
    { title: "Review", icon: "check" },
  ];

  const canNext = () => {
    if (step === 0) return form.firstname && form.lastname && form.mobile;
    if (step === 1) return form.address_1;
    return true;
  };

  const handleSubmit = (forceOverride = false) => {
    setSubmitting(true);
    const payload = forceOverride
      ? { ...form, duplicate_confirmed: '1', duplicate_note: 'confirmed-different-by-staff-mobile' }
      : form;
    api.kycSubmit(payload).then(() => { setSubmitting(false); setSubmitted(true); }).catch(e => {
      setSubmitting(false);
      const msg = e.message || '';
      // Detect duplicate phone error from KycService
      if (msg.indexOf('already registered under') !== -1 && !forceOverride) {
        const proceed = window.confirm(
          msg + '\n\n' +
          '─────────────────\n' +
          'Register as a NEW customer anyway?\n\n' +
          'Tap OK to proceed (logged for admin review).\n' +
          'Tap Cancel to change the phone number.'
        );
        if (proceed) {
          handleSubmit(true); // retry with override flag
        }
        return;
      }
      alert(msg);
    });
  };

  if (submitted) {
    return (
      <div style={{ minHeight: "80vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 32, textAlign: "center" }}>
        <div style={{ width: 80, height: 80, borderRadius: "50%", background: "#ECFDF5", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24 }}>
          <Icon name="check" size={40} color="#059669" />
        </div>
        <h2 style={{ fontSize: 22, fontWeight: 800, color: "#1E293B", margin: "0 0 8px" }}>Application Submitted!</h2>
        <p style={{ color: "#64748B", fontSize: 14, margin: "0 0 8px", lineHeight: 1.5 }}>Customer will be contacted by our team soon.</p>
        <p style={{ color: "#00B894", fontSize: 13, fontWeight: 700 }}>CRM ID will be assigned after processing.</p>
        <button onClick={() => navigate("home")} style={{ marginTop: 28, padding: "14px 40px", borderRadius: 14, border: "none", background: "#00B894", color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
          Back to Dashboard
        </button>
      </div>
    );
  }

  // Input helper
  const Input = ({ label, name, type = "text", placeholder, required, ...rest }) => (
    <div style={{ marginBottom: 16 }}>
      <label style={{ fontSize: 12, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6, display: "block" }}>
        {label} {required && <span style={{ color: "#EF4444" }}>*</span>}
      </label>
      <input type={type} value={form[name] || ""} onChange={e => set(name, e.target.value)} placeholder={placeholder}
        style={{ width: "100%", padding: "13px 16px", borderRadius: 12, border: "2px solid #E2E8F0", fontSize: 16, fontWeight: 500, outline: "none", boxSizing: "border-box", background: "#F8FAFC", transition: "0.2s" }}
        onFocus={e => e.target.style.borderColor = "#00B894"} onBlur={e => e.target.style.borderColor = "#E2E8F0"} {...rest} />
    </div>
  );

  const RadioGroup = ({ label, name, options }) => (
    <div style={{ marginBottom: 16 }}>
      <label style={{ fontSize: 12, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 8, display: "block" }}>{label}</label>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {options.map(opt => (
          <button key={opt} onClick={() => set(name, opt)} type="button"
            style={{ padding: "10px 18px", borderRadius: 12, border: form[name] === opt ? "2px solid #00B894" : "2px solid #E2E8F0", background: form[name] === opt ? "#ECFDF5" : "#fff", color: form[name] === opt ? "#059669" : "#64748B", fontSize: 13, fontWeight: 700, cursor: "pointer", transition: "0.15s" }}>
            {opt}
          </button>
        ))}
      </div>
    </div>
  );

  const SelectCard = ({ items, name, renderLabel }) => (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {items.map(item => (
        <button key={item.id} onClick={() => set(name, String(item.id))} type="button"
          style={{ padding: "14px 16px", borderRadius: 14, border: String(form[name]) === String(item.id) ? "2px solid #00B894" : "2px solid #F1F5F9", background: String(form[name]) === String(item.id) ? "#ECFDF5" : "#fff", textAlign: "left", cursor: "pointer", transition: "0.15s", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>{renderLabel(item)}</div>
          {String(form[name]) === String(item.id) && <Icon name="check" size={18} color="#059669" />}
        </button>
      ))}
    </div>
  );

  return (
    <div style={{ paddingBottom:'calc(100px + env(safe-area-inset-bottom))' }}>
      {/* Progress */}
      <div style={{ padding: "0 16px", marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
          {steps.map((s, i) => (
            <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1 }}>
              <div style={{ width: 36, height: 36, borderRadius: 12, background: i <= step ? "#00B894" : "#E2E8F0", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 6, transition: "0.3s" }}>
                <Icon name={s.icon} size={18} color={i <= step ? "#fff" : "#94A3B8"} />
              </div>
              <span style={{ fontSize: 10, fontWeight: 700, color: i <= step ? "#00B894" : "#94A3B8", textAlign: "center" }}>{s.title}</span>
            </div>
          ))}
        </div>
        <div style={{ height: 4, background: "#E2E8F0", borderRadius: 4, overflow: "hidden" }}>
          <div style={{ height: "100%", background: "linear-gradient(90deg, #00B894, #059669)", borderRadius: 4, width: `${((step + 1) / steps.length) * 100}%`, transition: "width 0.4s ease" }} />
        </div>
      </div>

      <div style={{ padding: "0 16px" }}>
        {/* Step 0: Customer Info */}
        {step === 0 && (
          <div>
            <RadioGroup label="Connection Type" name="connectivity_type" options={["New Connection", "Shifting Connection", "Ownership Change"]} />
            <RadioGroup label="Service Type" name="customer_type" options={["StarLink", "Fiber"]} />
            <Input label="First Name" name="firstname" placeholder="Customer first name" required />
            <Input label="Last Name" name="lastname" placeholder="Customer last name" required />
            <Input label="Mobile Number" name="mobile" type="tel" placeholder="+211..." required />
            <Input label="Email" name="email" type="email" placeholder="customer@email.com" />
            <Input label="CRM Username" name="crm_username" placeholder="Leave blank for auto-generate" />
            {form.crm_username === "" && (
              <p style={{ fontSize: 11, color: "#64748B", margin: "-10px 0 10px", padding: "0 4px" }}>
                Auto: <span style={{ color: "#00B894", fontWeight: 700 }}>{form.customer_type === "Fiber" ? "FTTH######" : "STAR######"}</span>
              </p>
            )}
          </div>
        )}

        {/* Step 1: Delivery */}
        {step === 1 && (
          <div>
            <Input label="Address Line 1" name="address_1" placeholder="Street address" required />
            <Input label="Address Line 2" name="address_2" placeholder="Area, landmark" />
            <Input label="Kit Name" name="kitName" placeholder="Starlink Kit" />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Input label="Kit Qty" name="kitQty" type="number" placeholder="1" />
              <Input label="Kit Unit" name="kitUnit" placeholder="Piece" />
            </div>
            <Input label="Kit Number" name="kitNumber" placeholder="KIT-001" />
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <Input label="Latitude" name="latitude" type="number" placeholder="4.85" />
              <Input label="Longitude" name="longitude" type="number" placeholder="31.58" />
            </div>
            <button onClick={() => {
              if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                  set("latitude", p.coords.latitude.toFixed(7));
                  set("longitude", p.coords.longitude.toFixed(7));
                });
              }
            }} type="button" style={{ width: "100%", padding: "12px", borderRadius: 12, border: "2px solid #E2E8F0", background: "#F8FAFC", color: "#64748B", fontSize: 13, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              <Icon name="mapPin" size={16} color="#00B894" /> Detect My Location
            </button>
          </div>
        )}

        {/* Step 2: Hardware & Package */}
        {step === 2 && (
          <div>
            {form.customer_type !== "Fiber" && (
              <>
                <label style={{ fontSize: 12, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10, display: "block" }}>Select Hardware</label>

                  <div>
                    <p style={{ fontSize: 14, fontWeight: 700, color: "#1E293B", margin: 0 }}>{d.title}</p>
                    <p style={{ fontSize: 12, color: "#00B894", fontWeight: 600, margin: "2px 0 0" }}>{d.price}</p>
                  </div>
                )} />
                <div style={{ height: 16 }} />
              </>
            )}
            <label style={{ fontSize: 12, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10, display: "block" }}>Select Package</label>
            <SelectCard items={packages} name="package_choice" renderLabel={p => (
              <div>
                <p style={{ fontSize: 14, fontWeight: 700, color: "#1E293B", margin: 0 }}>{p.name}</p>
                <p style={{ fontSize: 12, color: "#3B82F6", fontWeight: 600, margin: "2px 0 0" }}>{fmt(p.amount)}/month</p>
              </div>
            )} />
            <div style={{ height: 16 }} />
            <RadioGroup label="Priority" name="priority" options={["Low", "Medium", "High"]} />
            <RadioGroup label="Sales Type" name="sales_type" options={["Cash", "Credit"]} />
            {form.sales_type === "Cash" && (
              <div style={{ background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 14, padding: 14, marginTop: 8, display: "flex", alignItems: "center", gap: 10 }}>
                <Icon name="wallet" size={20} color="#D97706" />
                <div>
                  <p style={{ fontSize: 12, fontWeight: 700, color: "#92400E", margin: 0 }}>Cash payment — wallet will be debited</p>
                  <p style={{ fontSize: 13, fontWeight: 800, color: "#D97706", margin: "2px 0 0" }}>Balance: {fmt(walletBalance)}</p>
                </div>
              </div>
            )}
          </div>
        )}

        {/* Step 3: Review */}
        {step === 3 && (
          <div>
            <div style={{ background: "#fff", borderRadius: 18, border: "1px solid #F1F5F9", overflow: "hidden" }}>
              <div style={{ background: "#F8FAFC", padding: "12px 18px", borderBottom: "1px solid #F1F5F9" }}>
                <p style={{ fontSize: 14, fontWeight: 800, color: "#1E293B", margin: 0 }}>Review Application</p>
              </div>
              {[
                ["Customer", `${form.firstname} ${form.lastname}`],
                ["Mobile", form.mobile],
                ["Email", form.email || "—"],
                ["Type", `${form.customer_type} • ${form.connectivity_type}`],
                ["Address", form.address_1],
                ["Kit", `${form.kitName || "—"} × ${form.kitQty}`],
                ["Priority", form.priority],
                ["Sales Type", form.sales_type],
                ["CRM Username", form.crm_username || "(auto-generate)"],
              ].map(([k, v], i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "12px 18px", borderBottom: "1px solid #F8FAFC" }}>
                  <span style={{ fontSize: 13, color: "#94A3B8", fontWeight: 600 }}>{k}</span>
                  <span style={{ fontSize: 13, color: "#1E293B", fontWeight: 700, textAlign: "right", maxWidth: "60%" }}>{v}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Navigation */}
        <div style={{ display: "flex", gap: 12, marginTop: 24 }}>
          {step > 0 && (
            <button onClick={() => setStep(s => s - 1)} style={{ flex: 1, padding: "14px", borderRadius: 14, border: "2px solid #E2E8F0", background: "#fff", color: "#64748B", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>
              Back
            </button>
          )}
          {step < 3 ? (
            <button onClick={() => setStep(s => s + 1)} disabled={!canNext()}
              style={{ flex: 2, padding: "14px", borderRadius: 14, border: "none", background: canNext() ? "#00B894" : "#CBD5E1", color: "#fff", fontSize: 15, fontWeight: 700, cursor: canNext() ? "pointer" : "not-allowed", transition: "0.2s" }}>
              Continue
            </button>
          ) : (
            <button onClick={handleSubmit} disabled={submitting}
              style={{ flex: 2, padding: "14px", borderRadius: 14, border: "none", background: submitting ? "#94A3B8" : "linear-gradient(135deg, #00B894, #059669)", color: "#fff", fontSize: 15, fontWeight: 700, cursor: submitting ? "wait" : "pointer", boxShadow: "0 8px 24px rgba(0,184,148,0.3)" }}>
              {submitting ? "Submitting..." : "Submit Application"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

const RechargeScreen = ({ walletBalance, recharges, navigate, onSubmitted }) => {

  const [note, setNote] = useState("");
  const [submitted, setSubmitted] = useState(false);

  const quickAmounts = [100, 250, 500, 1000, 2000, 5000];

  if (submitted) {
    return (
      <div style={{ minHeight: "60vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 32, textAlign: "center" }}>

        <p style={{ color: "#64748B", fontSize: 14, margin: 0, lineHeight: 1.5 }}>Your wallet will be credited after admin approval.</p>
        <button onClick={() => { setSubmitted(false); setAmount(""); setNote(""); }}
          style={{ marginTop: 24, padding: "12px 32px", borderRadius: 14, border: "none", background: "#00B894", color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
          Submit Another

  return (
    <div style={{ paddingBottom:'calc(100px + env(safe-area-inset-bottom))' }}>
      {/* Balance */}
      <div style={{ margin: "0 16px 20px", background: "linear-gradient(135deg, #ECFDF5, #D1FAE5)", borderRadius: 20, padding: "20px 22px", border: "1px solid #A7F3D0" }}>
        <p style={{ fontSize: 11, fontWeight: 700, color: "#065F46", margin: 0, textTransform: "uppercase", letterSpacing: 0.5 }}>Current Balance</p>
        <p style={{ fontSize: 32, fontWeight: 900, color: "#059669", margin: "4px 0 0", fontFamily: "'DM Sans', monospace" }}>{fmt(walletBalance)}</p>
      </div>

      <div style={{ padding: "0 16px" }}>
        {/* Quick Amount */}
        <label style={{ fontSize: 12, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 10, display: "block" }}>Quick Select Amount</label>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 16 }}>
          {quickAmounts.map(a => (
            <button key={a} onClick={() => setAmount(String(a))}
              style={{ padding: "12px", borderRadius: 12, border: amount === String(a) ? "2px solid #00B894" : "2px solid #E2E8F0", background: amount === String(a) ? "#ECFDF5" : "#fff", color: amount === String(a) ? "#059669" : "#1E293B", fontSize: 15, fontWeight: 800, cursor: "pointer" }}>
              ${a}
            </button>
          ))}
        </div>

        {/* Custom Amount */}
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontSize: 12, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6, display: "block" }}>Or Enter Amount</label>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 16, top: "50%", transform: "translateY(-50%)", fontSize: 18, fontWeight: 800, color: "#94A3B8" }}>$</span>
            <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00"
              style={{ width: "100%", padding: "16px 16px 16px 36px", borderRadius: 14, border: "2px solid #E2E8F0", fontSize: 22, fontWeight: 800, outline: "none", boxSizing: "border-box", background: "#F8FAFC", fontFamily: "'DM Sans', monospace" }}
              onFocus={e => e.target.style.borderColor = "#00B894"} onBlur={e => e.target.style.borderColor = "#E2E8F0"} />
          </div>
        </div>

        {/* Note */}
        <div style={{ marginBottom: 20 }}>
          <label style={{ fontSize: 12, fontWeight: 700, color: "#64748B", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6, display: "block" }}>Payment Reference</label>
          <textarea value={note} onChange={e => setNote(e.target.value)} placeholder="e.g. MTN Mobile Money ref #TX-2026..."
            rows={3} style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: "2px solid #E2E8F0", fontSize: 14, outline: "none", boxSizing: "border-box", background: "#F8FAFC", resize: "none", fontFamily: "inherit" }}
            onFocus={e => e.target.style.borderColor = "#00B894"} onBlur={e => e.target.style.borderColor = "#E2E8F0"} />
        </div>

        <button onClick={() => { if(parseFloat(amount)>0){api.rechargeSubmit({amount:parseFloat(amount),note,payment_method:"mobile_money"}).then(()=>{setSubmitted(true);if(onSubmitted)onSubmitted();}).catch(e=>alert(e.message));} }} disabled={!amount || parseFloat(amount) <= 0}

          Submit Load Request
        </button>

        {/* Request History */}
        <h3 style={{ fontSize: 14, fontWeight: 800, color: "#1E293B", margin: "28px 0 12px" }}>Request History</h3>
        {recharges.map(r => (
          <div key={r.id} style={{ background: "#fff", borderRadius: 16, padding: "14px 18px", marginBottom: 10, boxShadow: "0 2px 6px rgba(0,0,0,0.03)", border: "1px solid #F1F5F9" }}>

            {r.status === "rejected" && r.rejection_reason && (
              <p style={{ fontSize: 12, color: "#DC2626", margin: "6px 0 0", fontWeight: 600 }}>Reason: {r.rejection_reason}</p>
            )}
          </div>
        ))}
      </div>
    </div>
  );
};

              <span style={{ fontSize: 11, fontWeight: 800, color: "#94A3B8", textTransform: "uppercase", letterSpacing: 0.8 }}>HR Self-Service</span>

            <button onClick={() => navigate("payslips")} style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "14px 18px", background: "none", border: "none", borderBottom: "1px solid #F8FAFC", cursor: "pointer", textAlign: "left" }}>
              <span style={{ fontSize: 22 }}>💼</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#1E293B" }}>My Payslips</div>
                <div style={{ fontSize: 12, color: "#94A3B8" }}>View salary history and payment details</div>
              </div>
              <span style={{ marginLeft: "auto", color: "#CBD5E1", fontSize: 18 }}>›</span>
            </button>
            <button onClick={() => navigate("leave")} style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "14px 18px", background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>
              <span style={{ fontSize: 22 }}>🗓️</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#1E293B" }}>Leave Request</div>
                <div style={{ fontSize: 12, color: "#94A3B8" }}>Check balance and request time off</div>
              </div>
              <span style={{ marginLeft: "auto", color: "#CBD5E1", fontSize: 18 }}>›</span>
            </button>
          </div>
        )}

        <button onClick={onLogout}
          style={{ width: "100%", padding: "16px", borderRadius: 16, border: "2px solid #FEE2E2", background: "#FEF2F2", color: "#DC2626", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>

};

// MY PAYSLIPS SCREEN — Staff self-service payslip history (v4.11.0)
// ══════════════════════════════════════════════════════════════════════════
const PayslipsScreen = ({ retailer, navigate }) => {
  const [slips, setSlips] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null);
  const [detail, setDetail] = useState(null);

  useEffect(() => {
    api.hrmMyPayslips().then(d => { setSlips(Array.isArray(d) ? d : []); }).catch(() => {}).finally(() => setLoading(false));
  }, []);

  const loadDetail = async (periodId) => {
    if (expanded === periodId) { setExpanded(null); setDetail(null); return; }
    setExpanded(periodId);
    try {
      const d = await api.hrmPayslip(periodId, retailer.id);
      setDetail(d);
    } catch(e) { setDetail(null); }
  };

  const fmtP = (period) => {
    try { return new Date(period + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
    catch(e) { return period; }
  };

  const statusColor = { paid: '#059669', partial: '#D97706', pending: '#DC2626', held: '#6B7280' };
  const statusBg    = { paid: '#ECFDF5', partial: '#FEF3C7', pending: '#FEE2E2', held: '#F3F4F6' };

  return (
    <div style={{ padding: '0 16px', paddingBottom: 'calc(100px + env(safe-area-inset-bottom))' }}>
      {loading ? (
        <div style={{ textAlign: 'center', padding: 40, color: '#94A3B8' }}>Loading payslips...</div>
      ) : slips.length === 0 ? (
        <div style={{ textAlign: 'center', padding: 40 }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>💼</div>
          <p style={{ color: '#94A3B8', fontSize: 14 }}>No payslips yet. Your salary history will appear here once payroll is processed.</p>
        </div>
      ) : (
        slips.map(s => {
          const st = s.disbursement_status || 'pending';
          const isOpen = expanded === s.period_id;
          return (
            <div key={s.id || s.period_id} style={{ background: '#fff', borderRadius: 16, border: '1px solid #F1F5F9', marginBottom: 10, overflow: 'hidden' }}>
              <div onClick={() => loadDetail(s.period_id)} style={{ padding: '14px 16px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: '#1E293B' }}>{fmtP(s.period || '')}</div>
                  <div style={{ fontSize: 12, color: '#94A3B8', marginTop: 2 }}>
                    Gross: ${Number(s.gross_pay || 0).toFixed(0)} · Net: ${Number(s.net_pay || 0).toFixed(0)}
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 15, fontWeight: 800, color: statusColor[st] || '#1E293B' }}>
                    ${Number(s.total_disbursed || 0).toFixed(0)}
                  </span>
                  <span style={{ fontSize: 10, fontWeight: 700, padding: '2px 8px', borderRadius: 12, background: statusBg[st], color: statusColor[st], textTransform: 'uppercase' }}>{st}</span>
                  <span style={{ fontSize: 12, color: '#CBD5E1', transform: isOpen ? 'rotate(180deg)' : '', transition: 'transform .2s' }}>▼</span>
                </div>
              </div>

              {isOpen && detail && (
                <div style={{ padding: '0 16px 14px', borderTop: '1px solid #F8FAFC' }}>
                  {/* Earnings */}
                  <div style={{ fontSize: 11, fontWeight: 700, color: '#059669', textTransform: 'uppercase', marginTop: 10, marginBottom: 6 }}>Earnings</div>
                  {Object.entries(detail.earnings || {}).filter(([,v]) => v > 0).map(([k,v]) => (
                    <div key={k} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, padding: '3px 0', color: '#475569' }}>
                      <span>{k}</span><span style={{ fontWeight: 600 }}>${Number(v).toFixed(2)}</span>
                    </div>
                  ))}
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, padding: '6px 0', borderTop: '1px dashed #E2E8F0', marginTop: 4, fontWeight: 700, color: '#1E293B' }}>
                    <span>Gross</span><span>${Number(detail.gross_pay || 0).toFixed(2)}</span>
                  </div>

                  {/* Deductions */}
                  {(detail.total_deductions || 0) > 0 && (
                    <>
                      <div style={{ fontSize: 11, fontWeight: 700, color: '#DC2626', textTransform: 'uppercase', marginTop: 10, marginBottom: 6 }}>Deductions</div>
                      {Object.entries(detail.deductions || {}).filter(([,v]) => v > 0).map(([k,v]) => (
                        <div key={k} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, padding: '3px 0', color: '#475569' }}>
                          <span>{k}</span><span style={{ fontWeight: 600 }}>-${Number(v).toFixed(2)}</span>
                        </div>
                      ))}
                    </>
                  )}

                  {/* Net */}
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 16, padding: '10px 0 6px', borderTop: '2px solid #E2E8F0', marginTop: 8, fontWeight: 800, color: '#059669' }}>
                    <span>Net Pay</span><span>${Number(detail.net_pay || 0).toFixed(2)}</span>
                  </div>

                  {/* Payments */}
                  {(detail.disbursements || []).length > 0 && (
                    <>
                      <div style={{ fontSize: 11, fontWeight: 700, color: '#3B82F6', textTransform: 'uppercase', marginTop: 8, marginBottom: 6 }}>Payments Received</div>
                      {detail.disbursements.map((d, i) => (
                        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, padding: '3px 0', color: '#475569' }}>
                          <span>{d.date} — {d.type}</span><span style={{ fontWeight: 600, color: '#059669' }}>${Number(d.amount).toFixed(2)}</span>
                        </div>
                      ))}
                    </>
                  )}

                  {(detail.balance_due || 0) > 0.01 && (
                    <div style={{ marginTop: 8, padding: '8px 12px', background: '#FEF3C7', borderRadius: 10, fontSize: 13, fontWeight: 600, color: '#92400E', textAlign: 'center' }}>
                      Balance remaining: ${Number(detail.balance_due).toFixed(2)}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })
      )}
    </div>
  );
};

// LEAVE SCREEN — Staff leave balances + request submission (v4.11.0)
// ══════════════════════════════════════════════════════════════════════════
const LeaveScreen = ({ retailer, navigate }) => {
  const [tab, setTab]           = useState('balances');
  const [balances, setBal]      = useState([]);
  const [requests, setReqs]     = useState([]);
  const [types, setTypes]       = useState([]);
  const [loading, setLoading]   = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [submitting, setSub]    = useState(false);
  const [msg, setMsg]           = useState('');

  // Form
  const [fType, setFType]   = useState('');
  const [fStart, setFStart] = useState('');
  const [fEnd, setFEnd]     = useState('');
  const [fReason, setFReason] = useState('');

  const load = async () => {
    setLoading(true);
    try {
      const [b, r, t] = await Promise.all([api.hrmLeaveBalance(), api.hrmLeaveRequests(), api.hrmLeaveTypes()]);
      setBal(Array.isArray(b) ? b : []);
      setReqs(Array.isArray(r) ? r : []);
      setTypes(Array.isArray(t) ? t : []);
    } catch(e) {}
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  const submitLeave = async () => {
    if (!fType || !fStart || !fEnd) { setMsg('Please fill all fields'); return; }
    if (fStart > fEnd) { setMsg('End date must be after start date'); return; }
    setSub(true); setMsg('');
    try {
      const res = await api.hrmLeaveSubmit({ leave_type_id: parseInt(fType), start_date: fStart, end_date: fEnd, reason: fReason });
      if (res.ok || res.id) {
        setMsg('Leave request submitted!');
        setShowForm(false); setFType(''); setFStart(''); setFEnd(''); setFReason('');
        load();
      } else {
        setMsg(res.error || 'Failed to submit');
      }
    } catch(e) { setMsg(e.message || 'Error'); }
    setSub(false);
  };

  const cancelReq = async (id) => {
    if (!confirm('Cancel this leave request?')) return;
    try {
      await api.hrmLeaveCancel(id);
      load();
    } catch(e) { setMsg(e.message || 'Error'); }
  };

  const statusStyle = {
    pending:   { bg: '#FEF3C7', color: '#92400E' },
    approved:  { bg: '#ECFDF5', color: '#065F46' },
    rejected:  { bg: '#FEE2E2', color: '#991B1B' },
    cancelled: { bg: '#F3F4F6', color: '#6B7280' },
  };

  const fmtD = (d) => { try { return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); } catch(e) { return d; } };

  return (
    <div style={{ padding: '0 16px', paddingBottom: 'calc(100px + env(safe-area-inset-bottom))' }}>

      {/* Tabs */}
      <div style={{ display: 'flex', gap: 0, marginBottom: 14 }}>
        {['balances', 'requests'].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            flex: 1, padding: '10px 0', fontSize: 13, fontWeight: 700, border: '1px solid #E2E8F0', background: tab === t ? '#2563EB' : '#fff',
            color: tab === t ? '#fff' : '#64748B', cursor: 'pointer', borderRadius: t === 'balances' ? '12px 0 0 12px' : '0 12px 12px 0',
          }}>{t === 'balances' ? 'My Balances' : 'My Requests'}</button>
        ))}
      </div>

      {msg && (
        <div style={{ padding: '10px 14px', borderRadius: 12, marginBottom: 12, fontSize: 13, fontWeight: 600,
          background: msg.includes('submitted') || msg.includes('success') ? '#ECFDF5' : '#FEF3C7',
          color: msg.includes('submitted') || msg.includes('success') ? '#065F46' : '#92400E',
          border: '1px solid ' + (msg.includes('submitted') ? '#6EE7B7' : '#FDE68A') }}>
          {msg}
        </div>
      )}

      {loading ? (
        <div style={{ textAlign: 'center', padding: 40, color: '#94A3B8' }}>Loading...</div>
      ) : tab === 'balances' ? (
        <>
          {/* Balance cards */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: 10, marginBottom: 16 }}>
            {balances.filter(b => b.entitlement > 0 || b.leave_type_code === 'UL').map(b => {
              const pct = b.entitlement > 0 ? Math.min(100, Math.round((b.available / (b.entitlement + (b.carried||0))) * 100)) : 100;
              const barColor = pct > 50 ? '#10B981' : pct > 20 ? '#F59E0B' : '#EF4444';
              return (
                <div key={b.leave_type_id} style={{ background: '#fff', borderRadius: 14, border: '1px solid #F1F5F9', padding: 14, textAlign: 'center' }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: b.color || '#6B7280', textTransform: 'uppercase', marginBottom: 6 }}>{b.leave_type_code}</div>
                  <div style={{ fontSize: 24, fontWeight: 900, color: '#1E293B' }}>{b.available}</div>
                  <div style={{ fontSize: 11, color: '#94A3B8' }}>of {b.entitlement + (b.carried||0)} days</div>
                  <div style={{ height: 4, background: '#F1F5F9', borderRadius: 2, marginTop: 8, overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: pct + '%', background: barColor, borderRadius: 2 }} />
                  </div>
                  {b.taken > 0 && <div style={{ fontSize: 10, color: '#94A3B8', marginTop: 4 }}>{b.taken} taken</div>}
                </div>
              );
            })}
          </div>

          {/* New request button */}
          <button onClick={() => setShowForm(!showForm)} style={{
            width: '100%', padding: 14, borderRadius: 14, border: 'none', background: showForm ? '#F1F5F9' : '#2563EB',
            color: showForm ? '#64748B' : '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer', marginBottom: 14,
          }}>{showForm ? 'Cancel' : '+ Request Leave'}</button>

          {/* Leave request form */}
          {showForm && (
            <div style={{ background: '#fff', borderRadius: 16, border: '1px solid #E2E8F0', padding: 16, marginBottom: 14 }}>
              <div style={{ marginBottom: 10 }}>
                <label style={{ fontSize: 11, fontWeight: 700, color: '#64748B', display: 'block', marginBottom: 4 }}>LEAVE TYPE</label>
                <select value={fType} onChange={e => setFType(e.target.value)} style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: '1px solid #E2E8F0', fontSize: 14 }}>
                  <option value="">Select type...</option>
                  {types.map(t => <option key={t.id} value={t.id}>{t.name} ({t.days_per_year > 0 ? t.days_per_year + 'd/yr' : 'Unlimited'})</option>)}
                </select>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
                <div>
                  <label style={{ fontSize: 11, fontWeight: 700, color: '#64748B', display: 'block', marginBottom: 4 }}>FROM</label>
                  <input type="date" value={fStart} onChange={e => setFStart(e.target.value)} style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: '1px solid #E2E8F0', fontSize: 14, boxSizing: 'border-box' }} />
                </div>
                <div>
                  <label style={{ fontSize: 11, fontWeight: 700, color: '#64748B', display: 'block', marginBottom: 4 }}>TO</label>
                  <input type="date" value={fEnd} onChange={e => setFEnd(e.target.value)} style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: '1px solid #E2E8F0', fontSize: 14, boxSizing: 'border-box' }} />
                </div>
              </div>
              <div style={{ marginBottom: 12 }}>
                <label style={{ fontSize: 11, fontWeight: 700, color: '#64748B', display: 'block', marginBottom: 4 }}>REASON (optional)</label>
                <input type="text" value={fReason} onChange={e => setFReason(e.target.value)} placeholder="Family event, medical..." style={{ width: '100%', padding: '10px 12px', borderRadius: 10, border: '1px solid #E2E8F0', fontSize: 14, boxSizing: 'border-box' }} />
              </div>
              <button onClick={submitLeave} disabled={submitting} style={{
                width: '100%', padding: 14, borderRadius: 14, border: 'none', background: '#059669', color: '#fff',
                fontSize: 14, fontWeight: 700, cursor: 'pointer', opacity: submitting ? 0.6 : 1,
              }}>{submitting ? 'Submitting...' : 'Submit Request'}</button>
            </div>
          )}
        </>
      ) : (
        /* Requests tab */
        requests.length === 0 ? (
          <div style={{ textAlign: 'center', padding: 40, color: '#94A3B8', fontSize: 14 }}>No leave requests yet.</div>
        ) : (
          requests.map(r => {
            const ss = statusStyle[r.status] || statusStyle.pending;
            const days = Math.max(1, Math.ceil((new Date(r.end_date) - new Date(r.start_date)) / 86400000) + 1);
            return (
              <div key={r.id} style={{ background: '#fff', borderRadius: 14, border: '1px solid #F1F5F9', padding: '14px 16px', marginBottom: 10 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: '#1E293B' }}>{r.leave_type_name}</span>
                  <span style={{ fontSize: 10, fontWeight: 700, padding: '2px 10px', borderRadius: 12, background: ss.bg, color: ss.color, textTransform: 'uppercase' }}>{r.status}</span>
                </div>
                <div style={{ fontSize: 13, color: '#64748B' }}>
                  {fmtD(r.start_date)} — {fmtD(r.end_date)} ({r.days || days} day{(r.days || days) > 1 ? 's' : ''})
                </div>
                {r.reason && <div style={{ fontSize: 12, color: '#94A3B8', marginTop: 4 }}>{r.reason}</div>}
                {r.status === 'rejected' && r.rejection_reason && (
                  <div style={{ fontSize: 12, color: '#DC2626', marginTop: 4 }}>Reason: {r.rejection_reason}</div>
                )}
                {r.status === 'approved' && r.approved_by && (
                  <div style={{ fontSize: 11, color: '#059669', marginTop: 4 }}>Approved by {r.approved_by}</div>
                )}
                {(r.status === 'pending' || r.status === 'approved') && (
                  <button onClick={() => cancelReq(r.id)} style={{
                    marginTop: 8, padding: '6px 14px', borderRadius: 8, border: '1px solid #FECACA', background: '#FEF2F2',
                    color: '#DC2626', fontSize: 12, fontWeight: 600, cursor: 'pointer',
                  }}>Cancel Request</button>
                )}
              </div>
            );
          })
        )
      )}
    </div>
  );
};
