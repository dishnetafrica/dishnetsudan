  // ── Scanner (leader only) — Hybrid: real-time barcode + OCR snap fallback ──
  const ScannerView = () => {
    const [cats, setCats2] = useState([]);
    const [selCat, setSelCat] = useState(null);
    const [scanned, setScanned] = useState([]);
    const [scanning, setScanning] = useState(false);
    const [lastScan, setLastScan] = useState('');
    const [submitting, setSubmitting] = useState(false);
    const [result, setResult] = useState('');
    const [ocrStatus, setOcrStatus] = useState(''); // '', 'loading', 'reading', 'done'
    const [ocrFound, setOcrFound] = useState([]); // [{type, value}]
    const [manualVal, setManualVal] = useState('');
    const [mode, setMode] = useState('barcode'); // 'barcode' | 'ocr'
    const [costOverride, setCostOverride] = useState('');
    const [location, setLocation] = useState('DishNet UNMISS');
    const [scanStatus, setScanStatus] = useState('idle'); // idle|starting|searching|found|no_barcode|error
    const [scanElapsed, setScanElapsed] = useState(0);    // seconds since scan started
    const [scanAttempts, setScanAttempts] = useState(0);   // barcode frames checked (approx)
    const scanTimerRef = useRef(null);
    const scannerInstance = useRef(null);
    const videoRef = useRef(null);      // for OCR mode direct camera
    const streamRef = useRef(null);     // for OCR mode stream
    const canvasRef = useRef(null);

    // Regex patterns for Starlink identifiers
    const RX_KIT = /KIT[A-Z0-9]{8,16}/gi;
    const RX_DISH = /(2ABC|HPCP|HPBA)[A-Z0-9]{12,14}/gi;
    const RX_SN = /\bSN[:\s]*([A-Z0-9]{12,20})/gi;

    useEffect(() => {
      stockApi('stock_categories', { params:{active_only:1} }).then(r=>setCats2((r?.data||[]).filter(c=>c.track_mode==='serial')));
      return () => {
        if(scannerInstance.current) try{scannerInstance.current.stop();}catch(e){}
        if(streamRef.current) try{streamRef.current.getTracks().forEach(t=>t.stop());}catch(e){}
        if(scanTimerRef.current) clearInterval(scanTimerRef.current);
      };
    }, []);

    const playBeep = (ok) => {
      try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?800:300;g.gain.value=0.15;o.start();o.stop(ctx.currentTime+(ok?0.12:0.25));}catch(e){}
    };

    const extractIdentifiers = (text) => {
      const found = [];
      let m;
      // KIT pattern (primary Starlink)
      const kitRx = /KIT[A-Z0-9]{8,16}/gi;
      while((m=kitRx.exec(text))!==null) found.push({type:'KIT',value:m[0].toUpperCase()});
      // Dish pattern
      const dishRx = /(2ABC|HPCP|HPBA)[A-Z0-9]{12,14}/gi;
      while((m=dishRx.exec(text))!==null) {
        const v=m[0].toUpperCase();
        if(!found.some(f=>f.value===v)) found.push({type:'Dish',value:v});
      }
      // SN: pattern
      const snRx = /\bSN[:\s]*([A-Z0-9]{12,20})/gi;
      while((m=snRx.exec(text))!==null) {
        const v=m[1].toUpperCase();
        if(!found.some(f=>f.value===v)) found.push({type:'SN',value:v});
      }
      return found;
    };

    const addSerial = (text) => {
      text = text.trim().toUpperCase();
      if(!text) return false;
      if(scanned.some(s=>s===text)){ playBeep(false); return false; }
      setScanned(prev=>[...prev, text]);
      setLastScan(text);
      playBeep(true);
      return true;
    };

    // ─── SCAN TIMER — tracks elapsed seconds + attempts ───
    const startScanTimer = () => {
      setScanElapsed(0); setScanAttempts(0);
      if(scanTimerRef.current) clearInterval(scanTimerRef.current);
      scanTimerRef.current = setInterval(() => setScanElapsed(prev => prev + 1), 1000);
    };
    const stopScanTimer = () => {
      if(scanTimerRef.current){ clearInterval(scanTimerRef.current); scanTimerRef.current = null; }
      setScanStatus('idle');
    };

    // ─── BARCODE MODE: html5-qrcode real-time ───
    const startBarcode = () => {
      if(!window.Html5Qrcode){
        setScanStatus('starting');
        const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
        const timeout=setTimeout(()=>{
          s.onload=null;s.onerror=null;
          setScanStatus('error');
          alert('Scanner library is taking too long to load. Check your internet connection.\n\nUse manual serial entry below instead.');
        }, 10000);
        s.onload=()=>{ clearTimeout(timeout); startBarcode(); };
        s.onerror=()=>{ clearTimeout(timeout); setScanStatus('error'); alert('Failed to load scanner library. Check internet connection.\n\nUse manual serial entry below instead.'); };
        document.head.appendChild(s); return;
      }
      setOcrFound([]); setOcrStatus('');
      setScanStatus('starting');
      // Code 39/93/128 + DataMatrix ONLY — NO QR (Starlink QR codes contain certification URLs, not serials)
      const FMT = [3,4,5,7]; // CODE_39, CODE_93, CODE_128, DATA_MATRIX
      scannerInstance.current = new Html5Qrcode("pwaScanReader", {formatsToSupport: FMT});
      scannerInstance.current.start({facingMode:"environment"},{fps:15,qrbox:{width:280,height:160},aspectRatio:1.6},
        (text) => {
          text = text.trim();
          if(!text) return;
          // Reject URLs (QR codes on Starlink labels link to certification sites)
          if(text.match(/^https?:\/\//i) || text.match(/\.(com|org|net|go|id)\//i)) {
            setScanStatus('searching'); // silently ignore
            return;
          }
          // Extract known serial patterns
          const kitMatch = text.match(/KIT[A-Z0-9]{8,16}/i);
          if(kitMatch) text = kitMatch[0].toUpperCase();
          else {
            const dishMatch = text.match(/(2ABC|HPCP|HPBA)[A-Z0-9]{12,14}/i);
            if(dishMatch) text = dishMatch[0].toUpperCase();
            else {
              // Stricter fallback: must be pure alphanumeric, no slashes/dots/colons
              const clean = text.replace(/[^A-Z0-9]/gi, '');
              if(clean.length >= 10 && clean.length <= 25) text = clean.toUpperCase();
              else return; // reject unrecognized patterns
            }
          }
          setScanStatus('found');
          addSerial(text);
          // Reset back to searching after 1.5s flash
          setTimeout(() => setScanStatus('searching'), 1500);
        }, () => {
          // Called every frame with no barcode — proves the scanner is alive
          setScanAttempts(prev => prev + 1);
        }
      ).then(()=>{
        setScanning(true);
        setScanStatus('searching');
        startScanTimer();
      }).catch(e=>{
        setScanStatus('error');
        const msg = String(e);
        if(msg.indexOf('NotAllowed')!==-1 || msg.indexOf('Permission')!==-1){
          if(confirm('Camera permission blocked.\n\nTip: On iPhone, go to Settings → Safari → Camera → Allow.\n\nOpen standalone scanner in new tab?')){
            const scanUrl = window.location.href.split('?')[0] + '?page=scanner';
            window.open(scanUrl, '_blank');
          }
        } else {
          alert('Camera error: '+e);
        }
      });
    };

    const stopBarcode = () => {
      if(scannerInstance.current) scannerInstance.current.stop().then(()=>{try{scannerInstance.current.clear();}catch(e){}setScanning(false);}).catch(()=>setScanning(false));
      stopScanTimer();
    };

    // ─── OCR MODE: direct camera + Tesseract snap ───
    const startOcrCamera = async () => {
      setOcrFound([]); setOcrStatus('');
      setScanStatus('starting');
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}
        });
        streamRef.current = s;
        if(videoRef.current){ videoRef.current.srcObject = s; }
        setScanning(true);
        setScanStatus('searching');
        startScanTimer();
      } catch(e) {
        const msg = String(e);
        if(msg.indexOf('NotAllowed')!==-1 || msg.indexOf('Permission')!==-1){
          alert('Camera permission blocked.\n\nOn iPhone: Settings → Safari → Camera → Allow');
        } else {
          alert('Camera error: '+e);
        }
      }
    };

    const stopOcrCamera = () => {
      if(streamRef.current){ streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; }
      setScanning(false);
      stopScanTimer();
    };

    const snapAndOCR = async () => {
      if(!videoRef.current || !canvasRef.current) return;
      const v = videoRef.current;
      const c = canvasRef.current;
      c.width = v.videoWidth;
      c.height = v.videoHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0);

      setOcrStatus('loading'); setOcrFound([]);

      // Load Tesseract on-demand if background preload hasn't finished
      if(!window.Tesseract){
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js';
        await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      }

      setOcrStatus('reading');
      try {
        let text = '';
        // Use pre-warmed worker if available (instant — no 4MB download)
        if(window._tessWorkerReady){
          const worker = await window._tessWorkerReady;
          if(worker){
            const r = await worker.recognize(c);
            text = r.data.text || '';
          }
        }
        // Fallback: one-shot recognize (creates worker on the fly)
        if(!text){
          const result = await window.Tesseract.recognize(c, 'eng', {
            logger: (m) => {
              if(m.status==='recognizing text'){
                const pct = Math.round((m.progress||0)*100);
                setOcrStatus('reading '+pct+'%');
              }
            }
          });
          text = result.data.text || '';
        }
        const found = extractIdentifiers(text);
        setOcrFound(found);
        setOcrStatus('done');

        if(found.length > 0){
          // Auto-add first KIT found
          const firstKit = found.find(f=>f.type==='KIT');
          if(firstKit) addSerial(firstKit.value);
        }
      } catch(e){
        setOcrStatus('error');
        setOcrFound([{type:'error',value:'OCR failed: '+(e.message||e)}]);
      }
    };

    // ─── MODE SWITCH ───
    const switchMode = (newMode) => {
      // Clean up current mode
      if(mode==='barcode') stopBarcode();
      else stopOcrCamera();
      setScanning(false);
      setOcrStatus(''); setOcrFound([]);
      setMode(newMode);
    };

    const startCamera = () => {
      if(mode==='barcode') startBarcode();
      else startOcrCamera();
    };
    const stopCamera = () => {
      if(mode==='barcode') stopBarcode();
      else stopOcrCamera();
    };

    // ─── SUBMIT ───
    const submitBatch = async () => {
      if(!selCat||!scanned.length) return;
      setSubmitting(true); setResult('');
      let ok=0, errs=[];
      const cost = costOverride !== '' ? parseFloat(costOverride) : (selCat.buy_price||0);
      for(const serial of scanned){
        const r = await stockApi('stock_unit_save',{method:'POST',body:{
          category_id:selCat.id,
          serial_number:serial,
          purchase_cost:cost,
          location_name:location||'DishNet UNMISS'
        }});
        if(r?.status==='success') ok++; else errs.push(serial+': '+(r?.message||'Error'));
      }
      setSubmitting(false);
      if(errs.length===0) { setResult('🎉 All '+ok+' items added!'); setScanned([]); }
      else setResult('✅ '+ok+' added, ❌ '+errs.length+' failed: '+errs.slice(0,3).join('; '));
    };

    // ─── CATEGORY SELECTION SCREEN ───
    if (!selCat) {
      const icons = {starlink:'📡',fiber:'🌐',lte:'📶',general:'📦'};
      return (
        <div>
          <div style={{fontSize:16,fontWeight:800,marginBottom:12}}>📷 Select Category to Scan</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {cats.map(c=>(
              <button key={c.id} onClick={()=>{setSelCat(c);setCostOverride('');}} style={{background:'#fff',border:'2px solid #E2E8F0',borderRadius:14,padding:'16px',cursor:'pointer',textAlign:'center'}}>
                {c.image_url
                  ? <img src={c.image_url} style={{width:56,height:56,objectFit:'cover',borderRadius:10,margin:'0 auto'}} onError={e=>{e.target.style.display='none';}} />
                  : <div style={{fontSize:28}}>{icons[c.service_type]||'📦'}</div>}
                <div style={{fontSize:13,fontWeight:700,color:'#1E293B',marginTop:6}}>{c.title}</div>
                <div style={{fontSize:11,color:'#94A3B8'}}>{c.serial_in_stock||0} in stock</div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ─── MAIN SCANNER SCREEN ───
    return (
      <div>
        {/* Header */}
        <button onClick={()=>{stopCamera();setSelCat(null);setScanned([]);setResult('');}} style={{background:'none',border:'none',fontSize:13,fontWeight:700,color:'#64748B',cursor:'pointer',marginBottom:8}}>← Change category</button>
        <div style={{fontSize:16,fontWeight:800,marginBottom:4}}>📷 Scanning: {selCat.title}</div>

        {/* Mode toggle */}
        <div style={{display:'flex',background:'#F1F5F9',borderRadius:10,padding:3,marginBottom:12}}>
          <button onClick={()=>switchMode('barcode')} style={{flex:1,padding:'8px 0',borderRadius:8,border:'none',fontSize:12,fontWeight:700,cursor:'pointer',background:mode==='barcode'?'#fff':'transparent',color:mode==='barcode'?'#2563EB':'#64748B',boxShadow:mode==='barcode'?'0 1px 3px rgba(0,0,0,.1)':'none'}}>
            ▦ Barcode (Auto)
          </button>
          <button onClick={()=>switchMode('ocr')} style={{flex:1,padding:'8px 0',borderRadius:8,border:'none',fontSize:12,fontWeight:700,cursor:'pointer',background:mode==='ocr'?'#fff':'transparent',color:mode==='ocr'?'#8B5CF6':'#64748B',boxShadow:mode==='ocr'?'0 1px 3px rgba(0,0,0,.1)':'none'}}>
            📸 OCR Snap (Text)
          </button>
        </div>

        {/* Settings row */}
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input type="number" step="0.01" placeholder={'Cost $'+(selCat.buy_price?' ('+selCat.buy_price+')':'')}
            value={costOverride} onChange={e=>setCostOverride(e.target.value)}
            style={{flex:1,padding:'8px 10px',border:'1px solid #D1D5DB',borderRadius:8,fontSize:12,background:'#F9FAFB'}} />
          <select value={location} onChange={e=>setLocation(e.target.value)}
            style={{flex:1,padding:'8px 6px',border:'1px solid #D1D5DB',borderRadius:8,fontSize:12,background:'#F9FAFB'}}>
            <option value="DishNet UNMISS">UNMISS</option>
            <option value="DishNet Kololo Office">Kololo</option>
          </select>
        </div>

        {/* Camera viewfinder */}
        {mode==='barcode' ? (
          <div id="pwaScanReader" style={{borderRadius:12,overflow:'hidden',marginBottom:8,background:'#000',minHeight:scanning?0:100}} />
        ) : (
          <div style={{position:'relative',borderRadius:12,overflow:'hidden',marginBottom:8,background:'#000'}}>
            <video ref={videoRef} autoPlay playsInline muted style={{width:'100%',borderRadius:12,display:scanning?'block':'none'}} />
            <canvas ref={canvasRef} style={{display:'none'}} />
            {scanning && (
              <div style={{position:'absolute',bottom:0,left:0,right:0,background:'linear-gradient(transparent,rgba(0,0,0,.6))',padding:'20px 12px 12px',textAlign:'center'}}>
                <div style={{fontSize:10,color:'rgba(255,255,255,.7)',marginBottom:6}}>Point at the SN: KIT... text on the label</div>
              </div>
            )}
          </div>
        )}

        {/* Live status bar */}
        {scanning && (
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:10,marginBottom:8,
            background: scanStatus==='found' ? '#ECFDF5' : scanStatus==='error' ? '#FEF2F2' : '#F0F4FF',
            border: '1px solid ' + (scanStatus==='found' ? '#A7F3D0' : scanStatus==='error' ? '#FECACA' : '#BFDBFE'),
            transition:'all 0.3s'}}>
            {/* Animated dot */}
            <div style={{width:10,height:10,borderRadius:'50%',flexShrink:0,
              background: scanStatus==='found' ? '#059669' : scanStatus==='searching' ? '#2563EB' : '#94A3B8',
              animation: scanStatus==='searching' ? 'scanPulse 1.2s ease-in-out infinite' : 'none'}} />
            {/* Status text */}
            <div style={{flex:1,fontSize:12,fontWeight:600,
              color: scanStatus==='found' ? '#059669' : scanStatus==='searching' ? '#1E40AF' : '#64748B'}}>
              {scanStatus==='starting' && 'Starting camera...'}
              {scanStatus==='searching' && mode==='barcode' && ('🔍 Scanning for barcodes… ' + scanElapsed + 's')}
              {scanStatus==='searching' && mode==='ocr' && '📷 Camera ready — tap Snap & Read'}
              {scanStatus==='found' && ('✅ Found: ' + lastScan)}
              {scanStatus==='error' && '❌ Camera error'}
            </div>
            {/* Frames counter (barcode only) */}
            {mode==='barcode' && scanStatus==='searching' && (
              <div style={{fontSize:10,color:'#94A3B8',fontFamily:'monospace',flexShrink:0}}>
                {scanAttempts > 0 ? (Math.round(scanAttempts/Math.max(scanElapsed,1))+'fps') : '...'}
              </div>
            )}
          </div>
        )}

        {/* Auto-suggest OCR after 10s with no barcode found */}
        {scanning && mode==='barcode' && scanElapsed >= 10 && scanStatus==='searching' && scanned.length === 0 && (
          <div style={{background:'#FFF7ED',border:'1px solid #FED7AA',borderRadius:10,padding:'10px 12px',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:20}}>⚠️</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700,color:'#92400E'}}>No barcode found after {scanElapsed}s</div>
              <div style={{fontSize:11,color:'#B45309',marginTop:2}}>This label might not have a barcode. Try OCR mode to read the text.</div>
            </div>
            <button onClick={()=>switchMode('ocr')} style={{padding:'6px 12px',background:'#8B5CF6',color:'#fff',border:'none',borderRadius:8,fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>
              Switch to OCR
            </button>
          </div>
        )}

        {/* CSS animation for pulse dot */}
        <style>{'@keyframes scanPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}'}</style>

        {/* Camera controls */}
        <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:8}}>
          {!scanning ? (
            <button onClick={startCamera} style={{padding:'10px 24px',borderRadius:10,border:'none',background:mode==='barcode'?'#2563EB':'#8B5CF6',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>
              📷 Start Camera
            </button>
          ) : (
            <>
              {mode==='ocr' && (
                <button onClick={snapAndOCR} disabled={ocrStatus==='loading'||ocrStatus.startsWith('reading')}
                  style={{padding:'10px 24px',borderRadius:10,border:'none',background:'#8B5CF6',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',opacity:(ocrStatus==='loading'||ocrStatus.startsWith('reading'))?0.6:1}}>
                  {ocrStatus===''||ocrStatus==='done'||ocrStatus==='error' ? '📸 Snap & Read' : '🔍 '+ocrStatus}
                </button>
              )}
              <button onClick={stopCamera} style={{padding:'10px 24px',borderRadius:10,border:'none',background:'#DC2626',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>⏹ Stop</button>
            </>
          )}
        </div>

        {/* OCR results */}
        {ocrStatus==='done' && ocrFound.length > 0 && ocrFound[0].type !== 'error' && (
          <div style={{background:'#ECFDF5',border:'1px solid #A7F3D0',borderRadius:10,padding:'10px 12px',marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:700,color:'#059669',marginBottom:6}}>✅ Found {ocrFound.length} identifier(s):</div>
            {ocrFound.map((f,i)=>{
              const already = scanned.some(s=>s===f.value);
              return (
                <div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                  <span style={{fontFamily:'monospace',fontSize:13,fontWeight:700,flex:1}}>{f.value}</span>
                  <span style={{fontSize:10,background:'#D1FAE5',padding:'1px 6px',borderRadius:4,color:'#065F46'}}>{f.type}</span>
                  {already ? <span style={{fontSize:11,color:'#94A3B8'}}>added ✓</span>
                   : <button onClick={()=>addSerial(f.value)} style={{padding:'3px 10px',background:'#2563EB',color:'#fff',border:'none',borderRadius:6,fontSize:11,fontWeight:700,cursor:'pointer'}}>+ Add</button>}
                </div>
              );
            })}
          </div>
        )}
        {ocrStatus==='done' && ocrFound.length === 0 && (
          <div style={{background:'#FFF7ED',border:'1px solid #FED7AA',borderRadius:10,padding:'10px 12px',marginBottom:8,fontSize:12,color:'#92400E'}}>
            ⚠️ No KIT/SN found. Try moving closer to the "SN: KIT..." text and tap Snap again.
          </div>
        )}
        {ocrFound.length > 0 && ocrFound[0].type === 'error' && (
          <div style={{background:'#FEF2F2',border:'1px solid #FECACA',borderRadius:10,padding:'10px 12px',marginBottom:8,fontSize:12,color:'#DC2626'}}>
            {ocrFound[0].value}
          </div>
        )}

        {/* Last scan flash */}
        {lastScan && <div style={{background:'#ECFDF5',border:'1px solid #A7F3D0',borderRadius:10,padding:'10px',textAlign:'center',fontSize:14,fontWeight:700,color:'#059669',marginBottom:8}}>✅ {lastScan}</div>}

        {/* Manual input */}
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input type="text" value={manualVal} onChange={e=>setManualVal(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter'&&manualVal.trim()){ addSerial(manualVal); setManualVal(''); }}}
            placeholder="Type serial manually..."
            style={{flex:1,padding:'10px 12px',border:'1px solid #D1D5DB',borderRadius:10,fontSize:13,fontFamily:'monospace'}} />
          <button onClick={()=>{ if(manualVal.trim()){ addSerial(manualVal); setManualVal(''); }}}
            style={{padding:'10px 16px',background:'#F1F5F9',border:'1px solid #D1D5DB',borderRadius:10,fontSize:13,fontWeight:700,color:'#475569',cursor:'pointer'}}>+ Add</button>
        </div>

        {/* Scanned items list */}
        <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>Scanned: {scanned.length}</div>
        {scanned.map((s,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#F8FAFC',borderRadius:8,padding:'8px 12px',marginBottom:4}}>
            <span style={{fontFamily:'monospace',fontSize:13,fontWeight:700}}>{i+1}. {s}</span>
            <button onClick={()=>setScanned(prev=>prev.filter((_,j)=>j!==i))} style={{background:'none',border:'none',color:'#DC2626',fontSize:16,cursor:'pointer'}}>✕</button>
          </div>
        ))}

        {/* Submit */}
        {scanned.length>0 && <button onClick={submitBatch} disabled={submitting}
          style={{width:'100%',marginTop:12,padding:'14px',borderRadius:12,border:'none',background:submitting?'#94A3B8':'#059669',color:'#fff',fontSize:15,fontWeight:800,cursor:'pointer'}}>
          {submitting?'⏳ Submitting...':'✅ Add '+scanned.length+' to Stock'}</button>}
        {result && <div style={{marginTop:12,padding:'12px',borderRadius:10,background:result.startsWith('🎉')?'#ECFDF5':'#FFF7ED',fontSize:14,fontWeight:700,textAlign:'center'}}>{result}</div>}
      </div>
    );
  };

  // ── Holdings (leader/admin) ──
  const HoldingsView = () => {
    const [agents, setAgents] = useState([]);
    const [loading, setLoading] = useState(true);
    useEffect(()=>{
      stockApi('stock_agent_holdings').then(r=>{setAgents(r?.data||[]);setLoading(false);}).catch(()=>setLoading(false));
    },[]);
    if(loading) return <div style={{textAlign:'center',padding:40,color:'#94A3B8'}}>Loading...</div>;
    if(!agents.length) return <div style={{textAlign:'center',padding:40,color:'#94A3B8'}}>No agents hold equipment currently.</div>;
    return (
      <div>
        {agents.map(a=>(
          <div key={a.rid} style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:14,padding:'14px',marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontSize:15,fontWeight:800,color:'#1E293B'}}>👤 {a.name}</div>
              <div style={{fontSize:12,color:'#64748B'}}>{a.items.length} items · ${a.total_value.toFixed(0)}</div>
            </div>
            {a.items.map(u=>(
              <div key={u.id} style={{fontSize:12,padding:'6px 0',borderTop:'1px solid #F1F5F9',display:'flex',justifyContent:'space-between'}}>
                <span style={{fontFamily:'monospace',fontWeight:700}}>{u.serial_number}</span>
                <span style={{color:'#94A3B8'}}>{u.category_name}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    );
  };

  // ── Tab bar + render ──
  const tabs = [
    { key:'equipment', icon:'🧰', label:'My Gear' },
    { key:'inout', icon:'📒', label:'In/Out' },
  ];
  if (isLeader) {
    tabs.push({ key:'scan', icon:'📷', label:'Scanner' });
    tabs.push({ key:'holdings', icon:'👥', label:'Holdings' });
  }

  return (
    <div style={{padding:'0 16px 120px'}}>
      {/* Sub-tabs */}
      <div style={{display:'flex',gap:4,background:'#F1F5F9',borderRadius:12,padding:3,marginBottom:16}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)}
            style={{flex:1,padding:'8px 4px',borderRadius:10,border:'none',fontSize:11,fontWeight:tab===t.key?800:600,
              background:tab===t.key?'#fff':'transparent',color:tab===t.key?'#D41C1C':'#64748B',cursor:'pointer',
              boxShadow:tab===t.key?'0 1px 3px rgba(0,0,0,.1)':'none'}}>
            {t.icon} {t.label}
          </button>
        ))}
      </div>

      {tab==='equipment' && <EquipmentView />}
      {tab==='inout' && <InOutView />}
      {tab==='scan' && isLeader && <ScannerView />}
      {tab==='holdings' && isLeader && <HoldingsView />}
    </div>
  );
};

// ══════════════════════════════════════════════════════════════════════════
// APP ROOT — ROLE-BASED
// ══════════════════════════════════════════════════════════════════════════
function App() {
  const [retailer, setRetailer] = useState(null);
  const [loggedIn, setLoggedIn] = useState(false);
  const [walletSummary, setWS] = useState({});
  const [apps, setApps] = useState([]);
  const [passbook, setPB] = useState([]);
  const [recharges, setRech] = useState([]);
  const [screen, setScreen] = useState("home");
  const [prevScreen, setPrevScreen] = useState(null);
  const [screenData, setScreenData] = useState(null);
  const [gpsEnabled, setGpsEnabled] = useState(false);

  const isSupport = retailer && isSupportRole(retailer.role);
  const isAdmin   = retailer && (retailer.is_admin || isAdminRole(retailer.role || ''));
  const gpsOn = useGPS(gpsEnabled && !!isSupport);

  // Restore session on load
  useEffect(() => {
    try {
      const tok = localStorage.getItem("dn_token");
      const saved = localStorage.getItem("dn_retailer");
      if (tok && saved) {
        const r = JSON.parse(saved);
        api._token = tok;
        setRetailer(r);
        setLoggedIn(true);
        if (isSupportRole(r.role)) setGpsEnabled(true);
      }
    } catch(e) {}
  }, []);

  const navigate = (s, data) => { setPrevScreen(screen); setScreenData(data || null); setScreen(s); };

  const refresh = async () => {
    if (isSupport) return;
    try {
      const [a,b,c2,d] = await Promise.allSettled([api.walletBalance(), api.kycList(), api.passbook(), api.rechargeList()]);
      if(a.status==="fulfilled") setWS(a.value);
      if(b.status==="fulfilled") setApps(b.value.applications||b.value||[]);
      if(c2.status==="fulfilled") setPB(c2.value.passbook||c2.value||[]);
      if(d.status==="fulfilled") setRech(d.value.recharges||d.value||[]);
    } catch(e) {}
  };
  useEffect(() => { if (loggedIn) refresh(); }, [loggedIn]);

  const logout = () => {
    if (!window.confirm('Sign out of DishNet?')) return;
    api.clearToken();
    setLoggedIn(false); setRetailer(null); setWS({}); setApps([]); setPB([]); setRech([]);
    setScreen("home"); setScreenData(null); setGpsEnabled(false);
  };

  if (!loggedIn) {
    return (
      <>
        <ToastContainer />
        <LoginScreen onLogin={(r, w) => {
          localStorage.setItem("dn_retailer", JSON.stringify(r));
          setRetailer(r); setWS(w || {}); setLoggedIn(true);
          if (isSupportRole(r.role)) setGpsEnabled(true);
        }} />
      </>
    );
  }

  const titles = { home: isSupport ? `Hi, ${retailer?.name?.split(" ")[0]}! 👋` : `Hi, ${retailer?.name?.split(" ")[0]}! 👋`, kyc:"New Customer", applications:"My Applications", wallet:"Wallet", recharge:"Load Money", cashbook:"💰 Cashbook", cashbook_admin:"📒 Cashbook", collect:"Collect Payment", add_entry:"Add Entry", profile:"Profile", my_jobs:"My Jobs", my_route:"My Route", job_detail: screenData ? `Ticket #${screenData.id}` : "Job", expense:"🧾 Log Expense", issue_advance:"💸 Issue Advance", advances_overview:"📋 Advances", give_cash:"🤝 Give Cash", stock:"📦 Stock", payslips:"💼 My Payslips", leave:"🗓️ Leave" };
  const showBack = ["kyc","recharge","job_detail","collect","add_entry","expense","issue_advance","give_cash","stock","payslips","leave"].includes(screen);
  const activeColor = isSupport ? "#D41C1C" : isAdmin ? "#D41C1C" : "#00B894";

  const supportTabs = [
    { key:"home", icon:"🏠", label:"Home" },
    { key:"my_jobs", icon:"🔧", label:"Jobs" },
    { key:"my_route", icon:"🗺", label:"Route" },
    { key:"profile", icon:"👤", label:"Profile" },
  ];
  const salesTabs = [
    { key:"home",              icon:"🏠", label:"Home"     },
    { key:"collect",           icon:"💰", label:"Collect"  },
    { key:"advances_overview", icon:"💸", label:"Advances" },
    { key:"expense",           icon:"🧾", label:"Expense"  },
    { key:"profile",           icon:"👤", label:"Profile"  },
  ];
  const adminTabs = [
    { key:"home",              icon:"🏠", label:"Home"     },
    { key:"collect",           icon:"💰", label:"Collect"  },
    { key:"cashbook_admin",    icon:"📒", label:"Cashbook" },
    { key:"advances_overview", icon:"💸", label:"Advances" },
    { key:"expense",           icon:"🧾", label:"Expense"  },
    { key:"profile",           icon:"👤", label:"Profile"  },
  ];
  const tabs = isSupport ? supportTabs : isAdmin ? adminTabs : salesTabs;

  return (
    <div style={{ maxWidth:480, margin:"0 auto", minHeight:"100dvh", background:"#F6F7FB", fontFamily:"'DM Sans','Avenir Next',-apple-system,sans-serif", position:"relative" }}>
      <ToastContainer />

      {/* Top Bar */}
      <div style={{ position:"sticky", top:0, zIndex:100, background:"rgba(246,247,251,0.95)", backdropFilter:"blur(16px)", padding:`max(14px, env(safe-area-inset-top)) 16px 10px`, display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:"1px solid rgba(0,0,0,.04)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          {showBack && (
            <button onClick={()=>{ setScreen(prevScreen||"home"); setScreenData(null); }} style={{ background:"#fff", border:"1px solid #E2E8F0", borderRadius:12, width:44, height:44, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", flexShrink:0 }}>←</button>
          )}
          <h2 style={{ fontSize:19, fontWeight:800, color:"#1E293B", margin:0, letterSpacing:-0.3 }}>{titles[screen]||screen}</h2>
        </div>
        {screen==="home" && (
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {isSupport && <GPSBadge active={gpsOn} />}
            <div style={{ padding:"4px 10px", borderRadius:20, background: isSupport?"#FEF2F2":"#ECFDF5", border:`1px solid ${isSupport?"#FECACA":"#BBF7D0"}` }}>
              <span style={{ fontSize:10, fontWeight:800, color: isSupport?"#D41C1C":isAdmin?"#D41C1C":"#16A34A", textTransform:"uppercase", letterSpacing:0.5 }}>{isSupport?"Support":isAdmin?"Admin":"Sales"}</span>
            </div>
          </div>
        )}
      </div>

      {/* Screens */}
      {isSupport ? (
        <>
          {screen==="home" && <SupportHomeScreen retailer={retailer} navigate={navigate} gpsOn={gpsOn} />}
          {screen==="my_jobs" && <MyJobsScreen retailer={retailer} navigate={navigate} />}
          {screen==="my_route" && <MyRouteScreen retailer={retailer} navigate={navigate} />}
          {screen==="job_detail" && screenData && <JobDetailScreen job={screenData} retailer={retailer} navigate={navigate} />}
          {screen==="stock" && <StockScreen retailer={retailer} navigate={navigate} initTab={screenData?.tab||'equipment'} />}
          {screen==="payslips" && <PayslipsScreen retailer={retailer} navigate={navigate} />}
          {screen==="leave" && <LeaveScreen retailer={retailer} navigate={navigate} />}
          {screen==="profile" && <SupportProfileScreen retailer={retailer} onLogout={logout} gpsOn={gpsEnabled} setGpsOn={setGpsEnabled} navigate={navigate} />}
        </>
      ) : isAdmin ? (
        <>
          {screen==="home"              && <AdminHomeScreen retailer={retailer} navigate={navigate} onRefresh={refresh} />}
          {screen==="cashbook_admin"    && <AdminCashbookScreen retailer={retailer} navigate={navigate} />}
          {screen==="collect"           && <CollectScreen retailer={retailer} walletSummary={walletSummary} navigate={navigate} onRefresh={refresh} />}
          {screen==="expense"           && <ExpenseScreen retailer={retailer} navigate={navigate} />}
          {screen==="give_cash"          && <GiveCashScreen retailer={retailer} navigate={navigate} />}
          {screen==="issue_advance"     && <IssueAdvanceScreen retailer={retailer} navigate={navigate} />}
          {screen==="advances_overview" && <AdvancesOverviewScreen retailer={retailer} navigate={navigate} />}
          {screen==="wallet"            && <WalletScreen walletSummary={walletSummary} passbook={passbook} navigate={navigate} />}
          {screen==="recharge"          && <RechargeScreen walletBalance={(walletSummary||{}).balance||0} recharges={recharges} onSubmitted={refresh} navigate={navigate} />}
          {screen==="stock"             && <StockScreen retailer={retailer} navigate={navigate} initTab={screenData?.tab||'inout'} />}
          {screen==="payslips"         && <PayslipsScreen retailer={retailer} navigate={navigate} />}
          {screen==="leave"            && <LeaveScreen retailer={retailer} navigate={navigate} />}
          {screen==="profile"           && <ProfileScreen retailer={retailer} walletSummary={walletSummary} onLogout={logout} navigate={navigate} />}
          {screen==="add_entry"         && <CashbookScreen retailer={retailer} navigate={navigate} />}
        </>
      ) : (
        <>
          {screen==="home"              && <HomeScreen retailer={retailer} walletSummary={walletSummary} apps={apps} onRefresh={refresh} navigate={navigate} />}
          {screen==="collect"           && <CollectScreen retailer={retailer} walletSummary={walletSummary} navigate={navigate} onRefresh={refresh} />}
          {screen==="kyc"               && <KycScreen navigate={navigate} walletBalance={(walletSummary||{}).balance||0} onSubmitted={refresh} />}
          {screen==="applications"      && <ApplicationsScreen apps={apps} />}
          {screen==="expense"           && <ExpenseScreen retailer={retailer} navigate={navigate} />}
          {screen==="advances_overview" && <AdvancesOverviewScreen retailer={retailer} navigate={navigate} />}
          {screen==="cashbook"          && <CashbookScreen retailer={retailer} navigate={navigate} />}
          {screen==="wallet"            && <WalletScreen walletSummary={walletSummary} passbook={passbook} navigate={navigate} />}
          {screen==="recharge"          && <RechargeScreen walletBalance={(walletSummary||{}).balance||0} recharges={recharges} onSubmitted={refresh} navigate={navigate} />}
          {screen==="stock"             && <StockScreen retailer={retailer} navigate={navigate} initTab={screenData?.tab||'equipment'} />}
          {screen==="payslips"         && <PayslipsScreen retailer={retailer} navigate={navigate} />}
          {screen==="leave"            && <LeaveScreen retailer={retailer} navigate={navigate} />}
          {screen==="profile"           && <ProfileScreen retailer={retailer} walletSummary={walletSummary} onLogout={logout} navigate={navigate} />}
        </>
      )}

      {/* Bottom Nav — hidden on job_detail */}
      {screen!=="job_detail" && (
        <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, background:"rgba(255,255,255,0.97)", backdropFilter:"blur(20px)", borderTop:"1px solid #F1F5F9", display:"flex", justifyContent:"space-around", padding:`8px 0 max(8px,env(safe-area-inset-bottom))`, zIndex:200 }}>
          {tabs.map(tab=>(
            <button key={tab.key} onClick={()=>{ setScreen(tab.key); setScreenData(null); }}
              style={{ background:"none", border:"none", cursor:"pointer", padding:"6px 12px", display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
              <div style={{ width:36, height:36, borderRadius:12, background: screen===tab.key?(isSupport?"#FEF2F2":"#ECFDF5"):"transparent", display:"flex", alignItems:"center", justifyContent:"center", transition:"0.2s" }}>
                <span style={{ fontSize:screen===tab.key?22:20 }}>{tab.icon}</span>
              </div>
              <span style={{ fontSize:11, fontWeight: screen===tab.key?800:600, color: screen===tab.key?activeColor:"#94A3B8", letterSpacing:0.3 }}>{tab.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
setTimeout(() => {
  const s = document.getElementById("sp");
  if (s) { s.classList.add("h"); setTimeout(() => s.remove(), 600); }
}, 900);

// ── Background preload scanner libraries (after app is visible) ──
// html5-qrcode loads ~3s after splash, Tesseract ~6s — both idle-priority
setTimeout(() => {
  if (!window.Html5Qrcode) {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    s.async = true;
    document.head.appendChild(s);
  }
}, 3000);
setTimeout(() => {
  if (!window.Tesseract) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js';
    s.async = true;
    s.onload = () => {
      // Pre-warm: create worker + download language data in background
      // This takes ~4MB download but runs completely idle
      try {
        window._tessWorkerReady = Tesseract.createWorker('eng', 1, {
          logger: () => {},
          workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/worker.min.js',
        }).then(w => { window._tessWorker = w; return w; }).catch(() => {});
      } catch(e) {}
    };
    document.head.appendChild(s);
  }
}, 6000);
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body></html>
