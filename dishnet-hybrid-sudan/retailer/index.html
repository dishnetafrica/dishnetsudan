// Phantom-cash guards enforced server-side; errors shown inline.
// ══════════════════════════════════════════════════════════════════════════════
const GiveCashScreen = ({ retailer, navigate }) => {
  const [step, setStep]         = React.useState('pick');   // pick | amount | confirm | done
  const [staff, setStaff]       = React.useState([]);
  const [search, setSearch]     = React.useState('');
  const [selected, setSelected] = React.useState(null);
  const [myPos, setMyPos]       = React.useState(null);
  const [colleaguePos, setColPos] = React.useState(null);
  const [amount, setAmount]     = React.useState('');
  const [purpose, setPurpose]   = React.useState('field_work');
  const [desc, setDesc]         = React.useState('');
  const [preview, setPreview]   = React.useState(null);  // source label from server
  const [loading, setLoading]   = React.useState(false);
  const [error, setError]       = React.useState('');
  const [result, setResult]     = React.useState(null);

  const PURPOSES = [
    { val:'field_work', label:'Field Work',  icon:'🔧' },
    { val:'ops',        label:'Operations',  icon:'⚙️' },
    { val:'emergency',  label:'Emergency',   icon:'🚨' },
    { val:'misc',       label:'Other',       icon:'📦' },
  ];

  // Load my live position + staff list on mount
  React.useEffect(() => {
    api.call('transfer_my_position').then(d => setMyPos(d)).catch(() => {});
    api.staffList()
      .then(d => setStaff((d.retailers || d || [])
        .filter(s => s.is_active && s.id !== retailer.id)
      ))
      .catch(() => setError('Could not load colleagues. Check connection.'));
  }, []);

  // Load colleague's position when selected
  React.useEffect(() => {
    if (!selected) return;
    setColPos(null);
    api.call(`transfer_colleague_position&colleague_id=${selected.id}`)
      .then(d => setColPos(d))
      .catch(() => {});
  }, [selected]);

  const initials = name => (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

  const totalAvail = myPos
    ? ((myPos.collections_avail || 0) + (myPos.advance_avail || 0))
    : 0;

  const handleAmountNext = async () => {
    const amt = parseFloat(amount);
    if (!amt || amt <= 0) { setError('Enter a valid amount.'); return; }
    if (amt > totalAvail) {
      setError(`You only have $${totalAvail.toFixed(2)} available. Cannot give $${amt.toFixed(2)}.`);
      return;
    }
    // Pre-check receiver headroom
    if (colleaguePos && (colleaguePos.cash_exposure + amt) > colleaguePos.carry_limit) {
      const headroom = Math.max(0, colleaguePos.carry_limit - colleaguePos.cash_exposure);
      setError(`${selected.name} is already holding $${colleaguePos.cash_exposure.toFixed(2)}. ` +
        `Max you can give is $${headroom.toFixed(2)} (carry limit $${colleaguePos.carry_limit.toFixed(2)}).`);
      return;
    }
    // Compute preview split locally (server will also validate)
    const colFraction = Math.min(amt, Math.max(0, myPos?.collections_avail || 0));
    const advFraction = Math.max(0, amt - colFraction);
    if (advFraction === 0) {
      setPreview(`From your collections`);
    } else if (colFraction === 0) {
      setPreview(`From your advance balance`);
    } else {
      setPreview(`Split: $${colFraction.toFixed(2)} collections + $${advFraction.toFixed(2)} advance`);
    }
    setError('');
    setStep('confirm');
  };

  const handleSubmit = async () => {
    setLoading(true);
    setError('');
    try {
      const res = await api.call('transfer_submit', {
        method: 'POST',
        body: {
          to_id:       selected.id,
          amount:      parseFloat(amount),
          purpose,
          description: desc,
        }
      });
      setResult(res);
      setStep('done');
    } catch(e) {
      setError(e.message || 'Something went wrong. Please try again.');
      setStep('amount');
    } finally {
      setLoading(false);
    }
  };

  const card = { background:'#fff', borderRadius:16, padding:'16px', marginBottom:10,
    boxShadow:'0 2px 8px rgba(0,0,0,.06)', border:'1px solid #f1f5f9' };
  const btn  = (bg, col='#fff') => ({
    background: bg, color: col, border: 'none', borderRadius: 14,
    padding: '14px 20px', fontSize: 15, fontWeight: 700, cursor: 'pointer',
    width: '100%', marginTop: 8,
  });

  // ── DONE ─────────────────────────────────────────────────────────────────
  if (step === 'done' && result) {
    return (
      <div style={{ padding:'24px 16px', textAlign:'center' }}>
        <div style={{ fontSize:64, marginBottom:12 }}>✅</div>
        <div style={{ fontSize:20, fontWeight:800, color:'#065f46', marginBottom:6 }}>
          Cash given to {selected.name}
        </div>
        <div style={{ fontSize:14, color:'#64748b', marginBottom:20 }}>
          {result.source_label || preview}
        </div>
        <div style={{ ...card, background:'#f0fdf4', border:'1px solid #bbf7d0', textAlign:'left' }}>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:12, color:'#64748b' }}>Ref</span>
            <span style={{ fontSize:12, fontWeight:700, color:'#065f46', fontFamily:'monospace' }}>
              {result.transfer_no}
            </span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
            <span style={{ fontSize:12, color:'#64748b' }}>To</span>
            <span style={{ fontSize:12, fontWeight:700 }}>{selected.name}</span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between' }}>
            <span style={{ fontSize:12, color:'#64748b' }}>Amount</span>
            <span style={{ fontSize:16, fontWeight:800, color:'#065f46' }}>
              ${parseFloat(amount).toFixed(2)}
            </span>
          </div>
        </div>
        <div style={{ fontSize:12, color:'#94a3b8', marginBottom:20 }}>
          This transfer is recorded. {selected.name.split(' ')[0]} can now log expenses against it.
        </div>
        <button style={btn('#00B894')} onClick={() => navigate('home')}>Back to Home</button>
        <button style={btn('#f1f5f9', '#475569')} onClick={() => {
          setStep('pick'); setSelected(null); setAmount(''); setDesc(''); setResult(null);
        }}>Give Cash Again</button>
      </div>
    );
  }

  // ── CONFIRM ───────────────────────────────────────────────────────────────
  if (step === 'confirm') {
    const amt = parseFloat(amount);
    return (
      <div style={{ padding:'16px' }}>
        <div style={{ ...card, background:'#fffbeb', border:'1px solid #fde68a' }}>
          <div style={{ fontSize:13, color:'#92400e', fontWeight:700, marginBottom:12 }}>
            Confirm cash handover
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16 }}>
            <div style={{ width:44, height:44, borderRadius:'50%', background:'#059669',
              color:'#fff', display:'flex', alignItems:'center', justifyContent:'center',
              fontWeight:800, fontSize:16 }}>
              {initials(selected.name)}
            </div>
            <div>
              <div style={{ fontWeight:800, fontSize:16 }}>{selected.name}</div>
              <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase' }}>
                {selected.role || 'staff'}
              </div>
            </div>
            <div style={{ marginLeft:'auto', fontWeight:900, fontSize:24, color:'#d97706' }}>
              ${amt.toFixed(2)}
            </div>
          </div>
          <div style={{ background:'rgba(0,0,0,.04)', borderRadius:10, padding:'10px 12px',
            fontSize:12, color:'#78350f', lineHeight:1.6 }}>
            📌 <strong>Source:</strong> {preview}<br/>
            📌 <strong>Purpose:</strong> {PURPOSES.find(p=>p.val===purpose)?.label || purpose}
            {desc && <><br/>📌 <strong>Note:</strong> {desc}</>}
          </div>
          {colleaguePos && (
            <div style={{ marginTop:10, fontSize:11, color:'#64748b' }}>
              {selected.name.split(' ')[0]} will hold ${(colleaguePos.cash_exposure + amt).toFixed(2)} after this
              (carry limit: ${colleaguePos.carry_limit.toFixed(2)})
            </div>
          )}
        </div>
        {error && (
          <div style={{ background:'#fef2f2', border:'1px solid #fecaca', borderRadius:10,
            padding:'12px', fontSize:12, color:'#dc2626', marginBottom:10 }}>
            ⚠️ {error}
          </div>
        )}
        <button style={btn('#059669')} onClick={handleSubmit} disabled={loading}>
          {loading ? 'Processing…' : `✓ Confirm — Give $${amt.toFixed(2)} to ${selected.name.split(' ')[0]}`}
        </button>
        <button style={btn('#f1f5f9', '#475569')} onClick={() => setStep('amount')}>← Edit Amount</button>
      </div>
    );
  }

  // ── AMOUNT ────────────────────────────────────────────────────────────────
  if (step === 'amount') {
    return (
      <div style={{ padding:'16px' }}>
        {/* Colleague header */}
        <div style={{ ...card, display:'flex', alignItems:'center', gap:12, marginBottom:16 }}>
          <div style={{ width:44, height:44, borderRadius:'50%', background:'#059669',
            color:'#fff', display:'flex', alignItems:'center', justifyContent:'center',
            fontWeight:800, fontSize:16 }}>
            {initials(selected.name)}
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontWeight:800, fontSize:15 }}>{selected.name}</div>
            <div style={{ fontSize:11, color:'#64748b', textTransform:'uppercase' }}>
              {selected.role || 'staff'}
            </div>
          </div>
          <button onClick={() => setStep('pick')}
            style={{ background:'#f1f5f9', border:'none', borderRadius:8, padding:'6px 10px',
              fontSize:11, color:'#475569', cursor:'pointer' }}>Change</button>
        </div>

        {/* My available cash */}
        {myPos && (
          <div style={{ ...card, background:'#f0fdf4', border:'1px solid #bbf7d0' }}>
            <div style={{ fontSize:11, color:'#065f46', fontWeight:700, marginBottom:8 }}>
              YOUR AVAILABLE CASH
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              <div style={{ background:'rgba(0,0,0,.04)', borderRadius:8, padding:'8px 10px' }}>
                <div style={{ fontSize:10, color:'#64748b' }}>From collections</div>
                <div style={{ fontSize:18, fontWeight:800, color:'#065f46' }}>
                  ${(myPos.collections_avail||0).toFixed(2)}
                </div>
              </div>
              <div style={{ background:'rgba(0,0,0,.04)', borderRadius:8, padding:'8px 10px' }}>
                <div style={{ fontSize:10, color:'#64748b' }}>From advance</div>
                <div style={{ fontSize:18, fontWeight:800, color:'#b45309' }}>
                  ${(myPos.advance_avail||0).toFixed(2)}
                </div>
              </div>
            </div>
            <div style={{ fontSize:11, color:'#065f46', marginTop:6, fontWeight:600 }}>
              Total you can give: <strong>${totalAvail.toFixed(2)}</strong>
            </div>
          </div>
        )}

        {/* Colleague headroom warning */}
        {colleaguePos && colleaguePos.cash_exposure > 0 && (
          <div style={{ ...card, background:'#fffbeb', border:'1px solid #fde68a', marginBottom:8 }}>
            <div style={{ fontSize:11, color:'#92400e' }}>
              ℹ️ {selected.name.split(' ')[0]} is already holding
              <strong> ${colleaguePos.cash_exposure.toFixed(2)}</strong>.
              Max you can give: <strong>${Math.max(0, colleaguePos.carry_limit - colleaguePos.cash_exposure).toFixed(2)}</strong>
            </div>
          </div>
        )}

        {/* Amount input */}
        <div style={card}>
          <div style={{ fontSize:11, color:'#64748b', fontWeight:700, marginBottom:6 }}>AMOUNT (USD)</div>
          <input
            type="number" inputMode="decimal" placeholder="0.00"
            value={amount} onChange={e => { setAmount(e.target.value); setError(''); }}
            style={{ width:'100%', fontSize:32, fontWeight:800, border:'none', outline:'none',
              color:'#0f172a', background:'transparent', padding:'4px 0' }}
          />
          <div style={{ borderTop:'1px solid #f1f5f9', paddingTop:8, marginTop:8 }}>
            {/* Quick amount chips */}
            {myPos && [10,20,50,100].filter(v => v <= totalAvail).map(v => (
              <button key={v} onClick={() => setAmount(String(v))}
                style={{ background:'#f1f5f9', border:'none', borderRadius:8, padding:'6px 12px',
                  fontSize:12, fontWeight:600, color:'#475569', cursor:'pointer', marginRight:6, marginBottom:4 }}>
                ${v}
              </button>
            ))}
            {myPos && (
              <button onClick={() => setAmount(totalAvail.toFixed(2))}
                style={{ background:'#dbeafe', border:'none', borderRadius:8, padding:'6px 12px',
                  fontSize:12, fontWeight:600, color:'#1d4ed8', cursor:'pointer', marginBottom:4 }}>
                All (${totalAvail.toFixed(2)})
              </button>
            )}
          </div>
        </div>

        {/* Purpose */}
        <div style={card}>
          <div style={{ fontSize:11, color:'#64748b', fontWeight:700, marginBottom:8 }}>PURPOSE</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
            {PURPOSES.map(p => (
              <button key={p.val} onClick={() => setPurpose(p.val)}
                style={{ background: purpose===p.val ? '#dbeafe' : '#f8fafc',
                  border: purpose===p.val ? '1px solid #93c5fd' : '1px solid #e2e8f0',
                  borderRadius:10, padding:'8px 10px', cursor:'pointer', textAlign:'left' }}>
                <span style={{ fontSize:16 }}>{p.icon}</span>
                <span style={{ fontSize:12, fontWeight:600, color: purpose===p.val ? '#1d4ed8' : '#475569',
                  display:'block', marginTop:2 }}>{p.label}</span>
              </button>
            ))}
          </div>
        </div>

        {/* Optional note */}
        <div style={card}>
          <div style={{ fontSize:11, color:'#64748b', fontWeight:700, marginBottom:6 }}>NOTE (optional)</div>
          <textarea placeholder="e.g. fuel money for Jebel site" rows={2}
            value={desc} onChange={e => setDesc(e.target.value)}
            style={{ width:'100%', border:'none', outline:'none', fontSize:13, resize:'none',
              color:'#0f172a', background:'transparent', fontFamily:'inherit' }}/>
        </div>

        {error && (
          <div style={{ background:'#fef2f2', border:'1px solid #fecaca', borderRadius:10,
            padding:'12px', fontSize:12, color:'#dc2626', marginBottom:10 }}>
            ⚠️ {error}
          </div>
        )}

        <button style={btn('#00B894')} onClick={handleAmountNext}>
          Continue →
        </button>
      </div>
    );
  }

  // ── PICK COLLEAGUE ────────────────────────────────────────────────────────
  const filtered = staff.filter(s => {
    const q = search.toLowerCase();
    return !q || s.name.toLowerCase().includes(q) || (s.role||'').toLowerCase().includes(q);
  });

  return (
    <div style={{ padding:'16px' }}>
      {myPos && myPos.cash_exposure <= 0 && (
        <div style={{ ...card, background:'#fef2f2', border:'1px solid #fecaca', textAlign:'center' }}>
          <div style={{ fontSize:24, marginBottom:6 }}>⚠️</div>
          <div style={{ fontSize:13, color:'#dc2626', fontWeight:700 }}>No cash to give</div>
          <div style={{ fontSize:12, color:'#64748b', marginTop:4 }}>
            You have no collections or advance balance in hand right now.
          </div>
        </div>
      )}

      <div style={{ position:'relative', marginBottom:12 }}>
        <input placeholder="Search colleague…" value={search}
          onChange={e => setSearch(e.target.value)}
          style={{ width:'100%', padding:'12px 16px', borderRadius:12, border:'1px solid #e2e8f0',
            fontSize:14, outline:'none', background:'#fff', boxSizing:'border-box' }}/>
      </div>

      {filtered.map(s => {
        const ROLE_COL = { admin:'#92400e', accountant:'#1e40af', sales:'#166534',
          field_agent:'#9a3412', collection:'#9d174d', support:'#075985' };
        const roleCol = ROLE_COL[s.role] || '#475569';
        return (
          <button key={s.id} onClick={() => { setSelected(s); setError(''); setStep('amount'); }}
            style={{ ...card, display:'flex', alignItems:'center', gap:12, cursor:'pointer',
              width:'100%', textAlign:'left', border:'1px solid #f1f5f9' }}
            onTouchStart={press} onTouchEnd={release}>
            <div style={{ width:44, height:44, borderRadius:'50%', background:'#059669',
              color:'#fff', display:'flex', alignItems:'center', justifyContent:'center',
              fontWeight:800, fontSize:15, flexShrink:0 }}>
              {initials(s.name)}
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:700, fontSize:14 }}>{s.name}</div>
              <div style={{ fontSize:10, fontWeight:700, color: roleCol, textTransform:'uppercase',
                letterSpacing:'.5px', marginTop:2 }}>{s.role||'staff'}</div>
            </div>
            <div style={{ fontSize:20, color:'#cbd5e1' }}>›</div>
          </button>
        );
      })}
      {filtered.length === 0 && (
        <div style={{ textAlign:'center', padding:'40px 20px', color:'#94a3b8', fontSize:13 }}>
          No colleagues found
        </div>
      )}
    </div>
  );
};

// IssueAdvanceScreen — admin/accountant issues cash advance from mobile
// ══════════════════════════════════════════════════════════════════════════
const PURPOSE_META = {
  fuel:       { icon:'⛽', label:'Fuel',            color:'#b45309', bg:'#fffbeb' },
  parts:      { icon:'🔧', label:'Parts / Repair',  color:'#1d4ed8', bg:'#eff6ff' },
  transport:  { icon:'🚗', label:'Transport',        color:'#7c3aed', bg:'#f5f3ff' },
  allowance:  { icon:'💼', label:'Allowance',        color:'#0369a1', bg:'#e0f2fe' },
  food:       { icon:'🍽️', label:'Food',             color:'#059669', bg:'#ecfdf5' },
  misc:       { icon:'📦', label:'Miscellaneous',    color:'#64748b', bg:'#f1f5f9' },
};

const IssueAdvanceScreen = ({ retailer, navigate }) => {
  const [staff, setStaff]       = useState([]);
  const [search, setSearch]     = useState('');
  const [selected, setSelected] = useState(null);
  const [step, setStep]         = useState('pick'); // pick | form | confirm | done
  const [form, setForm]         = useState({ amount:'', currency:'USD', purpose:'fuel', description:'', project:'dishnet', expected_settle_at:'' });
  const [loading, setLoading]   = useState(false);
  const [result, setResult]     = useState(null);
  const [loadErr, setLoadErr]   = useState('');

  useEffect(() => {
    api.staffList()
      .then(d => setStaff((d.retailers || d || []).filter(s => s.is_active)))
      .catch(() => setLoadErr('Could not load staff list. Check connection.'));
  }, []);

  const filtered = staff.filter(s => {
    const q = search.toLowerCase();
    return !q || s.name.toLowerCase().includes(q) || (s.role||'').toLowerCase().includes(q);
  });

  const ROLE_COLORS = {
    admin:'#92400e', accountant:'#1e40af', support_leader:'#5b21b6',
    support:'#075985', support_engineer:'#075985', sales:'#166534',
    field_agent:'#9a3412', collection:'#9d174d',
  };
  const ROLE_BG = {
    admin:'#fef3c7', accountant:'#dbeafe', support_leader:'#ede9fe',
    support:'#e0f2fe', support_engineer:'#e0f2fe', sales:'#dcfce7',
    field_agent:'#ffedd5', collection:'#fce7f3',
  };
  const initials = (name='') => name.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

  const submit = async () => {
    if (!selected || !form.amount || parseFloat(form.amount) <= 0) return;
    setLoading(true);
    try {
      const res = await api.createAdvance({
        recipient_id:   selected.id,
        recipient_name: selected.name,
        amount:         parseFloat(form.amount),
        currency:       form.currency,
        purpose:        form.purpose,
        description:    form.description,
        project:        form.project,
        expected_settle_at: form.expected_settle_at || undefined,
      });
      setResult(res);
      setStep('done');
    } catch(e) {
      toast.error('Failed: ' + (e.message || 'Unknown error'));
    } finally {
      setLoading(false);
    }
  };

  const pm = PURPOSE_META[form.purpose] || PURPOSE_META.misc;
  const press   = e => { e.currentTarget.style.transform='scale(0.97)'; };
  const release = e => { e.currentTarget.style.transform='scale(1)'; };

  // ── STEP: Done ────────────────────────────────────────────────────────
  if (step === 'done') {
    const adv = result?.advance || result || {};
    return (
      <div style={{ padding:'32px 20px', textAlign:'center' }}>
        <div style={{ width:72, height:72, borderRadius:'50%', background:'#dcfce7', border:'3px solid #86efac', display:'flex', alignItems:'center', justifyContent:'center', fontSize:32, margin:'0 auto 16px' }}>✅</div>
        <div style={{ fontSize:22, fontWeight:900, color:'#0f172a', marginBottom:6 }}>Advance Issued!</div>
        <div style={{ fontSize:14, color:'#64748b', marginBottom:24 }}>Posted to company cashbook</div>

        <div style={{ background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:16, padding:'20px 16px', textAlign:'left', marginBottom:24 }}>
          <div style={{ fontFamily:'monospace', fontSize:13, fontWeight:800, color:'#2563eb', marginBottom:12 }}>{adv.advance_no || '—'}</div>
          {[
            ['Recipient', selected?.name],
            ['Amount', `${form.currency} ${parseFloat(form.amount).toFixed(2)}`],
            ['Purpose', pm.icon + ' ' + pm.label],
            ['Project', form.project === 'dishnet' ? 'DishNet Africa' : 'DishNet 4G'],
          ].map(([k,v]) => (
            <div key={k} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #f1f5f9' }}>
              <span style={{ fontSize:12, color:'#64748b' }}>{k}</span>
              <span style={{ fontSize:13, fontWeight:700, color:'#0f172a' }}>{v}</span>
            </div>
          ))}
        </div>

        <div style={{ display:'grid', gap:10 }}>
          <button onClick={() => { setStep('pick'); setSelected(null); setSearch(''); setForm({ amount:'', currency:'USD', purpose:'fuel', description:'', project:'dishnet', expected_settle_at:'' }); setResult(null); }}
            style={{ background:'#0f172a', color:'#fff', border:'none', borderRadius:14, padding:'16px', fontSize:15, fontWeight:800, cursor:'pointer' }}>
            + Issue Another Advance
          </button>
          <button onClick={() => navigate('advances_overview')}
            style={{ background:'#f1f5f9', color:'#475569', border:'none', borderRadius:14, padding:'14px', fontSize:14, fontWeight:700, cursor:'pointer' }}>
            View All Advances →
          </button>
        </div>
      </div>
    );
  }

  // ── STEP: Confirm ─────────────────────────────────────────────────────
  if (step === 'confirm') {
    return (
      <div style={{ padding:'20px 16px', paddingBottom:'calc(100px + env(safe-area-inset-bottom))' }}>
        <div style={{ background:'linear-gradient(135deg,#0f172a,#1e293b)', borderRadius:20, padding:'20px', marginBottom:16 }}>
          <div style={{ fontSize:11, color:'rgba(255,255,255,.4)', fontWeight:700, textTransform:'uppercase', letterSpacing:1, marginBottom:4 }}>Issuing to</div>
          <div style={{ fontSize:20, fontWeight:900, color:'#fff' }}>{selected?.name}</div>
          <div style={{ marginTop:4 }}><span style={{ fontSize:11, padding:'2px 8px', borderRadius:20, background:ROLE_BG[selected?.role]||'#f1f5f9', color:ROLE_COLORS[selected?.role]||'#475569', fontWeight:700 }}>{selected?.role}</span></div>
        </div>

        <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:16, overflow:'hidden', marginBottom:16 }}>
          <div style={{ padding:'14px 16px', background:pm.bg, borderBottom:'1px solid #e2e8f0', display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ fontSize:24 }}>{pm.icon}</span>
            <div>
              <div style={{ fontSize:13, fontWeight:800, color:pm.color }}>{pm.label}</div>
              <div style={{ fontSize:11, color:'#94a3b8' }}>{form.project === 'dishnet' ? 'DishNet Africa' : 'DishNet 4G'}</div>
            </div>
            <div style={{ marginLeft:'auto', fontSize:26, fontWeight:900, color:pm.color }}>{form.currency} {parseFloat(form.amount||0).toFixed(2)}</div>
          </div>
          {form.description && (
            <div style={{ padding:'12px 16px', fontSize:13, color:'#475569', borderBottom:'1px solid #f1f5f9' }}>{form.description}</div>
          )}
          {form.expected_settle_at && (
            <div style={{ padding:'10px 16px', display:'flex', justifyContent:'space-between', fontSize:12 }}>
              <span style={{ color:'#94a3b8' }}>Settle by</span>
              <span style={{ fontWeight:700, color:'#0f172a' }}>{form.expected_settle_at}</span>
            </div>
          )}
        </div>

        <div style={{ background:'#fef3c7', border:'1px solid #fcd34d', borderRadius:12, padding:'12px 14px', marginBottom:20, fontSize:12, color:'#92400e' }}>
          ⚠️ This will immediately post <strong>{form.currency} {parseFloat(form.amount||0).toFixed(2)} OUT</strong> to the company cashbook.
        </div>

        <div style={{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:10 }}>
          <button onClick={() => setStep('form')}
            style={{ background:'#f1f5f9', border:'none', borderRadius:14, padding:'16px', fontSize:14, fontWeight:700, color:'#475569', cursor:'pointer' }}>
            ← Edit
          </button>
          <button onClick={submit} disabled={loading}
            style={{ background: loading ? '#94a3b8' : '#059669', color:'#fff', border:'none', borderRadius:14, padding:'16px', fontSize:15, fontWeight:800, cursor: loading ? 'default' : 'pointer' }}
            onTouchStart={press} onTouchEnd={release}>
            {loading ? '⏳ Posting…' : '✅ Confirm & Issue'}
          </button>
        </div>
      </div>
    );
  }

  // ── STEP: Form ────────────────────────────────────────────────────────
  if (step === 'form') {
    const canContinue = form.amount && parseFloat(form.amount) > 0;
    return (
      <div style={{ padding:'16px', paddingBottom:'calc(100px + env(safe-area-inset-bottom))' }}>
        {/* Recipient chip */}
        <div style={{ background:'#f0fdf4', border:'1px solid #86efac', borderRadius:12, padding:'10px 14px', display:'flex', alignItems:'center', gap:10, marginBottom:20 }}>
          <div style={{ width:36, height:36, borderRadius:'50%', background:ROLE_BG[selected?.role]||'#f1f5f9', color:ROLE_COLORS[selected?.role]||'#475569', display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:800, flexShrink:0 }}>
            {initials(selected?.name)}
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:14, fontWeight:800, color:'#0f172a' }}>{selected?.name}</div>
            <div style={{ fontSize:10, color:'#059669', fontWeight:700 }}>✓ Recipient selected</div>
          </div>
          <button onClick={() => { setSelected(null); setStep('pick'); }}
            style={{ background:'none', border:'none', fontSize:18, color:'#94a3b8', cursor:'pointer', padding:'4px 8px' }}>✕</button>
        </div>

        {/* Purpose grid */}
        <div style={{ fontSize:12, fontWeight:800, color:'#374151', marginBottom:8 }}>Purpose *</div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginBottom:16 }}>
          {Object.entries(PURPOSE_META).map(([key, meta]) => (
            <button key={key} onClick={() => setForm({...form, purpose:key})}
              style={{ background: form.purpose===key ? meta.bg : '#f8fafc', border:`2px solid ${form.purpose===key ? meta.color : '#e2e8f0'}`, borderRadius:12, padding:'12px 8px', cursor:'pointer', textAlign:'center', transition:'all .15s' }}>
              <div style={{ fontSize:22 }}>{meta.icon}</div>
              <div style={{ fontSize:10, fontWeight:800, color: form.purpose===key ? meta.color : '#94a3b8', marginTop:4 }}>{meta.label}</div>
            </button>
          ))}
        </div>

        {/* Amount + currency */}
        <div style={{ fontSize:12, fontWeight:800, color:'#374151', marginBottom:8 }}>Amount *</div>
        <div style={{ display:'grid', gridTemplateColumns:'80px 1fr', gap:8, marginBottom:16 }}>
          <select value={form.currency} onChange={e=>setForm({...form, currency:e.target.value})}
            style={{ border:'1.5px solid #e2e8f0', borderRadius:12, padding:'13px 10px', fontSize:14, fontFamily:'inherit', background:'#fff' }}>
            <option value="USD">USD</option>
            <option value="SSP">SSP</option>
          </select>
          <input type="number" min="0.01" step="0.01" placeholder="0.00" value={form.amount}
            onChange={e=>setForm({...form, amount:e.target.value})}
            style={{ border:`1.5px solid ${canContinue?'#10b981':'#e2e8f0'}`, borderRadius:12, padding:'13px 14px', fontSize:20, fontWeight:800, fontFamily:'inherit', width:'100%', outline:'none', boxSizing:'border-box', color:'#0f172a', background:'#fff' }} />
        </div>

        {/* Description */}
        <div style={{ fontSize:12, fontWeight:800, color:'#374151', marginBottom:8 }}>Description</div>
        <input type="text" placeholder={`e.g. Fuel for Gudele East sites`} value={form.description}
          onChange={e=>setForm({...form, description:e.target.value})}
          style={{ width:'100%', border:'1.5px solid #e2e8f0', borderRadius:12, padding:'13px 14px', fontSize:14, fontFamily:'inherit', marginBottom:16, boxSizing:'border-box', background:'#fff' }} />

        {/* Project + settle date */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:24 }}>
          <div>
            <div style={{ fontSize:12, fontWeight:800, color:'#374151', marginBottom:6 }}>Project</div>
            <select value={form.project} onChange={e=>setForm({...form, project:e.target.value})}
              style={{ width:'100%', border:'1.5px solid #e2e8f0', borderRadius:12, padding:'11px 12px', fontSize:13, fontFamily:'inherit', background:'#fff' }}>
              <option value="dishnet">DishNet Africa</option>
              <option value="4g">DishNet 4G</option>
            </select>
          </div>
          <div>
            <div style={{ fontSize:12, fontWeight:800, color:'#374151', marginBottom:6 }}>Settle by</div>
            <input type="date" min={new Date().toISOString().slice(0,10)} value={form.expected_settle_at}
              onChange={e=>setForm({...form, expected_settle_at:e.target.value})}
              style={{ width:'100%', border:'1.5px solid #e2e8f0', borderRadius:12, padding:'11px 12px', fontSize:13, fontFamily:'inherit', background:'#fff', boxSizing:'border-box' }} />
          </div>
        </div>

        <button onClick={() => canContinue && setStep('confirm')} disabled={!canContinue}
          style={{ width:'100%', background: canContinue ? '#0f172a' : '#e2e8f0', color: canContinue ? '#fff' : '#94a3b8', border:'none', borderRadius:14, padding:'17px', fontSize:16, fontWeight:800, cursor: canContinue ? 'pointer' : 'default' }}
          onTouchStart={canContinue ? press : undefined} onTouchEnd={canContinue ? release : undefined}>
          Review & Confirm →
        </button>
      </div>
    );
  }

  // ── STEP: Pick recipient ──────────────────────────────────────────────
  return (
    <div style={{ paddingBottom:80 }}>
      {loadErr && <div style={{ margin:'12px 16px', background:'#fef2f2', border:'1px solid #fecaca', borderRadius:10, padding:'10px 14px', fontSize:12, color:'#dc2626' }}>{loadErr}</div>}

      {/* Search bar */}
      <div style={{ padding:'12px 16px', position:'sticky', top:0, background:'rgba(246,247,251,.96)', backdropFilter:'blur(12px)', zIndex:10, borderBottom:'1px solid rgba(0,0,0,.05)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, background:'#fff', border:'1.5px solid #e2e8f0', borderRadius:14, padding:'11px 14px' }}>
          <span style={{ fontSize:16 }}>🔍</span>
          <input autoFocus type="text" placeholder="Search staff by name or role…" value={search}
            onChange={e=>setSearch(e.target.value)}
            style={{ border:'none', background:'transparent', outline:'none', fontSize:14, fontFamily:'inherit', flex:1, color:'#0f172a' }} />
          {search && <button onClick={()=>setSearch('')} style={{ background:'none', border:'none', color:'#94a3b8', fontSize:18, cursor:'pointer', padding:0 }}>✕</button>}
        </div>
        <div style={{ fontSize:11, color:'#94a3b8', marginTop:6, textAlign:'center' }}>
          {filtered.length} active staff member{filtered.length!==1?'s':''}
        </div>
      </div>

      {/* Staff list */}
      <div>
        {filtered.length === 0 && (
          <div style={{ padding:'40px 20px', textAlign:'center', color:'#94a3b8', fontSize:14 }}>No staff found for "{search}"</div>
        )}
        {filtered.map(s => {
          const role = s.role || 'staff';
          const rc   = ROLE_COLORS[role] || '#475569';
          const rb   = ROLE_BG[role] || '#f1f5f9';
          return (
            <button key={s.id} onClick={() => { setSelected(s); setStep('form'); }}
              style={{ width:'100%', background:'#fff', border:'none', borderBottom:'1px solid #f1f5f9', padding:'14px 16px', display:'flex', alignItems:'center', gap:12, cursor:'pointer', textAlign:'left', transition:'background .1s' }}
              onTouchStart={e=>e.currentTarget.style.background='#f8fafc'}
              onTouchEnd={e=>e.currentTarget.style.background='#fff'}>
              <div style={{ width:44, height:44, borderRadius:'50%', background:rb, color:rc, display:'flex', alignItems:'center', justifyContent:'center', fontSize:15, fontWeight:800, flexShrink:0 }}>
                {initials(s.name)}
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:15, fontWeight:700, color:'#0f172a', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{s.name}</div>
                <div style={{ marginTop:3 }}>
                  <span style={{ fontSize:10, fontWeight:800, padding:'2px 8px', borderRadius:20, background:rb, color:rc }}>{role}</span>
                </div>
              </div>
              <div style={{ fontSize:20, color:'#cbd5e1' }}>›</div>
            </button>
          );
        })}
      </div>
    </div>
  );
};

// AdvancesOverviewScreen — see all active/recent advances + settle
// ══════════════════════════════════════════════════════════════════════════
const AdvancesOverviewScreen = ({ retailer, navigate }) => {
  const isAdmin = retailer && (retailer.is_admin || isAdminRole(retailer.role || ''));
  const [advances, setAdvances]   = useState([]);
  const [loading, setLoading]     = useState(true);
  const [filter, setFilter]       = useState('active');
  const [settling, setSettling]   = useState(null); // advance being settled
  const [settleAmt, setSettleAmt] = useState('');
  const [settleNote, setSettleNote] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const load = () => {
    setLoading(true);
    const fn = isAdmin
      ? api.allAdvances({ limit: 60 })
      : api.myAdvances();
    fn.then(d => { setAdvances(d.advances || d || []); setLoading(false); })
      .catch(() => setLoading(false));
  };
  useEffect(load, []);

  const STATUS_STYLE = {
    active:   { bg:'#eff6ff', color:'#1d4ed8', label:'Active' },
    partial:  { bg:'#fffbeb', color:'#b45309', label:'Partial' },
    settled:  { bg:'#f0fdf4', color:'#059669', label:'Settled' },
    cancelled:{ bg:'#f8fafc', color:'#94a3b8', label:'Cancelled' },
  };
  const filtered = advances.filter(a => filter === 'all' || a.status === filter || (filter==='active' && a.status==='partial'));
  const totalActive = advances.filter(a=>a.status==='active'||a.status==='partial').reduce((s,a)=>s+parseFloat(a.amount||0),0);
  const totalOut    = advances.filter(a=>a.status==='active'||a.status==='partial').reduce((s,a)=>s+parseFloat(a.balance||0),0);

  const doSettle = async () => {
    if (!settling) return;
    setSubmitting(true);
    try {
      await api.settleAdvance({ advance_id: settling.id, return_amount: parseFloat(settleAmt||0), note: settleNote });
      toast.success('✅ Advance settled');
      setSettling(null);
      load();
    } catch(e) {
      toast.error('Failed: ' + (e.message||'Error'));
    } finally { setSubmitting(false); }
  };

  const press   = e => { e.currentTarget.style.transform='scale(0.97)'; };
  const release = e => { e.currentTarget.style.transform='scale(1)'; };

  return (
    <div style={{ paddingBottom:'calc(100px + env(safe-area-inset-bottom))' }}>
      {/* Summary cards */}
      <div style={{ background:'linear-gradient(160deg,#0f172a,#1e293b)', padding:'16px 16px 20px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div style={{ background:'rgba(37,99,235,.18)', border:'1px solid rgba(37,99,235,.3)', borderRadius:14, padding:'12px 14px' }}>
            <div style={{ fontSize:9, color:'rgba(255,255,255,.4)', fontWeight:700, textTransform:'uppercase', letterSpacing:.8 }}>💸 Advances Issued</div>
            <div style={{ fontSize:22, fontWeight:900, color:'#60a5fa', marginTop:4 }}>${totalActive.toFixed(2)}</div>
          </div>
          <div style={{ background:'rgba(239,68,68,.15)', border:'1px solid rgba(239,68,68,.25)', borderRadius:14, padding:'12px 14px' }}>
            <div style={{ fontSize:9, color:'rgba(255,255,255,.4)', fontWeight:700, textTransform:'uppercase', letterSpacing:.8 }}>⏳ Outstanding</div>
            <div style={{ fontSize:22, fontWeight:900, color:'#f87171', marginTop:4 }}>${totalOut.toFixed(2)}</div>
          </div>
        </div>
        {isAdmin && (
          <button onClick={() => navigate('issue_advance')}
            style={{ width:'100%', marginTop:12, background:'rgba(5,150,105,.2)', border:'1px solid rgba(5,150,105,.4)', borderRadius:14, padding:'13px', color:'#4ade80', fontSize:14, fontWeight:800, cursor:'pointer' }}
            onTouchStart={press} onTouchEnd={release}>
            + Issue New Advance
          </button>
        )}
      </div>

      {/* Filter tabs */}
      <div style={{ display:'flex', gap:0, background:'#fff', borderBottom:'1px solid #e2e8f0' }}>
        {['active','settled','all'].map(f => (
          <button key={f} onClick={()=>setFilter(f)}
            style={{ flex:1, padding:'12px', fontSize:12, fontWeight:800, background:'none', border:'none', borderBottom:`2px solid ${filter===f?'#0f172a':'transparent'}`, color: filter===f?'#0f172a':'#94a3b8', cursor:'pointer', textTransform:'capitalize' }}>
            {f === 'active' ? '🟡 Active' : f === 'settled' ? '✅ Settled' : '📋 All'}
          </button>
        ))}
      </div>

      {/* List */}
      {loading ? (
        <div style={{ padding:'40px', textAlign:'center', color:'#94a3b8', fontSize:14 }}>Loading…</div>
      ) : filtered.length === 0 ? (
        <div style={{ padding:'40px', textAlign:'center', color:'#94a3b8', fontSize:14 }}>No advances in this view</div>
      ) : filtered.map(adv => {
        const bal   = parseFloat(adv.balance || adv.amount || 0);
        const total = parseFloat(adv.amount || 0);
        const spent = parseFloat(adv.amount_spent || 0);
        const ss    = STATUS_STYLE[adv.status] || STATUS_STYLE.active;
        const pct   = total > 0 ? Math.min(100, (spent/total)*100) : 0;
        const pm    = PURPOSE_META[adv.purpose] || PURPOSE_META.misc;
        const canSettle = isAdmin && (adv.status==='active'||adv.status==='partial');

        return (
          <div key={adv.id} style={{ background:'#fff', borderBottom:'1px solid #f1f5f9', padding:'16px', position:'relative' }}>
            {/* Row header */}
            <div style={{ display:'flex', alignItems:'flex-start', gap:12, marginBottom:10 }}>
              <div style={{ width:40, height:40, borderRadius:12, background:pm.bg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>
                {pm.icon}
              </div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
                  <span style={{ fontFamily:'monospace', fontSize:11, fontWeight:700, color:'#2563eb' }}>{adv.advance_no}</span>
                  <span style={{ fontSize:10, padding:'2px 8px', borderRadius:20, background:ss.bg, color:ss.color, fontWeight:700 }}>{ss.label}</span>
                </div>
                <div style={{ fontSize:15, fontWeight:800, color:'#0f172a', marginTop:2 }}>{adv.recipient_name}</div>
                <div style={{ fontSize:11, color:'#94a3b8', marginTop:1 }}>{pm.label} · {adv.purpose}</div>
              </div>
              <div style={{ textAlign:'right', flexShrink:0 }}>
                <div style={{ fontSize:18, fontWeight:900, color: bal > 0 ? '#ef4444' : '#059669' }}>
                  {adv.currency || 'USD'} {bal.toFixed(2)}
                </div>
                <div style={{ fontSize:10, color:'#94a3b8', marginTop:1 }}>of {total.toFixed(2)}</div>
              </div>
            </div>

            {/* Progress bar */}
            {total > 0 && (
              <div style={{ marginBottom:10 }}>
                <div style={{ display:'flex', justifyContent:'space-between', fontSize:10, color:'#94a3b8', marginBottom:4 }}>
                  <span>Spent: {adv.currency||'USD'} {spent.toFixed(2)}</span>
                  <span>Remaining: {adv.currency||'USD'} {bal.toFixed(2)}</span>
                </div>
                <div style={{ height:6, background:'#f1f5f9', borderRadius:99, overflow:'hidden' }}>
                  <div style={{ height:'100%', width:`${pct}%`, background: pct>=100 ? '#10b981' : '#f59e0b', borderRadius:99, transition:'width .4s' }} />
                </div>
              </div>
            )}

            {adv.description && (
              <div style={{ fontSize:12, color:'#64748b', marginBottom:10, background:'#f8fafc', padding:'8px 10px', borderRadius:8 }}>{adv.description}</div>
            )}

            {/* Settle button */}
            {canSettle && (
              <button onClick={() => { setSettling(adv); setSettleAmt(bal.toFixed(2)); setSettleNote(''); }}
                style={{ width:'100%', background:'#f0fdf4', border:'1px solid #86efac', borderRadius:10, padding:'10px', fontSize:13, fontWeight:700, color:'#059669', cursor:'pointer' }}
                onTouchStart={press} onTouchEnd={release}>
                ✅ Settle Advance
              </button>
            )}
          </div>
        );
      })}

      {/* Settle bottom sheet */}
      {settling && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:9999, display:'flex', alignItems:'flex-end' }}
             onClick={e => e.target===e.currentTarget && setSettling(null)}>
          <div style={{ width:'100%', background:'#fff', borderRadius:'24px 24px 0 0', padding:'20px 16px 40px', maxHeight:'80vh', overflowY:'auto' }}>
            <div style={{ width:40, height:4, background:'#e2e8f0', borderRadius:2, margin:'0 auto 16px' }} />
            <div style={{ fontSize:18, fontWeight:900, color:'#0f172a', marginBottom:4 }}>Settle Advance</div>
            <div style={{ fontSize:13, color:'#64748b', marginBottom:16 }}>{settling.advance_no} · {settling.recipient_name}</div>
            <div style={{ background:'#fffbeb', border:'1px solid #fde68a', borderRadius:12, padding:'12px 14px', marginBottom:16, fontSize:13, color:'#92400e' }}>
              Outstanding: <strong>{settling.currency||'USD'} {parseFloat(settling.balance||settling.amount||0).toFixed(2)}</strong>
            </div>
            <div style={{ fontSize:12, fontWeight:700, color:'#374151', marginBottom:6 }}>Cash returned by staff</div>
            <input type="number" min="0" step="0.01" value={settleAmt} onChange={e=>setSettleAmt(e.target.value)}
              style={{ width:'100%', border:'1.5px solid #e2e8f0', borderRadius:12, padding:'14px', fontSize:18, fontWeight:800, fontFamily:'inherit', marginBottom:14, boxSizing:'border-box', background:'#fff' }} />
            <div style={{ fontSize:12, fontWeight:700, color:'#374151', marginBottom:6 }}>Settlement note</div>
            <input type="text" placeholder="e.g. All receipts submitted, change returned" value={settleNote}
              onChange={e=>setSettleNote(e.target.value)}
              style={{ width:'100%', border:'1.5px solid #e2e8f0', borderRadius:12, padding:'13px 14px', fontSize:14, fontFamily:'inherit', marginBottom:20, boxSizing:'border-box', background:'#fff' }} />
            <div style={{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:10 }}>
              <button onClick={()=>setSettling(null)} style={{ background:'#f1f5f9', border:'none', borderRadius:12, padding:'14px', fontSize:14, fontWeight:700, color:'#475569', cursor:'pointer' }}>Cancel</button>
              <button onClick={doSettle} disabled={submitting}
                style={{ background: submitting ? '#94a3b8' : '#059669', color:'#fff', border:'none', borderRadius:12, padding:'14px', fontSize:15, fontWeight:800, cursor: submitting ? 'default' : 'pointer' }}>
                {submitting ? '⏳ Settling…' : 'Confirm Settle'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const OFFLINE_QUEUE_KEY = "dn_expense_offline_queue";

function loadOfflineQueue() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY) || "[]"); }
  catch(e) { return []; }
}
function saveOfflineQueue(q) {
  try { localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(q)); } catch(e) {}
}

const ExpenseScreen = ({ retailer, navigate }) => {
  const [advances, setAdvances]     = useState([]);
  const [form, setForm]             = useState({ advance_id:"", category:"fuel", amount:"", description:"", expense_date: new Date().toISOString().slice(0,10), currency:"USD" });
  const [photoFile, setPhotoFile]   = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted]   = useState(false);
  const [warnings, setWarnings]     = useState([]);
  const [offlineQ, setOfflineQ]     = useState(loadOfflineQueue);
  const [syncing, setSyncing]       = useState(false);
  const [loadErr, setLoadErr]       = useState(null);

  const CATS = [
    { v:"fuel",      label:"⛽ Fuel"         },
    { v:"parts",     label:"🔧 Parts/Repair"  },
    { v:"transport", label:"🚌 Transport"      },
    { v:"allowance", label:"💵 Allowance"      },
    { v:"food",      label:"🍽️ Food/Catering"  },
    { v:"other",     label:"📋 Other"          },
  ];

  useEffect(() => {
    api.myAdvances().then(d => setAdvances(d.advances || d || [])).catch(() => setLoadErr("Could not load advances — you can still submit without linking one."));
  }, []);

  // Attempt to sync offline queue when component mounts
  useEffect(() => {
    if (offlineQ.length > 0) syncOfflineQueue();
  }, []);

  const handlePhoto = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setPhotoFile(f);
    const reader = new FileReader();
    reader.onload = ev => setPhotoPreview(ev.target.result);
    reader.readAsDataURL(f);
  };

  const generateOfflineUuid = () => {
    return "pwa-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
  };

  const buildFormData = (offlineUuid) => {
    const fd = new FormData();
    fd.append("advance_id",    form.advance_id);
    fd.append("category",      form.category);
    fd.append("amount",        form.amount);
    fd.append("currency",      form.currency);
    fd.append("description",   form.description);
    fd.append("expense_date",  form.expense_date);
    fd.append("offline_uuid",  offlineUuid);
    fd.append("submitted_via", "pwa");
    if (photoFile) fd.append("receipt", photoFile, photoFile.name);
    return fd;
  };

  const handleSubmit = async () => {
    if (!form.amount || parseFloat(form.amount) <= 0) {
      toast.error("Please enter a valid amount.");
      return;
    }
    const offlineUuid = generateOfflineUuid();
    setSubmitting(true);
    setWarnings([]);
    try {
      const fd = buildFormData(offlineUuid);
      const result = await api.expenseSubmit(fd);
      setSubmitted(true);
      setWarnings(result.warnings || []);
      // Reset form
      setForm({ advance_id:"", category:"fuel", amount:"", description:"", expense_date: new Date().toISOString().slice(0,10), currency:"USD" });
      setPhotoFile(null); setPhotoPreview(null);
      toast.success("✅ Expense submitted — " + (result.expense_no || ""));
    } catch(err) {
      // Network failure → save to offline queue
      if (!navigator.onLine || err.message.includes("fetch") || err.message.includes("network")) {
        const qItem = {
          uuid:         offlineUuid,
          form:         { ...form },
          photoDataUrl: photoPreview,
          photoName:    photoFile ? photoFile.name : null,
          queued_at:    new Date().toISOString(),
        };
        const newQ = [...offlineQ, qItem];
        setOfflineQ(newQ);
        saveOfflineQueue(newQ);
        toast.warn("📶 No connection — saved offline. Will sync when back online.");
      } else {
        toast.error("❌ " + err.message);
      }
    } finally {
      setSubmitting(false);
    }
  };

  const syncOfflineQueue = async () => {
    if (syncing || offlineQ.length === 0) return;
    setSyncing(true);
    let remaining = [...offlineQ];
    let synced = 0;
    for (const item of [...offlineQ]) {
      try {
        const fd = new FormData();
        Object.entries(item.form).forEach(([k,v]) => fd.append(k, v));
        fd.append("offline_uuid",  item.uuid);
        fd.append("submitted_via", "pwa_offline");
        if (item.photoDataUrl && item.photoName) {
          const res  = await fetch(item.photoDataUrl);
          const blob = await res.blob();
          fd.append("receipt", blob, item.photoName);
        }
        await api.expenseSubmit(fd);
        remaining = remaining.filter(r => r.uuid !== item.uuid);
        synced++;
      } catch(e) {
        // Keep in queue if still failing
      }
    }
    setOfflineQ(remaining);
    saveOfflineQueue(remaining);
    setSyncing(false);
    if (synced > 0) toast.success("📤 Synced " + synced + " offline expense(s).");
  };

  // Listen for online event to trigger sync
  useEffect(() => {
    const handler = () => { if (offlineQ.length > 0) syncOfflineQueue(); };
    window.addEventListener("online", handler);
    return () => window.removeEventListener("online", handler);
  }, [offlineQ]);

  if (submitted) return (
    <div style={{ padding:"32px 20px", textAlign:"center" }}>
      <div style={{ fontSize:56, marginBottom:16 }}>✅</div>
      <div style={{ fontSize:20, fontWeight:900, color:"#166534", marginBottom:8 }}>Expense Submitted!</div>
      {warnings.length > 0 && (
        <div style={{ background:"#fffbeb", border:"1px solid #fde68a", borderRadius:12, padding:"12px 16px", marginBottom:16, textAlign:"left" }}>
          {warnings.map((w,i) => <div key={i} style={{ fontSize:13, color:"#92400e", marginBottom:4 }}>{w}</div>)}
        </div>
      )}
      <button onClick={() => setSubmitted(false)}
              style={{ background:"#0f172a", color:"#fff", border:"none", borderRadius:14, padding:"14px 32px", fontSize:15, fontWeight:800, cursor:"pointer" }}>
        Submit Another
      </button>
    </div>
  );

  return (
    <div style={{ padding:"16px 16px 100px" }}>

      {/* Offline queue badge */}
      {offlineQ.length > 0 && (
        <div style={{ background:"#fffbeb", border:"1.5px solid #fde68a", borderRadius:12, padding:"12px 16px", marginBottom:14, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <span style={{ fontSize:13, fontWeight:700, color:"#92400e" }}>
            📶 {offlineQ.length} expense(s) queued offline
          </span>
          <button onClick={syncOfflineQueue} disabled={syncing}
                  style={{ background:"#d97706", color:"#fff", border:"none", borderRadius:8, padding:"6px 14px", fontSize:12, fontWeight:700, cursor:"pointer" }}>
            {syncing ? "Syncing…" : "Sync Now"}
          </button>
        </div>
      )}

      {loadErr && (
        <div style={{ background:"#fffbeb", border:"1px solid #fde68a", borderRadius:10, padding:"10px 14px", fontSize:13, color:"#92400e", marginBottom:12 }}>
          ⚠️ {loadErr}
        </div>
      )}

      <div style={{ display:"grid", gap:14 }}>

        {/* Link to advance */}
        <div>
          <div style={{ fontSize:12, fontWeight:700, color:"#374151", marginBottom:6 }}>Link to Cash Advance (optional)</div>
          <select value={form.advance_id} onChange={e => setForm({...form, advance_id:e.target.value})}
                  style={{ width:"100%", border:"1.5px solid #e2e8f0", borderRadius:12, padding:"12px 14px", fontSize:14, fontFamily:"inherit", background:"#fff" }}>
            <option value="">— No advance — expense only —</option>
            {advances.filter(a => a.status === "active" || a.status === "partial").map(a => (
              <option key={a.id} value={a.id}>
                {a.advance_no} · ${parseFloat(a.balance || 0).toFixed(2)} remaining · {a.purpose}
              </option>
            ))}
          </select>
        </div>

        {/* Category */}
        <div>
          <div style={{ fontSize:12, fontWeight:700, color:"#374151", marginBottom:8 }}>Category *</div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
            {CATS.map(c => (
              <button key={c.v} onClick={() => setForm({...form, category:c.v})}
                      style={{ background: form.category===c.v ? "#0f172a" : "#f8fafc", color: form.category===c.v ? "#fff" : "#374151", border: form.category===c.v ? "none" : "1.5px solid #e2e8f0", borderRadius:12, padding:"10px 6px", fontSize:12, fontWeight:700, cursor:"pointer", textAlign:"center" }}>
                {c.label}
              </button>
            ))}
          </div>
        </div>

        {/* Amount + currency */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr auto", gap:10 }}>
          <div>
            <div style={{ fontSize:12, fontWeight:700, color:"#374151", marginBottom:6 }}>Amount *</div>
            <input type="number" inputMode="decimal" step="0.01" min="0.01"
                   value={form.amount} onChange={e => setForm({...form, amount:e.target.value})}
                   placeholder="0.00"
                   style={{ width:"100%", border:"1.5px solid #e2e8f0", borderRadius:12, padding:"12px 14px", fontSize:18, fontFamily:"inherit", fontWeight:800, boxSizing:"border-box" }} />
          </div>
          <div>
            <div style={{ fontSize:12, fontWeight:700, color:"#374151", marginBottom:6 }}>Currency</div>
            <select value={form.currency} onChange={e => setForm({...form, currency:e.target.value})}
                    style={{ border:"1.5px solid #e2e8f0", borderRadius:12, padding:"12px 14px", fontSize:14, fontFamily:"inherit", background:"#fff" }}>
              <option value="USD">USD</option>
              <option value="SSP">SSP</option>
            </select>
          </div>
        </div>

        {/* Date */}
        <div>
          <div style={{ fontSize:12, fontWeight:700, color:"#374151", marginBottom:6 }}>Date of Expense *</div>
          <input type="date" value={form.expense_date} max={new Date().toISOString().slice(0,10)}
                 onChange={e => setForm({...form, expense_date:e.target.value})}
                 style={{ width:"100%", border:"1.5px solid #e2e8f0", borderRadius:12, padding:"12px 14px", fontSize:14, fontFamily:"inherit", boxSizing:"border-box" }} />
        </div>

        {/* Description */}
        <div>
          <div style={{ fontSize:12, fontWeight:700, color:"#374151", marginBottom:6 }}>Description</div>
          <input type="text" value={form.description} maxLength={200}
                 onChange={e => setForm({...form, description:e.target.value})}
                 placeholder="e.g. Fuel Juba–Gudele, 20L"
                 style={{ width:"100%", border:"1.5px solid #e2e8f0", borderRadius:12, padding:"12px 14px", fontSize:14, fontFamily:"inherit", boxSizing:"border-box" }} />
        </div>

        {/* Receipt photo */}
        <div>
          <div style={{ fontSize:12, fontWeight:700, color:"#374151", marginBottom:6 }}>Receipt Photo (strongly recommended)</div>
          {photoPreview ? (
            <div style={{ position:"relative", display:"inline-block" }}>
              <img src={photoPreview} alt="Receipt" style={{ width:"100%", maxHeight:220, objectFit:"cover", borderRadius:12, border:"2px solid #e2e8f0" }} />
              <button onClick={() => { setPhotoFile(null); setPhotoPreview(null); }}
                      style={{ position:"absolute", top:8, right:8, background:"rgba(0,0,0,.6)", color:"#fff", border:"none", borderRadius:20, width:28, height:28, cursor:"pointer", fontSize:16, display:"flex", alignItems:"center", justifyContent:"center" }}>
                ×
              </button>
            </div>
          ) : (
            <label style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8, padding:"24px 16px", background:"#f8fafc", border:"2px dashed #cbd5e1", borderRadius:12, cursor:"pointer" }}>
              <span style={{ fontSize:32 }}>📷</span>
              <span style={{ fontSize:13, fontWeight:700, color:"#374151" }}>Tap to take photo or upload</span>
              <span style={{ fontSize:11, color:"#94a3b8" }}>JPG, PNG or PDF · max 8MB</span>
              <input type="file" accept="image/*,application/pdf" capture="environment"
                     onChange={handlePhoto} style={{ display:"none" }} />
            </label>
          )}
          <div style={{ fontSize:11, color:"#94a3b8", marginTop:4 }}>
            ⚠️ Expenses without receipts are flagged for review and may be rejected.
          </div>
        </div>

        {/* Submit */}
        <button onClick={handleSubmit} disabled={submitting || !form.amount}
                style={{ background: (submitting || !form.amount) ? "#94a3b8" : "#0f172a", color:"#fff", border:"none", borderRadius:14, padding:"16px", fontSize:16, fontWeight:800, cursor: (submitting || !form.amount) ? "default" : "pointer", marginTop:4 }}>
          {submitting ? "⏳ Submitting…" : "📤 Submit Expense"}
        </button>

      </div>
    </div>
  );
};

// STOCK SCREEN — PWA mobile-first stock management
// Sub-tabs: My Equipment, In/Out Register, Scanner (leader only), Holdings

const STOCK_API = (a,p)=>{ let u='?page=stock_api&action='+a; if(p){let q=[];for(let k in p)if(p[k]!=null&&p[k]!=='')q.push(k+'='+encodeURIComponent(p[k]));if(q.length)u+='&'+q.join('&');}return u;};
const stockApi = (action, opts) => {
  const url = STOCK_API(action, opts?.params);
  const headers = { 'Content-Type':'application/json', 'Accept':'application/json' };
  if (api._token) headers['Authorization'] = 'Bearer ' + api._token;
  return fetch(url, { method: opts?.method||'GET', headers,
    body: opts?.body ? JSON.stringify(opts.body) : undefined
  }).then(r=>r.json());
};

const StockScreen = ({ retailer, navigate, initTab }) => {
  const [tab, setTab] = useState(initTab || 'equipment');
  const isLeader = retailer?.role === 'support_leader' || retailer?.is_admin;
  const rid = retailer?.id;
  const myName = retailer?.name || 'Staff';

  // ── My Equipment ──
  const EquipmentView = () => {
    const [items, setItems] = useState([]);
    const [loading, setLoading] = useState(true);
    const load = () => {
      setLoading(true);
      stockApi('stock_units', { params: { status:'checked_out', limit:200 } })
        .then(r => { setItems(r?.data?.items||[]); setLoading(false); })
        .catch(()=>setLoading(false));
    };
    useEffect(load, []);

    const doCheckin = (unitId, serial) => {
      const cond = prompt('Condition? (good / fair / damaged)', 'good');
      if (!cond) return;
      stockApi('stock_checkin', { method:'POST', body:{unit_id:unitId, condition:cond, note:'Returned via PWA'} })
        .then(r => { if(r?.status==='success') load(); else alert(r?.message||'Error'); });
    };
    const doInstall = (unitId) => {
      const client = prompt('Customer name:');
      if (!client) return;
      const crmId = prompt('CRM ID (optional):', '');
      stockApi('stock_install', { method:'POST', body:{unit_id:unitId, client_name:client, crm_client_id:parseInt(crmId)||0, note:'Installed via PWA'} })
        .then(r => { if(r?.status==='success') load(); else alert(r?.message||'Error'); });
    };

    if (loading) return <div style={{textAlign:'center',padding:40,color:'#94A3B8'}}>Loading...</div>;
    if (!items.length) return (
      <div style={{textAlign:'center',padding:'60px 20px'}}>
        <div style={{fontSize:48}}>✅</div>
        <div style={{fontSize:16,fontWeight:800,color:'#1E293B',marginTop:12}}>No equipment checked out</div>
        <div style={{fontSize:13,color:'#94A3B8',marginTop:4}}>You're all clear!</div>
      </div>
    );
    const totalVal = items.reduce((s,u)=>s+parseFloat(u.purchase_cost||0),0);
    return (
      <div>
        <div style={{display:'flex',gap:10,marginBottom:16}}>
          <div style={{flex:1,background:'#EFF6FF',borderRadius:12,padding:'12px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:'#2563EB'}}>{items.length}</div>
            <div style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase'}}>Items</div>
          </div>
          <div style={{flex:1,background:'#ECFDF5',borderRadius:12,padding:'12px',textAlign:'center'}}>
            <div style={{fontSize:24,fontWeight:900,color:'#059669'}}>${totalVal.toFixed(0)}</div>
            <div style={{fontSize:10,fontWeight:700,color:'#64748B',textTransform:'uppercase'}}>Value</div>
          </div>
        </div>
        {items.map(u => (
          <div key={u.id} style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:14,padding:'14px',marginBottom:8}}>
            <div style={{fontFamily:'monospace',fontSize:15,fontWeight:800,color:'#1E293B'}}>{u.serial_number||'—'}</div>
            <div style={{fontSize:12,color:'#64748B',marginTop:2}}>{u.category_name} · ${parseFloat(u.purchase_cost||0).toFixed(2)}</div>
