# DishNet Sudan — static site.
#
# The source was built for Netlify, whose _redirects file does nothing here.
# Every rule in it is reproduced below; without this, /faqs, /about-us,
# /contact-us, /device/1/view and a dozen others would 404.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Slow connections are the design constraint. Compress everything textual.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/rss+xml font/woff font/woff2;

    # Traefik terminates TLS in front, so send the client's real address on.
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  0.0.0.0/0;

    # Emit relative Location headers, so the browser keeps the scheme, host and
    # port it actually used. Left on (the default), nginx builds an absolute URL
    # from what IT sees -- plain http, port 8080, because Traefik terminates TLS
    # in front -- and every redirect below points at http://host:8080/..., which
    # is not publicly reachable. That silently breaks all 18 legacy URLs.
    absolute_redirect off;

    add_header X-Content-Type-Options  "nosniff"            always;
    add_header X-Frame-Options         "SAMEORIGIN"         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Nothing hidden, nothing listed. autoindex is off by default in nginx,
    # but a hardening property this load-bearing should not rest on a default.
    autoindex off;
    location ~ /\. { deny all; }
    # Netlify metadata that ships inside site/ but has no business being served.
    location = /_redirects { return 404; }

    # ── from _redirects ──────────────────────────────────────────────────
    location = /device            { return 301 /index.html#products; }
    location = /device/1/view     { return 301 /starlink-kits.html; }
    location = /device/2/view     { return 301 /starlink-kits.html; }
    location = /device/4/view     { return 301 /starlink-kits.html; }
    location = /device/6/view     { return 301 /starlink-kits.html; }
    location = /business          { return 301 /index.html#order; }
    location = /faqs              { return 301 /faq.html; }
    location = /about-us          { return 301 /about.html; }
    location = /contact-us        { return 301 /contact.html; }
    location = /terms-of-use      { return 301 /terms.html; }
    location = /services          { return 301 /services.html; }
    location = /fiber             { return 301 /starlink-plans-sudan.html; }
    location = /application       { return 301 /contact.html; }

    # ── end of _redirects ────────────────────────────────────────────────

    # Long cache for things whose content is fixed; short for pages, so a
    # content fix reaches people the same day.
    # Default for pages, including extensionless URLs served through try_files:
    # those bypass location matching, so a rule in the .html block never reaches
    # them and the browser would fall back to heuristic caching — which can pin
    # a stale page for days while the site is still being localised.
    expires 10m;

    # `expires` sets Cache-Control by itself. Adding our own as well emitted
    # two competing Cache-Control headers, and — because nginx drops every
    # inherited add_header the moment a block declares one of its own — it
    # also silently stripped the three security headers from every page.
    location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location = /robots.txt  { expires 1d; }
    location = /sitemap.xml { expires 1d; }

    # The APK, when one is dropped in. Without the MIME type Android refuses it.
    location ~* \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment';
        # Repeated, not redundant: the add_header above cancels inheritance.
        add_header X-Content-Type-Options "nosniff"    always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Extensionless URLs resolve to .html. Unknown paths are now a REAL 404 —
    # the Netlify catch-all served the homepage with 200, which reads to
    # search engines as thousands of duplicate pages (approved change, Phase 1).
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
